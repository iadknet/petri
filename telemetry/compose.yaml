# Petri's local telemetry stack (T21.F01): one grafana/otel-lgtm container.
# Grafana on http://127.0.0.1:3300 (admin/admin); OTLP on 127.0.0.1:4317
# (gRPC) and 127.0.0.1:4318 (HTTP). Data lives in the external volume
# petri-telemetry, which `make telemetry-up` creates and no `docker compose
# down -v` removes; nothing expires by age; retire it with
# `make telemetry-clean CUTOFF=<date or RFC3339>`. PETRI_LGTM_IMAGE,
# PETRI_TELEMETRY_VOLUME and PETRI_TELEMETRY_PROJECT exist for the scripts'
# scratch stacks (scripts/telemetry-scratch.sh), which create and remove their
# own volumes.
name: ${PETRI_TELEMETRY_PROJECT:-petri-telemetry}

services:
  lgtm:
    image: ${PETRI_LGTM_IMAGE:-grafana/otel-lgtm:0.34.0}
    ports:
      - "127.0.0.1:3300:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    environment:
      PROMETHEUS_EXTRA_ARGS: >-
        --storage.tsdb.retention.time=100y
        --storage.tsdb.retention.size=0
        --web.enable-admin-api
      LOKI_EXTRA_ARGS: >-
        -compactor.retention-enabled=true
        -compactor.delete-request-store=filesystem
        -compactor.delete-request-cancel-period=1m
        -compactor.retention-delete-delay=1m
        -compactor.compaction-interval=5m
        -distributor.max-line-size=4MB
        -store.max-query-length=0
    volumes:
      - data:/data
      - ./tempo-config.yaml:/otel-lgtm/tempo-config.yaml:ro
      # Petri dashboards (T21.F02), provisioned read-only.
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/petri.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/petri-dashboards:ro
      # Petri report pages, served by Grafana at /public/petri/ so they read
      # Tempo, Loki and Prometheus through its data source proxy.
      - ./reports:/otel-lgtm/grafana/public/petri:ro
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

volumes:
  data:
    name: ${PETRI_TELEMETRY_VOLUME:-petri-telemetry}
    external: true
