server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "127.0.0.1:4417"
        http:
          endpoint: "127.0.0.1:4418"

memberlist:
  bind_addr: [127.0.0.1]
  bind_port: 7947

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9096

storage:
  trace:
    backend: local
    wal:
      path: /data/tempo/wal
    local:
      path: /data/tempo/blocks

metrics_generator:
  processor:
    span_metrics:
      dimensions:
        - service_name
        - operation
        - status_code
  storage:
    path: /data/tempo/generator/wal
    remote_write:
      - url: http://127.0.0.1:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

# Petri (T21.F01): keep every block indefinitely; data is retired only by
# scripts/telemetry-cleanup. Everything above is the image's file (0.34.0).
# scripts/telemetry-verify only: a 1m compaction window (production keeps the
# image default, 1h) so blocks from different minutes stay apart.
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 876000h
        compaction_window: 1m

backend_worker:
  compaction:
    block_retention: 876000h
