      // Recorded events (a counter redefined at a closure): a hairline and a label.
      (cfg.marks || []).forEach((mk) => {
        if (!(mk.i >= 0 && mk.i < n)) return;
        const x = cfg.step ? m.l + s * mk.i : xAt(mk.i);
        svg.appendChild(svgEl('line', { class: 'ann', x1: x, x2: x, y1: m.t, y2: m.t + ih }));
        const right = x > m.l + iw / 2;
        const tx = svgEl('text', { class: 'ref-label', x: right ? x - 4 : x + 4, y: m.t + ih - 6, 'text-anchor': right ? 'end' : 'start' });
        tx.textContent = mk.label;
        svg.appendChild(tx);
      });
      (cfg.refLines || []).forEach((r) => {
        const y = yAt(r.y);
        if (!fin(y)) return;
        svg.appendChild(svgEl('line', { class: 'ref' + (r.floor ? ' floor' : ''), x1: m.l, x2: m.l + iw, y1: y, y2: y }));
        if (cfg.first || r.always) { const tx = svgEl('text', { class: 'ref-label', x: m.l + 4, y: y - 4 }); tx.textContent = r.label; svg.appendChild(tx); }
      });
      const x0 = (i) => m.l + s * i, x1 = (i) => m.l + s * (i + 1);
      if (cfg.band) {
        const b = cfg.band;
        const idx = [];
        for (let i = 0; i < n; i++) if (fin(yAt(b.lo[i])) && fin(yAt(b.hi[i]))) idx.push(i);
        // One polygon per unbroken run of measured closures.
        let run = [];
        const flush = () => {
          if (!run.length) return;
          const top = cfg.step ? run.map((i) => `${x0(i).toFixed(1)},${yAt(b.hi[i]).toFixed(1)} ${x1(i).toFixed(1)},${yAt(b.hi[i]).toFixed(1)}`) : run.map((i) => `${xAt(i).toFixed(1)},${yAt(b.hi[i]).toFixed(1)}`);
          const bot = cfg.step ? run.slice().reverse().map((i) => `${x1(i).toFixed(1)},${yAt(b.lo[i]).toFixed(1)} ${x0(i).toFixed(1)},${yAt(b.lo[i]).toFixed(1)}`) : run.slice().reverse().map((i) => `${xAt(i).toFixed(1)},${yAt(b.lo[i]).toFixed(1)}`);
          svg.appendChild(svgEl('polygon', { points: top.concat(bot).join(' '), fill: b.color, opacity: 0.14 }));
          run = [];
        };
        idx.forEach((i, k) => { if (k && i !== idx[k - 1] + 1) flush(); run.push(i); });
        flush();
      }
      cfg.series.forEach((sr) => {
        const d = cfg.step ? stepPath(sr.values, x0, x1, yAt) : (() => {
          let p = '', pen = false;
          sr.values.forEach((v, i) => { const y = yAt(v); if (!fin(y)) { pen = false; return; } p += (pen ? 'L' : 'M') + xAt(i).toFixed(1) + ',' + y.toFixed(1); pen = true; });
          return p;
        })();
        if (d) svg.appendChild(svgEl('path', { d, class: 'line' + (sr.emph ? ' emph' : '') + (sr.muted ? ' muted' : ''), stroke: sr.color }));
        if (!cfg.step) sr.values.forEach((v, i) => {
          const y = yAt(v);
          if (fin(y) && !fin(yAt(sr.values[i - 1])) && !fin(yAt(sr.values[i + 1]))) svg.appendChild(svgEl('circle', { cx: xAt(i), cy: y, r: 3, fill: sr.color }));
        });
        if (cfg.dom.log) sr.values.forEach((v, i) => { if (v === 0) svg.appendChild(svgEl('circle', { cx: xAt(i), cy: m.t + ih, r: 3.5, fill: 'var(--surface)', stroke: sr.color, 'stroke-width': 1.5 })); });
      });
      // The shown closure: a ringed dot per series, and its value beside the
      // series the chart is about.
      if (Number.isInteger(cfg.sel) && cfg.sel >= 0 && cfg.sel < n) {
        const labelled = cfg.series.filter((sr) => sr.emph || cfg.series.length === 1);
        cfg.series.forEach((sr) => {
          const y = yAt(sr.values[cfg.sel]);
          if (!fin(y)) return;
          svg.appendChild(svgEl('circle', { cx: xAt(cfg.sel), cy: y, r: 4, fill: sr.color, stroke: 'var(--surface)', 'stroke-width': 2 }));
        });
        labelled.slice(0, 1).forEach((sr) => {
          const v = sr.values[cfg.sel], y = yAt(v);
          if (!fin(y)) return;
          const x = xAt(cfg.sel);
          const right = x > m.l + iw * 0.7;
          const tx = svgEl('text', { class: 'vlab', x: right ? x - 8 : x + 8, y: Math.max(m.t + 10, y - 7), 'text-anchor': right ? 'end' : 'start' });
          tx.textContent = (cfg.tipFmt || fmt)(v);
          svg.appendChild(tx);
        });
      }
      if (!cfg.series.some((sr) => sr.values.some((v) => fin(yAt(v))))) { const tx = svgEl('text', { x: m.l + iw / 2, y: m.t + ih / 2, 'text-anchor': 'middle' }); tx.textContent = 'not measured'; svg.appendChild(tx); }
      const hair = svgEl('line', { class: 'xhair', y1: m.t, y2: m.t + ih, visibility: 'hidden' });
      svg.appendChild(hair);
      const hit = svgEl('rect', { x: m.l, y: m.t, width: iw, height: ih, fill: 'transparent' });
      if (cfg.onPick) hit.style.cursor = 'pointer';
      svg.appendChild(hit);
      const nearest = (ev) => {
        const r = svg.getBoundingClientRect();
        const sx = ((ev.clientX - r.left) * W) / r.width;
        if (cfg.step) return Math.max(0, Math.min(n - 1, Math.floor((sx - m.l) / s)));
        let best = 0, bd = Infinity;
        for (let i = 0; i < n; i++) { const dd = Math.abs(xAt(i) - sx); if (dd < bd) { bd = dd; best = i; } }
        return best;
      };
      hit.addEventListener('pointermove', (ev) => {
        const i = nearest(ev);
        hair.setAttribute('x1', xAt(i)); hair.setAttribute('x2', xAt(i)); hair.setAttribute('visibility', 'visible');
        const rows = cfg.series.map((sr) => ({ color: sr.color, name: sr.name + (sr.details && sr.details[i] ? ` · ${sr.details[i]}` : ''), value: fin(sr.values[i]) ? (cfg.tipFmt || fmt)(sr.values[i]) : 'not measured' }));
        if (cfg.band) rows.push({ color: cfg.band.color, name: cfg.band.name || 'range', value: fin(cfg.band.lo[i]) ? `${(cfg.tipFmt || fmt)(cfg.band.lo[i])} – ${(cfg.tipFmt || fmt)(cfg.band.hi[i])}` : 'not measured' });
        showTip(ev, cfg.tipTitle(i), cfg.tipMeta ? cfg.tipMeta(i) : '', rows);
      });
      hit.addEventListener('pointerleave', () => { hair.setAttribute('visibility', 'hidden'); hideTip(); });
      if (cfg.onPick) hit.addEventListener('click', (ev) => cfg.onPick(nearest(ev)));
      plot.appendChild(svg);
    };
    observeWidth(plot, draw);
  }

  // An explore card: plain title, one-line definition, direction tag, a Table
  // button (the chart's text twin, built on first press), "What is this?".
  function chartCard(spec) {
    const c = el('div', 'card');
    const head = el('div', 'chead');
    head.appendChild(el('h3', null, spec.title));
    const tools = el('div', 'tools');
    if (spec.better !== 'none') tools.appendChild(directionTag(spec.better));
    head.appendChild(tools);
    c.appendChild(head);
    if (spec.def) c.appendChild(el('p', 'def', spec.def));
    const body = el('div');
    c.appendChild(body);
    const tableBox = el('div');
    tableBox.hidden = true;
    c.appendChild(tableBox);
    if (spec.why || spec.how || spec.path) c.appendChild(about(spec));
    const setTable = (build) => {
      const b = el('button', 'tbtn', 'Table');
      b.type = 'button';
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', () => {
        const on = b.getAttribute('aria-pressed') !== 'true';
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
        b.textContent = on ? 'Chart' : 'Table';
        if (on && !tableBox.firstChild) { const [h, r] = build(); tableBox.appendChild(table(h, r, (k) => k > 0)); }
        body.hidden = on;
        tableBox.hidden = !on;
      });
      tools.appendChild(b);
    };
    return { card: c, body, setTable };
  }

  // Three world panels over every closure, stepped: each closure's reading holds
  // until the next one, so a closure that changed nothing reads as flat.
  // spec.series: [{ name, color, read(pt, w), detail?(pt, w), muted?, emph? }];
  // spec.band?: { name, color, lo(pt, w), hi(pt, w) }; spec.unit; spec.ref?(w).
  function closuresChart(M, spec) {
    const c = chartCard(spec);
    const at = (fn, w) => M.points.map((pt) => (pt.kind === 'world' ? num(fn(pt, w)) : NaN));
    const panels = M.worlds.map((w) => ({
      w,
      series: spec.series.map((s) => ({
        ...s,
        values: at(s.read, w),
        details: s.detail ? M.points.map((pt) => (pt.kind === 'world' ? s.detail(pt, w) : '')) : null,
      })),
      band: spec.band ? { name: spec.band.name, color: spec.band.color, lo: at(spec.band.lo, w), hi: at(spec.band.hi, w) } : null,
      refs: spec.ref ? [spec.ref(w)].filter(Boolean) : [],
    }));
    const arrays = panels.flatMap((p) => p.series.map((s) => s.values).concat(p.refs.map((r) => [r.y])).concat(p.band ? [p.band.lo, p.band.hi] : []));
    const dom = spec.log ? logDomain(arrays) : domainOf(arrays, spec.zero);
    const ticks = dateTicks(M.points.map((p) => p.date), 6);
    const grid = el('div', 'panels');
    panels.forEach((p, k) => {
      const pane = el('div', 'panel');
      pane.appendChild(el('div', 'pn', p.w.short));
      const plot = el('div', 'plot');
      pane.appendChild(plot);
      grid.appendChild(pane);
      linePlot(plot, {
        n: M.points.length, series: p.series, band: p.band, dom, step: true, first: k === 0, sel: M.sel, refLines: p.refs, unit: spec.unit,
        selLabel: M.points[M.sel] ? M.points[M.sel].id || M.points[M.sel].name : '',
        yFmt: spec.yFmt || fmtTick, tipFmt: spec.tipFmt || fmt, label: `${spec.title}, ${p.w.short}`,
        xTicks: ticks, xLabel: (i) => shortDate(M.points[i].date),
        tipTitle: (i) => `${p.w.short} · ${M.points[i].title}`,
        tipMeta: (i) => (M.points[i].kind === 'gap' ? 'report not stored' : `${shortDate(M.points[i].date)}${M.points[i].changed ? '' : ' · changed nothing'} · click to show this closure`),
        onPick: (i) => { if (M.points[i].kind === 'world') M.pick(i); },
      });
    });
    c.body.appendChild(grid);
    if (spec.series.length > 1 || spec.band) c.body.appendChild(legend(spec.series.map((s) => ({ name: s.name, color: s.color })).concat(spec.band ? [{ name: spec.band.name, color: spec.band.color, box: true }] : [])));
    c.body.appendChild(el('p', 'note', 'Each closure\'s reading holds until the next closure, so a step is where a closure moved it. The shaded column is the closure shown; click to show another.'));
    c.setTable(() => {
      const headers = ['Closure'];
      M.worlds.forEach((w) => { spec.series.forEach((s) => headers.push(`${w.short} · ${s.name}`)); if (spec.band) headers.push(`${w.short} · ${spec.band.name}`); });
      const rows = [];
      for (let i = M.points.length - 1; i >= 0; i--) {
        const pt = M.points[i];
        const row = [pt.title];
        panels.forEach((p) => {
          p.series.forEach((s) => row.push(pt.kind === 'world' ? (fin(s.values[i]) ? (spec.tipFmt || fmt)(s.values[i]) : 'not measured') : 'not stored'));
          if (p.band) row.push(fin(p.band.lo[i]) ? `${(spec.tipFmt || fmt)(p.band.lo[i])} – ${(spec.tipFmt || fmt)(p.band.hi[i])}` : 'not measured');
        });
        rows.push(row);
      }
      return [headers, rows];
    });
    return c.card;
  }

  // Through one run: the shown closure (blue) against the one before (grey) at
  // each checkpoint. spec.log draws a log scale for readings that boom and crash.
  function checkpointChart(M, spec) {
    const c = chartCard(spec);
    const sel = M.points[M.sel], j = M.prevOf(M.sel), prev = j >= 0 ? M.points[j] : null;
    const runs = [prev, sel].filter(Boolean);
    const ticks = new Set();
    runs.forEach((pt) => M.worlds.forEach((w) => samplesOf(pt.rep, w.seed).forEach((s) => ticks.add(num(s.tick)))));
    const xs = [...ticks].filter(fin).sort((a, b) => a - b);
    const panels = M.worlds.map((w) => ({
      w,
      series: runs.map((pt) => {
        const mp = new Map();
        samplesOf(pt.rep, w.seed).forEach((s) => mp.set(num(s.tick), num(spec.read(s, pt, w))));
        const isSel = pt === sel;
        return { name: isSel ? `${pt.name} (shown)` : `${pt.name} (before)`, color: isSel ? 'var(--s1)' : 'var(--muted)', emph: isSel, muted: !isSel, values: xs.map((t) => (mp.has(t) ? mp.get(t) : NaN)) };
      }),
    }));
    const arrays = panels.flatMap((p) => p.series.map((s) => s.values));
    const dom = spec.log ? logDomain(arrays) : domainOf(arrays, spec.zero);
    const grid = el('div', 'panels');
    const every = Math.max(1, Math.ceil(xs.length / 5));
    panels.forEach((p, k) => {
      const pane = el('div', 'panel');
      pane.appendChild(el('div', 'pn', p.w.short));
      const plot = el('div', 'plot');
      pane.appendChild(plot);
      grid.appendChild(pane);
      linePlot(plot, {
        n: xs.length, series: p.series, dom, first: k === 0, unit: spec.unit, yFmt: spec.yFmt || fmtTick, tipFmt: spec.tipFmt || fmt, label: `${spec.title}, ${p.w.short}`,
        xLabel: (i) => (i === 0 ? `tick ${xs[i]}` : String(xs[i])), xTicks: xs.map((_, i) => i).filter((i) => i % every === 0 || i === xs.length - 1),
        tipTitle: (i) => `${p.w.short} · tick ${xs[i]}`, height: spec.height || 160,
      });
    });
    c.body.appendChild(grid);
    c.body.appendChild(legend(panels[0] ? panels[0].series : []));
    if (spec.log) c.body.appendChild(el('p', 'note', 'Log scale: equal distances are equal ratios, so the early boom and the late plateau both fit. A zero sits on the bottom edge as a hollow dot.'));
    c.setTable(() => {
      const headers = ['Tick'];
      panels.forEach((p) => p.series.forEach((s) => headers.push(`${p.w.short} · ${s.name}`)));
      return [headers, xs.map((t, i) => [String(t), ...panels.flatMap((p) => p.series.map((s) => (fin(s.values[i]) ? (spec.tipFmt || fmt)(s.values[i]) : 'not measured')))])];
    });
    return c.card;
  }

  // Before and after per item, as dumbbells: grey dot for the closure before,
  // blue dot for the closure shown, joined by a line; the shown value labelled.
  // One label column serves all three worlds; narrow screens stack the worlds.
  // spec.items(pt, w) → [{ key, name, value }]; spec.top folds the rest into "other".
  function pairBars(M, spec) {
    const c = chartCard(spec);
    const sel = M.points[M.sel], j = M.prevOf(M.sel), prev = j >= 0 ? M.points[j] : null;
    const fmtV = spec.fmt || fmt;
    const per = M.worlds.map((w) => ({ now: spec.items(sel, w) || [], was: prev ? spec.items(prev, w) || [] : [] }));
    const keys = [], names = {};
    per.forEach((p) => p.now.concat(p.was).forEach((it) => { if (!keys.includes(it.key)) { keys.push(it.key); names[it.key] = it.name; } }));
    const val = (arr, k) => { const it = arr.find((x) => x.key === k); return it ? num(it.value) : NaN; };
    let rows = keys.map((k) => ({ key: k, name: names[k], cells: per.map((p) => ({ a: val(p.now, k), b: val(p.was, k) })) }));
    if (spec.sort !== false) rows.sort((x, y) => Math.max(0, ...y.cells.map((q) => num(q.a) || 0)) - Math.max(0, ...x.cells.map((q) => num(q.a) || 0)));
    if (spec.top && rows.length > spec.top + 1) {
      const rest = rows.slice(spec.top);
      const part = (xs) => (xs.some(fin) ? sum(xs) : NaN);
      rows = rows.slice(0, spec.top).concat([{ key: 'other', name: `other (${rest.length} kinds)`, cells: M.worlds.map((w, wi) => ({ a: part(rest.map((r) => r.cells[wi].a)), b: part(rest.map((r) => r.cells[wi].b)) })) }]);
    }
    let hi = 0;
    rows.forEach((r) => r.cells.forEach((q) => [q.a, q.b].forEach((v) => { if (fin(v) && v > hi) hi = v; })));
    if (!(hi > 0)) hi = 1;
    const ticks = niceTicks(0, hi, 2);
    hi = Math.max(hi, ticks[ticks.length - 1]);
    const plot = el('div', 'plot');
    c.body.appendChild(plot);
    const draw = () => {
      const W = Math.max(260, Math.round(plot.clientWidth) || 600);
      plot.replaceChildren();
      const longest = Math.max(...rows.map((r) => r.name.length), 6);
      const labW = Math.min(190, Math.max(80, longest * 6.4 + 14));
      const rowH = 22, headH = 20, axisH = 18;
      const stacked = W < 640;
      const tracks = stacked ? 1 : M.worlds.length;
      const gap = 22;
      const tw = (W - labW - gap * (tracks - 1)) / tracks;
      const blockH = headH + rows.length * rowH + axisH;
      const H = stacked ? blockH * M.worlds.length : blockH;
      const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': spec.title });
      M.worlds.forEach((w, wi) => {
        const ox = stacked ? labW : labW + wi * (tw + gap), oy = stacked ? wi * blockH : 0;
        const x0 = ox + 4, iw = tw - 56;
        const xAt = (v) => x0 + (Math.max(0, v) / hi) * iw;
        const head = svgEl('text', { x: x0, y: oy + 13, class: 'rowlab' }); head.textContent = w.short; head.setAttribute('font-weight', '600'); svg.appendChild(head);
        const g = svgEl('g', { class: 'grid' });
        ticks.forEach((t) => {
          g.appendChild(svgEl('line', { x1: xAt(t), x2: xAt(t), y1: oy + headH, y2: oy + headH + rows.length * rowH }));
          const tx = svgEl('text', { x: xAt(t), y: oy + blockH - 5, 'text-anchor': 'middle' }); tx.textContent = (spec.tickFmt || fmtV)(t); g.appendChild(tx);
        });
        svg.appendChild(g);
        rows.forEach((r, k) => {
          const y = oy + headH + k * rowH + rowH / 2;
          if (wi === 0 || stacked) { const lab = svgEl('text', { x: labW - 10, y: y + 4, 'text-anchor': 'end', class: 'rowlab' }); lab.textContent = r.name; svg.appendChild(lab); }
          const q = r.cells[wi];
          if (fin(q.a) && fin(q.b)) svg.appendChild(svgEl('line', { x1: xAt(q.b), x2: xAt(q.a), y1: y, y2: y, stroke: 'var(--axis)', 'stroke-width': 2, 'stroke-linecap': 'round' }));
          if (fin(q.b)) svg.appendChild(svgEl('circle', { cx: xAt(q.b), cy: y, r: 4, fill: 'var(--muted)', stroke: 'var(--surface)', 'stroke-width': 2 }));
          if (fin(q.a)) svg.appendChild(svgEl('circle', { cx: xAt(q.a), cy: y, r: 5, fill: 'var(--s1)', stroke: 'var(--surface)', 'stroke-width': 2 }));
          const right = Math.max(fin(q.a) ? xAt(q.a) : x0, fin(q.b) ? xAt(q.b) : x0);
          const tv = svgEl('text', { x: right + 9, y: y + 4, class: fin(q.a) ? 'vlab' : 'rowlab' }); tv.textContent = fin(q.a) ? fmtV(q.a) : 'not measured'; svg.appendChild(tv);
          const hit = svgEl('rect', { x: stacked ? 0 : ox, y: y - rowH / 2, width: stacked ? W : tw, height: rowH, fill: 'transparent' });
          hit.addEventListener('pointermove', (ev) => showTip(ev, `${w.short} · ${r.name}`, spec.tipMeta || '', [
            { color: 'var(--s1)', name: sel.title, value: fin(q.a) ? fmtV(q.a) : 'not measured' },
            ...(prev ? [{ color: 'var(--muted)', name: prev.title, value: fin(q.b) ? fmtV(q.b) : 'not measured' }] : []),
          ]));
          hit.addEventListener('pointerleave', hideTip);
          svg.appendChild(hit);
        });
      });
      plot.appendChild(svg);
    };
    observeWidth(plot, draw);
    c.body.appendChild(legend([{ name: `${sel.name} (shown)`, color: 'var(--s1)', dot: true }].concat(prev ? [{ name: `${prev.name} (before)`, color: 'var(--muted)', dot: true }] : [])));
    c.setTable(() => {
      const headers = ['Item'];
      M.worlds.forEach((w) => { headers.push(`${w.short} · shown`); if (prev) headers.push(`${w.short} · before`); });
      const f = (v) => (fin(v) ? fmtV(v) : 'not measured');
      return [headers, rows.map((r) => [r.name, ...r.cells.flatMap((q) => (prev ? [f(q.a), f(q.b)] : [f(q.a)]))])];
    });
    return c.card;
  }

  // ── Sections ─────────────────────────────────────────────────────────────
  function band(id, title, lede) {
    const s = el('section', 'band');
    s.id = id;
    s.appendChild(el('h2', null, title));
    if (lede) s.appendChild(el('p', 'lede', lede));
    return s;
  }

  function renderVerdict(M, app) {
    const v = verdictOf(M);
    const pt = M.points[M.sel], j = M.prevOf(M.sel);
    const worldIdx = M.points.filter((p) => p.kind === 'world');
    const c = el('section', 'card verdict');
    c.appendChild(el('p', 'eyebrow', `Closure ${worldIdx.indexOf(pt) + 1} of ${worldIdx.length} · run ${pt.date || 'undated'} · compared with ${j >= 0 ? M.points[j].title : 'nothing earlier'}`));
    c.appendChild(el('h2', null, pt.title));
    const a = el('p', 'action');
    a.appendChild(el('span', 'badge ' + v.badge, v.badge === 'ok' ? 'OK' : v.badge === 'check' ? 'CHECK' : 'SAME'));
    a.appendChild(el('span', null, v.action));
    c.appendChild(a);
    if (v.also.length) {
      const ul = el('ul', 'also');
      v.also.slice(0, 4).forEach((t) => ul.appendChild(el('li', null, t)));
      if (v.also.length > 4) ul.appendChild(el('li', null, `and ${v.also.length - 4} more in Guardrails below.`));
      c.appendChild(ul);
    }
    if (v.lines.length) {
      const ul = el('ul', 'lines');
      v.lines.forEach(([k, nodes]) => {
        const li = el('li');
        li.appendChild(el('span', 'k', k));
        const vv = el('span', 'v');
        nodes.forEach((n) => vv.appendChild(n));
        li.appendChild(vv);
        ul.appendChild(li);
      });
      c.appendChild(ul);
    }
    c.appendChild(el('p', 'foot', 'Green is better, red is worse, grey is a small move: smaller than the typical change between closures for that reading and world. Each world is one seeded run, so small moves can be chance. Hover any chip for the sentence.'));
    app.appendChild(c);
  }

  function goalCard(M, key) {
    const spec = READINGS[key];
    const i = M.sel, j = M.prevOf(i), f = M.firstIndex;
    const c = el('div', 'card goal');
    c.appendChild(el('h3', null, `${spec.label}: ${progressText(M, key).replace(/^./, (s) => s.toLowerCase())}`));
    const metric = el('p', 'metric');
    metric.appendChild(directionTag(spec.better));
    metric.appendChild(document.createTextNode(`  ${spec.unit} · the first reading is ${M.points[f] ? M.points[f].title : 'not stored'}`));
    c.appendChild(metric);
    c.appendChild(el('p', 'def', spec.def));
    const grid = el('div', 'worlds');
    M.worlds.forEach((w, wi) => {
      const cell = el('div', 'wcell');
      const wn = el('div', 'wname', w.name);
      wn.title = WORLD_INFO[w.short] || '';
      cell.appendChild(wn);
      const cur = M.vals[key][wi][i];
      const big = el('div', 'big', valueText(spec, cur));
      if (spec.extra) big.title = spec.extra(M.points[i], w);
      if (spec.extra && spec.kind === 'share') big.appendChild(el('small', null, spec.extra(M.points[i], w)));
      cell.appendChild(big);
      const r1 = el('div', 'rowc');
      r1.appendChild(chip(M.judgeAt(key, wi, i)));
      r1.appendChild(el('span', null, j >= 0 ? `vs ${M.points[j].name}` : 'first closure'));
      cell.appendChild(r1);
      const first = M.vals[key][wi][f];
      const r2 = el('div', 'rowc');
      if (fin(first) && fin(cur) && i !== f) {
        const jf = judge(spec, cur, first, M.typical[key][wi]);
        r2.appendChild(chip(jf));
        r2.appendChild(el('span', null, `since the first reading, ${valueText(spec, first)}`));
      } else r2.appendChild(el('span', null, i === f ? 'this is the first reading' : 'no first reading'));
      cell.appendChild(r2);
      cell.appendChild(sparkline(M, key, wi));
      grid.appendChild(cell);
    });
    c.appendChild(grid);
    c.appendChild(about(spec));
    return c;
  }

  function renderGoals(M, app) {
    const s1 = band('diversity', '1. Diversity: are many ways of living lasting side by side?', 'Both readings should rise above their first reading and stay there; that is the diversity half of the success definition. Higher is better.');
    const st1 = el('div', 'stack');
    st1.appendChild(goalCard(M, 'clades'));
    st1.appendChild(goalCard(M, 'even'));
    s1.appendChild(st1);
    app.appendChild(s1);
    const s2 = band('cognition', '2. Cognition: does behaviour depend on memory?', 'Memory use should rise above its first reading and stay there; that is the cognition half of the success definition. Learning and prediction are not measured yet, so memory use is the only cognition reading.');
    const st2 = el('div', 'stack');
    st2.appendChild(goalCard(M, 'memory'));
    s2.appendChild(st2);
    app.appendChild(s2);
  }

  function renderGuards(M, app) {
    const s = band('guardrails', '3. Guardrails: did anything break?', 'Three things every closure must keep: the worlds stay alive, mutations keep producing new behaviour, and compute cost does not jump.');
    const g = el('div', 'guards');
    const i = M.sel, pt = M.points[i];
    // Alive
    {
      const spec = READINGS.population;
      const c = el('div', 'card guard');
      c.appendChild(el('h3', null, 'Worlds alive'));
      const dead = M.worlds.filter((w, wi) => M.vals.population[wi][i] === 0);
      const measured = M.worlds.filter((w, wi) => fin(M.vals.population[wi][i]));
      c.appendChild(el('p', 'state ' + (!measured.length ? 'na' : dead.length ? 'check' : 'ok'), !measured.length ? 'Not measured.' : dead.length ? `Extinct: ${listText(dead.map((w) => w.short))}.` : `All ${measured.length} worlds survived the full run.`));
      c.appendChild(el('p', 'def', spec.def));
      M.worlds.forEach((w, wi) => {
        const r = el('div', 'grow');
        r.appendChild(el('span', 'wn', w.short));
        const gv = el('span', 'gv');
        gv.appendChild(el('b', null, valueText(spec, M.vals.population[wi][i])));
        gv.appendChild(chip(M.judgeAt('population', wi, i)));
        gv.appendChild(el('span', 'note', spec.extra(pt, w)));
        r.appendChild(gv);
        c.appendChild(r);
      });
      c.appendChild(about(spec));
      g.appendChild(c);
    }
    // Evolvability floor, as a bullet graph per world.
    {
      const spec = READINGS.floor;
      const c = el('div', 'card guard');
      c.appendChild(el('h3', null, 'Mutations still change behaviour'));
      const judged = M.worlds.filter((w, wi) => fin(M.vals.floor[wi][i]) && fin(F12_FLOORS[w.short]));
      const below = judged.filter((w) => M.vals.floor[M.worlds.indexOf(w)][i] < F12_FLOORS[w.short]);
      const missing = M.worlds.length - judged.length;
      c.appendChild(el('p', 'state ' + (!judged.length ? 'na' : below.length ? 'check' : 'ok'),
        (!judged.length ? 'Not measured in this closure.' : below.length ? `Below the floor: ${listText(below.map((w) => w.short))}.` : `At or above the floor in ${judged.length} of ${judged.length} measured worlds.`) + (missing && judged.length ? ` ${missing} not measured.` : '')));
      c.appendChild(el('p', 'def', spec.def));
      let hi = 0;
      M.worlds.forEach((w, wi) => { [M.vals.floor[wi][i], F12_FLOORS[w.short]].forEach((v) => { if (fin(v)) hi = Math.max(hi, v); }); });
      hi = Math.max(0.05, hi * 1.25);
      M.worlds.forEach((w, wi) => {
        const v = M.vals.floor[wi][i], fl = F12_FLOORS[w.short];
        const r = el('div', 'grow');
        r.appendChild(el('span', 'wn', w.short));
        const gv = el('div');
        const top = el('span', 'gv');
        top.appendChild(el('b', null, valueText(spec, v)));
        top.appendChild(chip(M.judgeAt('floor', wi, i)));
        top.appendChild(el('span', 'note', fin(fl) ? `floor ${pct(fl)}` : 'no floor'));
        gv.appendChild(top);
        const svg = svgEl('svg', { class: 'bullet', viewBox: '0 0 300 14', preserveAspectRatio: 'none', role: 'img', 'aria-label': `${w.short}: ${valueText(spec, v)} against floor ${pct(fl)}` });
        svg.appendChild(svgEl('rect', { x: 0, y: 3, width: 300, height: 8, rx: 2, fill: 'var(--raised)' }));
        if (fin(fl)) svg.appendChild(svgEl('rect', { x: 0, y: 3, width: (fl / hi) * 300, height: 8, rx: 2, fill: 'var(--grid)' }));
        if (fin(v)) svg.appendChild(svgEl('rect', { x: 0, y: 5, width: (v / hi) * 300, height: 4, rx: 1, fill: fin(fl) && v < fl ? 'var(--bad)' : 'var(--ink-2)' }));
        if (fin(fl)) svg.appendChild(svgEl('rect', { x: (fl / hi) * 300 - 1, y: 0, width: 2, height: 14, fill: 'var(--ink)' }));
        gv.appendChild(svg);
        r.appendChild(gv);
        c.appendChild(r);
      });
      c.appendChild(el('p', 'note', 'Bar: this closure. Tick: the floor.'));
      c.appendChild(about(spec));
      g.appendChild(c);
    }
    // Compute cost
    {
      const c = el('div', 'card guard cost');
      c.appendChild(el('h3', null, 'Compute cost'));
      const runs = costOf(M, pt);
      const worst = worstLevel(runs), wall = wallWorst(runs);
      const wallText = wall ? ` Wall clock ${pctChange(wall.run.wall.d)} in the ${wall.run.label.toLowerCase()} (${wall.run.wall.level}, host-dependent).` : '';
      c.appendChild(el('p', 'state ' + (worst || wall ? 'check' : runs.some((r) => r.counters) ? 'ok' : 'na'), (worst ? `${worst.run.label}: ${worst.c.name} ${pctChange(worst.c.d)} (${worst.rank === 2 ? 'severe' : 'flag'}).` : runs.some((r) => r.counters) ? 'Every work counter is within its limit.' : 'No stored comparison.') + wallText));
      c.appendChild(el('p', 'def', 'Work per creature-tick (one creature simulated for one tick), against the earlier closure each report compares itself with. Lower is cheaper.'));
      runs.forEach((r) => {
        const h = el('h4', null, `${r.label} `);
        h.appendChild(el('small', null, r.missing ? `(${r.what}): ${r.missing}` : `(${r.what}) vs ${r.refTitle}`));
        c.appendChild(h);
        if (r.missing) return;
        const chips = el('div', 'chips');
        const loud = r.counters.filter((x) => x.level !== 'ok').sort((a, b) => b.d - a.d);
        loud.forEach((x) => {
          const ch = el('span', `chip ${x.level}`, `${x.name} ${pctChange(x.d)} · ${x.level}`);
          ch.title = `${x.name} per creature-tick changed ${pctChange(x.d)}; flag at +${r.work.flag}%, severe at +${r.work.severe}%; ${fmt(x.d / r.work.flag, 1)}× the flag.`;
          chips.appendChild(ch);
        });
        if (r.wall) {
          const ch = el('span', `chip ${r.wall.level === 'ok' ? 'small' : r.wall.level}`, `wall clock ${pctChange(r.wall.d)}${r.wall.level === 'ok' ? '' : ' · ' + r.wall.level}`);
          ch.title = `Elapsed time per creature-tick: flag at +${r.wallLimits.flag}%, severe at +${r.wallLimits.severe}%. Depends on the host, so it never decides a closure on its own.`;
          chips.appendChild(ch);
        }
        c.appendChild(chips);
        const quiet = r.counters.filter((x) => x.level === 'ok');
        if (quiet.length) c.appendChild(el('p', 'rest', `Within limits: ${quiet.map((x) => `${x.name} ${pctChange(x.d)}`).join(', ')}.`));
      });
      c.appendChild(about({
        why: 'A feature should not make the simulation much more expensive without a reason. A severe rise needs a written justification at closure.',
        how: 'Each work counter (mesh hops, VM steps and so on) is divided by creature-ticks and compared with the stored earlier closure. Up to +10% is ok, +10% is a flag, +50% is severe; wall clock uses +25% and +100%.',
        caveat: 'Wall clock depends on the machine and what else was running; the work counters do not.',
        path: 'comparison.references[].counters[] and .wall_clock',
      }));
      g.appendChild(c);
    }
    s.appendChild(g);
    app.appendChild(s);
  }

  function renderTimeline(M, app) {
    const s = band('history', '4. Closure history: which feature moved what?', `Newest first. Each row compares a closure with the one before it; each cell shows ${M.worlds.map((w) => w.short).join(', then ')}. Click a row to show that closure everywhere on this page.`);
    const sameCount = M.points.filter((p) => p.kind === 'world' && !p.changed).length;
    const ctl = el('div', 'tl-controls');
    const lab = el('label');
    const box = el('input'); box.type = 'checkbox'; box.checked = !!M.showSame;
    lab.appendChild(box);
    lab.appendChild(document.createTextNode(` Show the ${sameCount} closures that changed nothing`));
    ctl.appendChild(lab);
    s.appendChild(ctl);
    const card = el('div', 'card');
    const wrap = el('div', 'tbl');
    const t = el('table', 'timeline');
    const hr = el('tr');
    ['Closure', 'Run', 'Founder families', 'Even spread', 'Memory use', 'Floor', 'Cost'].forEach((h) => hr.appendChild(el('th', null, h)));
    const thead = el('thead'); thead.appendChild(hr); t.appendChild(thead);
    const tb = el('tbody');
    for (let i = M.points.length - 1; i >= 0; i--) {
      const pt = M.points[i];
      const tr = el('tr');
      if (pt.kind === 'gap') {
        tr.className = 'same';
        const td = el('td', 'name'); td.appendChild(el('b', null, pt.id)); td.appendChild(el('small', null, pt.loadFailed ? 'report could not be loaded' : 'report not stored'));
        tr.appendChild(td);
        const why = el('td', null, pt.reason || ''); why.colSpan = 6; why.style.whiteSpace = 'normal';
        tr.appendChild(why);
        tr.style.cursor = 'default';
        if (!M.showSame && !pt.loadFailed) tr.hidden = true;
        tb.appendChild(tr);
        continue;
      }
      if (i === M.sel) tr.classList.add('sel');
      if (!pt.changed) { tr.classList.add('same'); if (!M.showSame && i !== M.sel) tr.hidden = true; }
      const nameTd = el('td', 'name');
      nameTd.appendChild(el('b', null, pt.name));
      if (pt.id && pt.id !== pt.name) nameTd.appendChild(el('small', null, pt.id));
      if (!pt.changed && M.prevOf(i) >= 0) nameTd.appendChild(el('small', null, '· changed nothing'));
      tr.appendChild(nameTd);
      tr.appendChild(el('td', null, pt.date));
      GOAL_KEYS.forEach((key) => {
        const td = el('td');
        const mini = el('span', 'mini');
        M.worlds.forEach((w, wi) => {
          const jd = M.judgeAt(key, wi, i);
          const m = el('span', `mchip ${jd.tone}`, jd.tone === 'flat' ? '·' : jd.tone === 'na' ? '—' : jd.text.replace(' ', '').replace(' pts', ''));
          m.title = `${w.short}: ${valueText(READINGS[key], M.vals[key][wi][i])}. ${jd.say}`;
          mini.appendChild(m);
        });
        td.appendChild(mini);
        tr.appendChild(td);
      });
      {
        const judged = M.worlds.filter((w, wi) => fin(M.vals.floor[wi][i]) && fin(F12_FLOORS[w.short]));
        const below = judged.filter((w) => M.vals.floor[M.worlds.indexOf(w)][i] < F12_FLOORS[w.short]);
        const td = el('td');
        td.appendChild(el('span', 'mchip ' + (!judged.length ? 'na' : below.length ? 'bad' : 'good'), !judged.length ? '—' : below.length ? `${below.length} below` : 'held'));
        tr.appendChild(td);
      }
      {
        const runs = costOf(M, pt);
        const worst = worstLevel(runs), wall = wallWorst(runs);
        const td = el('td');
        const m = worst
          ? el('span', 'mchip ' + (worst.rank === 2 ? 'severe' : 'flag'), `${worst.rank === 2 ? 'severe' : 'flag'}: ${worst.c.name} ${pctChange(worst.c.d)}`)
          : wall ? el('span', 'mchip flag', `wall clock ${pctChange(wall.run.wall.d)}`)
            : el('span', 'mchip ' + (runs.some((r) => r.counters) ? 'flat' : 'na'), runs.some((r) => r.counters) ? 'ok' : '—');
        if (worst) m.title = `${worst.run.label} vs ${worst.run.refTitle}`;
        else if (wall) m.title = `${wall.run.label} vs ${wall.run.refTitle}; wall clock depends on the host`;
        td.appendChild(m);
        tr.appendChild(td);
      }
      tr.addEventListener('click', () => { M.pick(i); document.getElementById('top').scrollIntoView(); });
      tb.appendChild(tr);
    }
    t.appendChild(tb);
    wrap.appendChild(t);
    card.appendChild(wrap);
    card.appendChild(el('p', 'note', 'Arrows show the change from the previous closure in each world: green better, red worse, grey a small move, a dot no change. Memory use moves in percentage points. Hover for the numbers.'));
    s.appendChild(card);
    box.addEventListener('change', () => { M.showSame = box.checked; M.render(); });
    app.appendChild(s);
  }

    return [
      {
        key: 'pop', title: 'Population and energy', hint: 'how many live, how they die, where energy goes',
        cards: () => [
          closuresChart(M, {
            title: 'Population at the end and at its lowest', better: 'up', unit: 'creatures',
            def: 'Creatures alive at the last tick (blue) and the fewest alive at any checkpoint (orange). A low point near zero means the world nearly died out.',
            series: [
              { name: 'at the end', color: SERIES[0], emph: true, read: (pt, w) => pop(pt.rep, w.seed).final_population },
              { name: 'lowest point', color: SERIES[1], read: (pt, w) => pop(pt.rep, w.seed).minimum_population },

          }),
          closuresChart(M, {
            title: 'Births over the whole run', better: null, unit: 'births',

            series: [{ name: 'births', color: SERIES[0], emph: true, read: (pt, w) => get(seedRow(pt.rep, 'deterministic.per_seed', w.seed), 'births'), detail: (pt, w) => `${fmtInt(num(get(worldCase(pt.rep, w.name), 'mortality.deaths_total')))} deaths` }],
            path: 'deterministic.per_seed[].births; cases[].mortality.deaths_total',
          }),
          checkpointChart(M, {
            title: 'Population through the run', better: null, log: true, unit: 'creatures',
            def: 'Creatures alive at each checkpoint (every 100 ticks), for the shown closure and the one before. Every world booms toward the 100,000 cap, then crashes as the first food runs out.',
            read: (s) => s.population, path: 'population_persistence.per_seed[].samples[].population',
          }),
          pairBars(M, {
            title: 'What creatures died of', better: null, fmt: pct, top: 6,
            def: 'What took each creature\'s last energy, as a share of all deaths in the run: the cost of a move, lifecycle decay, an eat, and so on. A jump in one cause usually explains a population change.',
            items: (pt, w) => { const m = get(worldCase(pt.rep, w.name), 'mortality'); const t = num(get(m, 'deaths_total')); return m ? Object.entries(m.by_cause || {}).map(([k, v]) => ({ key: k, name: CAUSE_NAMES(k), value: ratio(num(v), t) })) : []; },
            path: 'cases[].mortality.by_cause / deaths_total',
          }),
          pairBars(M, {
            title: 'Where the energy went', better: null, fmt: pct, top: 6,
            def: 'Each kind of energy spending as a share of all spending in the run: living, acting, thinking, carrying a genome, raising offspring.',
            items: (pt, w) => {
              const ef = get(worldCase(pt.rep, w.name), 'energy_flows');
              if (!ef) return [];
              // Spending is every flow except credits, food intake and the exposure and definition fields.
              const keys = Object.keys(ef).filter((k) => !/_credit$/.test(k) && !['definition', 'food_intake_by_type', 'genome_size_creature_ticks'].includes(k));
              const val = (k) => (k === 'action_charges' ? sum(Object.values(ef.action_charges || {}).map(num)) : num(ef[k]));
              const total = sum(keys.map(val));
              return keys.map((k) => ({ key: k, name: CAUSE_NAMES(k), value: ratio(val(k), total) }));
            },
            path: 'cases[].energy_flows.*',
          }),
          checkpointChart(M, {
            title: 'Food on the ground through the run', better: null, unit: 'food',
            def: 'All food summed over the map at each checkpoint. Food that never recovers after the early boom limits how many creatures the world can hold.',
            read: (s) => (Array.isArray(s.food_density_total) ? sum(s.food_density_total.map(num)) : NaN), path: 'samples[].food_density_total[]',
          }),
          checkpointChart(M, {
            title: 'Grazed ground through the run', better: null, yFmt: pctTick, tipFmt: pct, unit: 'of cells',
            def: 'Share of the founders\' food cells (type 0) that are grazed down at each checkpoint. Not measured before T02.F04.',

          {

            const grid = el('div', 'stack');
            M.worlds.forEach((w) => {
              const rows = (get(worldCase(sel().rep, w.name), 'surviving_clade_profiles.rows') || []).slice().sort((a, b) => num(b.size) - num(a.size));
              grid.appendChild(el('div', 'pn', `${w.short}: ${rows.length ? rows.length + ' families alive' : 'not measured'}`));
              if (!rows.length) return;

                r.addEventListener('pointermove', (ev) => showTip(ev, `${w.short} · cell ${x}, ${y}`, '', [{ color: 'var(--s1)', name: 'distinct families', value: fmtInt(v) }, { color: 'transparent', name: 'creatures', value: fmtInt(p) }]));

  function renderMutationEffects(M, out) {
    const pt = M.points[M.sel];
    const views = M.worlds.map((w) => ({ w, v: mutationEffectsView(get(worldCase(pt.rep, w.name), 'mutation_effects')) }));
    const add = (title, sub, headers, rowsOf) => {
      const rows = [];
      views.forEach(({ w, v }) => {
        if (v.status !== 'measured') { rows.push([w.short, v.status].concat(headers.slice(2).map(() => ''))); return; }
        rowsOf(v).forEach((r) => rows.push([w.short].concat(r)));
      });
      const c = chartCard({ title: `${title}, at ${pt.name}`, better: null, def: sub });
      c.card.querySelector('.tag').remove();
      c.body.appendChild(table(headers, rows));
      out.push(c.card);
    };
    const cohortRows = (v, cells) => v.cohorts.map((c) => (c.status ? [c.name, c.status] : [c.name].concat(cells(c))));
    add('Mutation exposure per birth', 'Events per birth over births_total; zero-applied over births_total; genome-identical over event-bearing births.',
      ['World', 'Panel', 'Supply', 'Requested / birth', 'Applied / birth', 'Zero-applied births', 'Genome-identical births'],
      (v) => v.exposure.map((r) => [r.panel, r.supply, r.requestedPerBirth, r.appliedPerBirth, r.zeroApplied, r.identical]));
    add('Parent capability', 'All-NoOp and one-queue parents over parents; births from acting parents over births_total.',
      ['World', 'Panel', 'All-NoOp parents', 'One-queue parents', 'Births from acting parents'],
      (v) => v.exposure.map((r) => [r.panel, r.allNoop, r.oneQueue, r.fromActing]));
    add('Single-event attribution by category', 'Each category over applied proposals; cohort identity by mean depth or generation and genome size.',
      ['World', 'Cohort', 'Identity', 'Parents', 'Mean depth / generation', 'Mean genome size', 'Applied of proposals', 'action_changed', 'action_dead', 'genome_identical', 'unexecuted_edit', 'masked_before_selection', 'state_or_cost_only', 'unresolved'],
      (v) => cohortRows(v, (c) => [c.identity, c.parents, c.meanDepthOrGeneration, c.meanGenomeSize, `${c.applied} of ${c.proposals}`].concat(c.categories.map((x) => x[1]))));
    add('Battery-silent pairs on the extended contexts', 'Pairs differing in actions over pairs sampled, per group (neighborhood-coverage-v1).',
      ['World', 'Cohort', 'Original battery', 'Pairs', 'Recorded', 'Authored', 'Ticks 1–4', 'Ticks 5–32', 'Any group', 'State or cost only', 'All-NoOp parents acting'],
      (v) => cohortRows(v, (c) => [v.batteryVersion, c.coverage.pairs, c.coverage.recorded, c.coverage.authored, c.coverage.early, c.coverage.late, c.coverage.any, c.coverage.stateOnly, c.coverage.noopActing]));
    add('Per-cohort detail by operator and first-target class', 'Proposals, skipped, applied and category counts; a target class is a stratum label, never a cause.',
      ['World', 'Cohort', 'Row', 'Proposals', 'Skipped', 'Applied', 'action_changed', 'action_dead', 'genome_identical', 'unexecuted_edit', 'masked_before_selection', 'state_or_cost_only', 'unresolved', 'silent_with_state_or_cost', 'consistency_violations'],
      (v) => v.cohorts.flatMap((c) => (c.status ? [[c.name, c.status]] : c.operators.concat(c.targets).map((r) => [c.name].concat(r)))));
  }

  function renderExplore(M, app) {
    const s = band('explore', '5. Explore the detail', 'Everything else the reports store, folded by topic. Each chart says what it shows and which way is better; open "What is this?" for how it is measured.');
    topics(M).forEach((tp) => {
      const d = el('details', 'topic');
      d.dataset.key = tp.key;
      const sm = el('summary');
      sm.appendChild(el('b', null, tp.title));
      sm.appendChild(el('span', null, tp.hint));
      d.appendChild(sm);
      const st = el('div', 'stack');
      d.appendChild(st);
      let built = false;
      const build = () => { if (built) return; built = true; tp.cards().forEach((c) => st.appendChild(c)); };
      d.addEventListener('toggle', () => { if (d.open) { M.open.add(tp.key); build(); } else M.open.delete(tp.key); });
      if (M.open.has(tp.key)) { d.open = true; build(); }
      s.appendChild(d);
    });
    app.appendChild(s);
  }

  const GLOSSARY = [
    ['Closure', 'One finished roadmap feature. When a feature closes, its benchmark run is stored and this page reads it. Closures are the x-axis of every history chart.'],
    ['World', 'One of three saved maps, each run once per closure for 2,000 ticks from 10,000 founders: Orchards in grassland, Canyon country and Confluence. They are different environments, not repeats of one.'],
    ['Tick', 'One step of the simulation. Every creature senses, decides and acts once per tick.'],
    ['Founder family', 'Every descendant of one of the 10,000 creatures alive at tick zero. Also called a clade or lineage.'],
    ['Memory', 'State a creature carries from one tick to the next: memory slots and brain nodes that keep a value.'],
    ['Mutation outcomes', 'An offspring is changed when it behaves differently from its parent, silent when it behaves the same, and dead when it never acts.'],
    ['Drift', 'Mutation with no selection: many rounds of random change, to see whether junk build-up stops mutations from mattering.'],
    ['Floor', 'A line a reading should not fall below. The evolvability floor is each world\'s first reading at T14.F12.'],
    ['Creature-tick', 'One creature simulated for one tick. Cost is counted per creature-tick so a bigger population does not look more expensive.'],
    ['Flag, severe', 'Cost limits against the stored earlier closure: work per creature-tick flags at +10% and is severe at +50%; wall clock at +25% and +100%.'],
    ['Long run, short run', 'The long run (goal profile) is the three-world, 2,000-tick run behind most of this page. The short run (gate profile) is the quick run inside make check, used for cost only.'],
    ['Typical move', 'For each reading and world: the middle size of past changes between closures that changed the simulation. Smaller changes are drawn grey, because one seeded run per world means small moves can be chance.'],
    ['Changed nothing', 'A closure whose readings are all identical to the previous closure in every world. Runs are deterministic, so this means the feature did not change behaviour (for example, a measurement or storage feature).'],
  ];
  function renderGlossary(M, app) {
    const s = band('glossary', 'Words on this page');
    const c = el('div', 'card');
    const dl = el('dl', 'gloss');
    GLOSSARY.forEach(([k, v]) => { dl.appendChild(el('dt', null, k)); dl.appendChild(el('dd', null, v)); });
    c.appendChild(dl);
    s.appendChild(c);
    app.appendChild(s);
  }

  // ── Page ─────────────────────────────────────────────────────────────────
  function start(data) {
    const M = buildModel(data);
    M.open = new Set();
    M.showSame = false;
    const app = document.getElementById('app');
    const status = document.getElementById('status');
    const worldN = M.points.filter((p) => p.kind === 'world').length;
    const sameN = M.points.filter((p) => p.kind === 'world' && !p.changed).length;
    const missing = (data.missing || []).length ? ` · ${data.missing.length} listed but could not be loaded` : '';
    status.textContent = `${worldN} closures on the three worlds since ${M.points[M.firstIndex] ? M.points[M.firstIndex].title : '—'} · ${worldN - sameN} changed the simulation, ${sameN} changed nothing${missing}`;
    if (!M.latest) { app.replaceChildren(el('p', 'note', 'No three-world report is stored yet. The series starts at T12.F04.')); return; }
    const pick = document.getElementById('pick');
    for (let i = M.points.length - 1; i >= 0; i--) {
      const pt = M.points[i];
      if (pt.kind !== 'world') continue;
      const o = el('option', null, `${pt.title}${pt.changed ? '' : ' · changed nothing'}`);
      o.value = pt.slug;
      pick.appendChild(o);
    }
    const fromHash = () => {
      const m = /closure=([^&]+)/.exec(location.hash);
      let slug = '';
      try { slug = m ? decodeURIComponent(m[1]) : ''; } catch (e) { slug = ''; }
      const k = slug ? M.points.findIndex((p) => p.kind === 'world' && p.slug === slug) : -1;
      return k >= 0 ? k : M.points.indexOf(M.latest);
    };
    M.render = () => {
      hideTip();
      OBSERVERS.splice(0).forEach((ro) => ro.disconnect());
      pick.value = M.points[M.sel].slug;
      app.replaceChildren();
      const anchor = el('div'); anchor.id = 'top'; app.appendChild(anchor);
      renderVerdict(M, app);
      const toc = el('nav', 'toc');
      [['diversity', 'Diversity'], ['cognition', 'Cognition'], ['guardrails', 'Guardrails'], ['history', 'Closure history'], ['explore', 'Explore'], ['glossary', 'Words']].forEach(([id, t]) => { const a = el('a', null, t); a.href = `#${id}`; a.addEventListener('click', (ev) => { ev.preventDefault(); document.getElementById(id).scrollIntoView(); }); toc.appendChild(a); });
      app.appendChild(toc);
      renderGoals(M, app);
      renderGuards(M, app);
      renderTimeline(M, app);
      renderExplore(M, app);
      renderGlossary(M, app);
    };
    M.pick = (i) => {
      if (!M.points[i] || M.points[i].kind !== 'world' || i === M.sel) return;
      M.sel = i;
      history.replaceState(null, '', `#closure=${encodeURIComponent(M.points[i].slug)}`);
      M.render();
    };
    pick.addEventListener('change', () => { const k = M.points.findIndex((p) => p.kind === 'world' && p.slug === pick.value); if (k >= 0) M.pick(k); });
    window.addEventListener('hashchange', () => { const k = fromHash(); if (k !== M.sel) { M.sel = k; M.render(); } });
    M.sel = fromHash();
    M.render();
    // Hover definitions for terms in static copy.
    document.querySelectorAll('.term[data-term]').forEach((t) => { const g = GLOSSARY.find(([k]) => k === t.dataset.term); if (g) t.title = g[1]; });
    document.getElementById('foot').replaceChildren(
      el('p', null, `Reports are found through benchmark-series.json (${get(data.index, 'goal_worlds.series') || 'goal-worlds-v1'} for most of the page, ${get(data.index, 'gate.series') || 'gate-v1'} for the quick run). The older single-world series (goal-v1, before T12.F04) is not drawn; its readings are in docs/progress.md.`),
      el('p', null, 'No score is composed from these readings. Each world is a distinct environment, so worlds are compared side by side, never averaged.'),
      el('p', null, M.latest.rep.kind === 'petri-benchmark-summary' ? `Latest closure: ${artifactNotice(M.latest.rep)}` : ''),
    );
  }

  function showNotice(err) {
    const n = document.getElementById('notice');
    n.hidden = false;
    const box = el('div', 'box');
    box.appendChild(el('strong', null, 'Reports not loaded.'));
    const p = el('p');
    p.textContent = location.protocol === 'file:'
      ? 'Cause: the page was opened as a file, and browsers block fetch() from file:// pages. Fix: serve it over HTTP. From the repository root, run:'
      : `Cause: ${err && err.message ? err.message : err}. Fix: make that file readable under docs/progress, then serve from the repository root:`;
    box.appendChild(p);
    box.appendChild(el('pre', null, 'python3 -m http.server 8000 --directory docs/progress'));
    const p2 = el('p');
    p2.append('then open ');
    const a = el('a', null, 'http://localhost:8000/');
    a.href = 'http://localhost:8000/';
    p2.appendChild(a);
    p2.append('.');
    box.appendChild(p2);
    n.replaceChildren(box);
    document.getElementById('status').textContent = 'Reports not loaded. See the notice below.';
  }

  // ── Boot ─────────────────────────────────────────────────────────────────
  loadAll().then(start).catch((e) => { console.error(e); showNotice(e); });
})();
</script>
</body>
</html>
