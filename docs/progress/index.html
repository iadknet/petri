    t.appendChild(document.createTextNode(` (${shortDate(pt.date)}${j >= 0 ? `, vs ${M.points[j].name}` : ''}): ${v.action}`));
    p.appendChild(t);
    if (v.also.length) {
      const more = el('a', null, `${v.also.length} more below`);
      more.href = '#cost';
      more.addEventListener('click', (ev) => { ev.preventDefault(); document.getElementById('cost').scrollIntoView({ behavior: 'smooth' }); });
      p.appendChild(more);
    }
    app.appendChild(p);
  }

  // The closure register: a ruled ledger, newest first. Runs of closures that
  // changed nothing fold into one row.
  function renderRegister(M, app) {
    const s = part('register', 'Closure register', 'Newest first.');
    s.classList.add('rule-top');
    const wrap = el('div', 'ledger');
    const t = el('table');
    const hr = el('tr');
    const sw = () => { const sp = el('span', 'sw'); M.worlds.forEach((w) => { const i = el('i'); i.style.background = plotHex(w.short); sp.appendChild(i); }); return sp; };
    ['No.', 'Run', 'Closure'].forEach((h) => hr.appendChild(el('th', null, h)));
    GOAL_KEYS.forEach((key) => {
      const th = el('th', null, READINGS[key].short);
      th.appendChild(sw());
      hr.appendChild(th);
      if (key === 'floor') hr.appendChild(el('th', null, 'Floor'));
    });
    hr.appendChild(el('th', null, 'Cost'));
    const thead = el('thead'); thead.appendChild(hr); t.appendChild(thead);
    const tb = el('tbody');
    const ordinal = new Map();
    M.points.filter((p) => p.kind === 'world').forEach((p, k) => ordinal.set(p, k + 1));
    let fold = [];
    const flushFold = () => {
      if (!fold.length) return;
      const items = fold;
      fold = [];
      const tr = el('tr', 'fold');
      const td = el('td', null, `${items.length} ${items.length === 1 ? 'closure' : 'closures'} changed nothing or stored no report: ${items.map((p) => p.id || p.name).join(', ')}`);
      td.colSpan = 8;
      tr.appendChild(td);
      tr.addEventListener('click', () => { M.unfold = true; M.render(); });
      tb.appendChild(tr);
    };
    for (let i = M.points.length - 1; i >= 0; i--) {
      const pt = M.points[i];
      const quiet = pt.kind === 'gap' || (!pt.changed && M.prevOf(i) >= 0);
      if (quiet && !M.unfold && i !== M.sel) { fold.push(pt); continue; }
      flushFold();
      const tr = el('tr');
      if (pt.kind === 'gap') {
        tr.appendChild(el('td', 'no', '—'));
        tr.appendChild(el('td', null, ''));
        const td = el('td', 'name'); td.appendChild(el('b', null, pt.id)); td.appendChild(el('code', null, pt.loadFailed ? 'could not be loaded' : 'not stored'));
        tr.appendChild(td);
        const why = el('td', 'small', pt.reason || ''); why.colSpan = 5; why.style.whiteSpace = 'normal';
        tr.appendChild(why);
        tb.appendChild(tr);
        continue;
      }
      tr.dataset.i = String(i);
      if (i === M.sel) tr.classList.add('sel');
      tr.appendChild(el('td', 'no', String(ordinal.get(pt)).padStart(2, '0')));
      tr.appendChild(el('td', null, shortDate(pt.date)));
      const nm = el('td', 'name');
      nm.appendChild(el('b', null, pt.name));
      if (pt.id && pt.id !== pt.name) nm.appendChild(el('code', null, pt.id));
      if (!pt.changed && M.prevOf(i) >= 0) nm.appendChild(el('code', null, 'changed nothing'));
      tr.appendChild(nm);
      GOAL_KEYS.forEach((key) => {
        const td = el('td');
        const trio = el('span', 'trio');
        M.worlds.forEach((w, wi) => {
          const jd = M.judgeAt(key, wi, i);
          const m = el('span', `mc ${jd.tone}`, jd.tone === 'flat' ? '·' : jd.tone === 'na' ? '—' : jd.signed.replace(' pts', ''));
          m.title = `${w.short}: ${valueText(READINGS[key], M.vals[key][wi][i])}. ${jd.say}`;
          m.style.setProperty('--c', plotHex(w.short));
          trio.appendChild(m);
        });
        td.appendChild(trio);
        tr.appendChild(td);
        if (key !== 'floor') return;
        const judged = M.worlds.filter((w, wi) => fin(M.vals.floor[wi][i]) && fin(F12_FLOORS[w.short]));
        const below = judged.filter((w) => M.vals.floor[M.worlds.indexOf(w)][i] < F12_FLOORS[w.short]);
        tr.appendChild(el('td', null)).appendChild(el('span', 'mc ' + (!judged.length ? 'na' : below.length ? 'bad' : 'good'), !judged.length ? '—' : below.length ? `${below.length} below` : 'held'));
      });
      {
        const runs = costOf(M, pt);
        const worst = worstLevel(runs), wall = wallWorst(runs);
        const m = worst
          ? el('span', 'mc ' + (worst.rank === 2 ? 'severe' : 'flag'), `${worst.c.name} ${pctChange(worst.c.d)}`)
          : wall ? el('span', 'mc flag', `wall clock ${pctChange(wall.run.wall.d)}`)
            : el('span', 'mc', runs.some((r) => r.counters) ? 'ok' : '—');
        if (worst) m.title = `${worst.run.label} vs ${worst.run.refTitle} (${worst.rank === 2 ? 'severe' : 'flag'})`;
        tr.appendChild(el('td', 'cost')).appendChild(m);
      }
      tr.addEventListener('mouseenter', () => placeHover(M, i));
      tr.addEventListener('mouseleave', () => placeHover(M, null));
      tr.addEventListener('click', () => { M.pick(i); window.scrollTo({ top: 0, behavior: 'smooth' }); });
      tb.appendChild(tr);
    }
    flushFold();
    t.appendChild(tb);
    wrap.appendChild(t);
    s.appendChild(wrap);
    if (M.unfold) { const a = el('a', 'small', 'Fold the closures that changed nothing'); a.href = '#register'; a.style.display = 'inline-block'; a.style.marginTop = '8px'; a.addEventListener('click', (ev) => { ev.preventDefault(); M.unfold = false; M.render(); }); s.appendChild(a); }
    app.appendChild(s);
  }

  // ── Supplementary census: everything else, folded by topic ───────────────
  const CAUSE_NAMES = (k) => k.replace(/_/g, ' ');
  function topics(M) {
    const share = { yFmt: pctTick, tipFmt: pct };
    const sel = () => M.points[M.sel];
    return [
      {
        key: 'pop', title: 'Population and energy', hint: 'population, deaths, energy, food',
        cards: () => [
          closureLines(M, {
            title: 'Population at the end and at its lowest', better: 'up',
            def: 'Alive at tick 2,000 (the plot colour) and the fewest alive at any checkpoint (dashed).',
            series: [
              { name: 'at the end', read: (pt, w) => pop(pt.rep, w.seed).final_population },
              { name: 'lowest point', read: (pt, w) => pop(pt.rep, w.seed).minimum_population },
            ],
            why: 'A near-empty plot loses families fast.', how: 'Population at tick 2,000, and its minimum over 20 checkpoints.', path: 'goal_indicators.population_persistence.per_seed[].{final_population,minimum_population}',
          }),
          closureLines(M, {
            title: 'Births per run', better: null,
            def: 'All births in 2,000 ticks. More births, more generations to evolve. Hover for deaths.',
            series: [{ name: 'births', read: (pt, w) => get(seedRow(pt.rep, 'deterministic.per_seed', w.seed), 'births'), detail: (pt, w) => `${fmtInt(num(get(worldCase(pt.rep, w.name), 'mortality.deaths_total')))} deaths` }],
            path: 'deterministic.per_seed[].births; cases[].mortality.deaths_total',
          }),
          checkpointLines(M, {
            title: 'Population through the run', better: null, log: true,
            def: 'Alive every 100 ticks: this closure against the one before.',
            read: (s) => s.population, path: 'population_persistence.per_seed[].samples[].population',
          }),
          dumbbells(M, {
            title: 'What creatures died of', better: null, fmt: pct, top: 6,

      (v) => v.exposure.map((r) => [r.panel, r.allNoop, r.oneQueue, r.fromActing]));
    add('Single-event attribution by category', 'Each category over applied proposals; cohort identity by mean depth or generation and genome size.',
      ['Plot', 'Cohort', 'Identity', 'Parents', 'Mean depth / generation', 'Mean genome size', 'Applied of proposals', 'action_changed', 'action_dead', 'genome_identical', 'unexecuted_edit', 'masked_before_selection', 'state_or_cost_only', 'unresolved'],
      (v) => cohortRows(v, (c) => [c.identity, c.parents, c.meanDepthOrGeneration, c.meanGenomeSize, `${c.applied} of ${c.proposals}`].concat(c.categories.map((x) => x[1]))));
    add('Battery-silent pairs on the extended contexts', 'Pairs differing in actions over pairs sampled, per group (neighborhood-coverage-v1).',
      ['Plot', 'Cohort', 'Original battery', 'Pairs', 'Recorded', 'Authored', 'Ticks 1–4', 'Ticks 5–32', 'Any group', 'State or cost only', 'All-NoOp parents acting'],
      (v) => cohortRows(v, (c) => [v.batteryVersion, c.coverage.pairs, c.coverage.recorded, c.coverage.authored, c.coverage.early, c.coverage.late, c.coverage.any, c.coverage.stateOnly, c.coverage.noopActing]));
    add('Per-cohort detail by operator and first-target class', 'Proposals, skipped, applied and category counts; a target class is a stratum label, never a cause.',
      ['Plot', 'Cohort', 'Row', 'Proposals', 'Skipped', 'Applied', 'action_changed', 'action_dead', 'genome_identical', 'unexecuted_edit', 'masked_before_selection', 'state_or_cost_only', 'unresolved', 'silent_with_state_or_cost', 'consistency_violations'],
      (v) => v.cohorts.flatMap((c) => (c.status ? [[c.name, c.status]] : c.operators.concat(c.targets).map((r) => [c.name].concat(r)))));
  }

  const TOPIC_ORDER = ['cog', 'evo', 'ways', 'pop', 'worlds', 'raw'];
  function renderExplore(M, app) {
    const s = part('explore', 'Supplementary census', 'Everything else the reports store, by topic. Charts read the closure picked above against the one before it.');

      d.addEventListener('toggle', () => { if (d.open) { M.open.add(tp.key); build(); } else M.open.delete(tp.key); });
      if (M.open.has(tp.key)) { d.open = true; build(); }

  const GLOSSARY = [
    ['Closure', 'A finished feature and its stored benchmark run.'],
    ['Plot', 'One of three saved worlds, numbered by its seed. Each closure runs each once: 2,000 ticks, 10,000 founders.'],
    ['Census', 'The readings taken at the end of a closure\'s run. The first census is the first three-plot closure.'],
    ['Founder family', 'All descendants of one creature from tick zero. Also called a clade or lineage.'],
    ['Memory', 'State a creature keeps from one tick to the next.'],
    ['Mutation outcomes', 'Changed: acts differently from its parent. Silent: acts the same. Dead: never acts.'],
    ['Drift', 'Mutation with no selection.'],
    ['Floor', 'A line a reading must not drop below.'],
    ['Creature-tick', 'One creature for one tick. The unit of cost.'],
    ['Flag, severe', 'Cost limits: +10% and +50% per creature-tick. Wall clock: +25% and +100%.'],
    ['Long run, short run', 'Long: the three-plot run behind this page. Short: the quick run in make check.'],
    ['Typical move', 'The usual size of a change between closures. Smaller changes show grey.'],
    ['Changed nothing', 'Every reading matches the previous closure. The feature did not change behaviour.'],
  ];
  function renderKey(M, app) {
    const s = part('key', 'Field key');
    s.classList.add('rule-top');
    const dl = el('dl', 'key');
    GOAL_KEYS.concat(WATCH_KEYS).forEach((key) => {
      const r = READINGS[key];
      const d = el('div');
      d.appendChild(el('dt', null, r.label));
      d.appendChild(el('dd', null, `${r.def} ${r.how} ${r.caveat}`));
      dl.appendChild(d);
    });
    GLOSSARY.forEach(([k, v]) => { const d = el('div'); d.appendChild(el('dt', null, k)); d.appendChild(el('dd', null, v)); dl.appendChild(d); });
    s.appendChild(dl);
    app.appendChild(s);
  }

  // ── The census matrix: readings as rows, plots as columns ────────────────
  // The largest value a reading reaches in any plot, so a row shares one scale.
  const sharedMax = (M, key) => Math.max(0, ...M.worlds.flatMap((w, wi) => M.vals[key][wi].filter(fin)));
  // Closures that moved the headline reading, biggest first, scored against its typical move.
  function moverCandidates(M, key) {
    const out = [];
    M.points.forEach((pt, i) => {
      if (pt.kind !== 'world' || !pt.changed || i === M.sel) return;
      const j = M.prevOf(i);
      if (j < 0) return;
      let s = 0;
      M.worlds.forEach((w, wi) => { const d = Math.abs(M.vals[key][wi][i] - M.vals[key][wi][j]); const t = M.typical[key][wi]; if (fin(d) && fin(t) && t > 0) s += d / t; });
      if (s > 0) out.push({ i, s });
    });
    return out.sort((a, b) => b.s - a.s);
  }
  // Notched flags hanging over a chart, placed in pixels so no two labels
  // touch; a flag near the right edge hangs leftward from its staff.
  function placeFlags(M, lane, fig, candidates, max, staffH, what) {
    lane.replaceChildren();
    const x = fig.scale('x');
    const laneW = lane.clientWidth || fig.clientWidth || 300;
    const cw = 6.4;
    const box = (px, label) => { const w = label.length * cw + 16; const flip = px + w > laneW; return { l: flip ? px - w : px, w, flip }; };
    const clear = (a, b) => a.l + a.w + 6 < b.l || b.l + b.w + 6 < a.l;
    // Two tiers: the read closure on top, movers below it, so neither crowds the other.
    const put = (i, label, cls, title) => {
      const px = x.apply(i), b = box(px, label);
      const tier = cls === 'sel' ? 0 : 20;
      const f = el(cls === 'sel' ? 'span' : 'button', 'mflag' + (cls ? ' ' + cls : '') + (b.flip ? ' flip' : ''), label);
      if (f.tagName === 'BUTTON') f.type = 'button';
      f.style.left = `${b.l}px`;
      f.style.top = `${tier}px`;
      const staff = el('span', 'staff' + (cls === 'sel' ? ' sel' : ''));
      staff.style.left = `${px}px`;
      staff.style.top = `${tier + 18}px`;
      staff.style.height = `${(staffH || 80) + 32 - tier}px`;
      lane.appendChild(staff);
      f.title = title;
      lane.appendChild(f);
      return { f, b };
    };
    const pt = M.points[M.sel];
    const selLabel = pt.id || pt.name;
    put(M.sel, selLabel, 'sel', `${pt.title}: the closure being read.`);
    const taken = [];
    let n = 0;
    candidates.forEach((c) => {
      if (n >= max) return;
      const id = M.points[c.i].id || M.points[c.i].name;
      const b = box(x.apply(c.i), id);
      if (taken.some((t) => !clear(b, t))) return;
      const { f } = put(c.i, id, '', `${M.points[c.i].title}: one of the closures that moved ${what} most. Click to read it.`);
      taken.push(b);
      n += 1;
      f.addEventListener('mouseenter', () => placeHover(M, c.i));
      f.addEventListener('mouseleave', () => placeHover(M, null));
      f.addEventListener('click', () => M.pick(c.i));
    });
  }
  // One plot's census curve in a matrix cell: a linear scale from zero shared
  // by the row, the first census dashed in the plot's colour, the read closure amber.
  function cellCensus(M, key, w, height, showX, flags) {
    const spec = READINGS[key];
    const wi = M.worlds.indexOf(w);
    const rows = [];
    M.points.forEach((pt, i) => { if (pt.kind !== 'world') return; const v = M.vals[key][wi][i]; if (fin(v)) rows.push({ i, w: w.short, v, changed: pt.changed }); });
    const fi = M.firstOf(key, wi);
    const first = fi >= 0 ? M.vals[key][wi][fi] : NaN;
    const hi = sharedMax(M, key) || 1;
    const yFmt = spec.kind === 'share' ? pctTick : fmtTick;
    const host = el('div', 'fig');
    const line = el('div', 'hover-line');
    const c = plotHex(w.short);
    figure(host, (width) => {
      const fig = Plot.plot({
        width, height: height + (showX ? 24 : 6), style: PLOT_STYLE, marginLeft: 40, marginRight: 10, marginTop: 8, marginBottom: showX ? 24 : 6,
        x: { ...closureX(M), axis: showX ? 'bottom' : null },
        y: { domain: [0, hi], nice: true, grid: true, label: null, ticks: 3, tickFormat: yFmt },
        color: { type: 'identity' },
        marks: [
          Plot.ruleX([M.sel], { x: (d) => d, stroke: HEX.accent, strokeOpacity: 0.8 }),
          fin(first) ? Plot.ruleY([first], { y: (d) => d, stroke: c, strokeOpacity: 0.55, strokeDasharray: '3,3' }) : null,
          Plot.areaY(rows, { x: 'i', y: 'v', fill: c, fillOpacity: 0.08 }),
          Plot.line(rows, { x: 'i', y: 'v', stroke: c, strokeWidth: 1.8 }),
          Plot.dot(rows.filter((r) => r.i === fi), { x: 'i', y: 'v', r: 3.5, symbol: 'diamond2', fill: HEX.sheet, stroke: c, strokeWidth: 1.4 }),
          Plot.dot(rows.filter((r) => r.i === M.sel), { x: 'i', y: 'v', r: 4, fill: c, stroke: HEX.sheet, strokeWidth: 2 }),
          Plot.ruleX(rows, Plot.pointerX({ x: 'i', strokeOpacity: 0, maxRadius: 60 })),
        ].filter(Boolean),
      });
      wire(M, fig, (d) => [M.points[d.i].title, closureMeta(M, d.i)], (d) => [{ color: c, name: `${plotLabel(w)}${spec.extra && M.points[d.i].kind === 'world' ? ' · ' + spec.extra(M.points[d.i], w) : ''}`, value: valueText(spec, M.vals[key][wi][d.i]) }], { sync: true });
      M.syncTargets.push({ fig, line });
      if (flags && flags.lane) placeFlags(M, flags.lane, fig, flags.candidates, 3, height, flags.what);
      return fig;
    });
    return host;
  }
  // A ruled delta line: label left, signed tabular numeral right, coloured by tone.
  function deltaLine(label, j) {
    const r = el('div', 'dline');
    r.appendChild(el('span', 'dk', label));
    const v = el('span', `dv ${j.tone}`, j.tone === 'flat' ? 'no change' : j.tone === 'na' ? '—' : j.signed);
    v.title = j.say;
    r.appendChild(v);
    return r;
  }
  // A reading that has stayed near zero says so plainly before any comparison.
  const verdictLine = (M, key) => {
    const spec = READINGS[key];
    const cur = M.worlds.map((w, wi) => M.vals[key][wi][M.sel]);
    if (spec.low && cur.every((v) => fin(v) && v < spec.low)) return spec.lowText;
    return progressText(M, key).replace(/first reading/g, 'first census').replace(/\bworlds\b/g, 'plots').replace(/\bworld\b/g, 'plot');
  };

  function renderMatrix(M, app) {
    const s = el('section', 'part');
    s.id = 'census';
    s.style.marginTop = '18px';
    const m = el('div', 'matrix');
    m.style.gridTemplateColumns = `236px repeat(${M.worlds.length}, minmax(0, 1fr))`;
    const corner = el('div', 'mx-corner');
    corner.appendChild(el('span', 'fl', 'Census since'));
    const fp = M.points[M.firstIndex];
    corner.appendChild(el('div', 'mx-since', fp ? `${fp.name} · ${shortDate(fp.date)}` : 'first report not loaded'));
    m.appendChild(corner);
    M.worlds.forEach((w) => {
      const h = el('button', 'mx-plot' + (M.focus === w.short ? ' focus' : isDim(M, w.short) ? ' dim' : ''));
      h.type = 'button';
      h.style.setProperty('--c', plotHex(w.short));
      h.setAttribute('aria-pressed', M.focus === w.short ? 'true' : 'false');
      h.title = `${WORLD_INFO[w.short] || ''} Click to bring this plot forward.`;
      h.appendChild(el('i'));
      h.appendChild(el('b', null, String(w.seed)));
      h.appendChild(document.createTextNode(w.short));
      h.addEventListener('click', () => { M.focus = M.focus === w.short ? null : w.short; M.render(); });
      m.appendChild(h);
    });
    const cellOf = (w) => {
      const cell = el('div', 'mx-cell' + (isDim(M, w.short) ? ' dim' : ''));
      const cp = el('div', 'mx-cellplot'); cp.style.setProperty('--c', plotHex(w.short)); cp.appendChild(el('i')); cp.appendChild(document.createTextNode(plotLabel(w)));
      cell.appendChild(cp);
      return cell;
    };
    // Mover flags hang over the evolvability headline: memory has barely moved.
    const FLAG_KEY = 'floor';
    const candidates = moverCandidates(M, FLAG_KEY).slice(0, 10);
    const lastKey = GOAL_KEYS[GOAL_KEYS.length - 1];
    BANDS.forEach((band) => {
      const b = el('div', 'mx-band');
      b.appendChild(el('h2', null, band.title));
      b.appendChild(el('p', null, band.ask));
      if (band.note) b.appendChild(el('p', 'small', band.note));
      m.appendChild(b);
      band.keys.forEach((key) => {
        const spec = READINGS[key];
        const lab = el('div', 'mx-label');
        const lh = el('div', 'mx-lh');
        lh.appendChild(el('h3', null, spec.label));
        lh.appendChild(directionTag(spec.better));
        lab.appendChild(lh);
        lab.appendChild(el('p', 'mx-verdict', verdictLine(M, key)));
        lab.appendChild(el('p', 'small', spec.def));
        m.appendChild(lab);
        M.worlds.forEach((w, wi) => {
          const cell = cellOf(w);
          const i = M.sel, f = M.firstOf(key, wi), cur = M.vals[key][wi][i], first = f >= 0 ? M.vals[key][wi][f] : NaN;
          const val = el('div', 'mx-val', valueText(spec, cur));
          val.appendChild(el('small', null, spec.unit));
          if (spec.extra) val.title = spec.extra(M.points[i], w);
          const fl = F12_FLOORS[w.short];
          if (key === 'floor' && fin(cur) && fin(fl) && cur < fl) val.appendChild(el('span', 'chip bad', `below floor ${pct(fl)}`));
          cell.appendChild(val);
          const pair = el('div', 'dpair');
          pair.appendChild(deltaLine('since first', fin(first) && fin(cur) && i !== f ? judge(spec, cur, first, M.typical[key][wi]) : { tone: 'na', say: i === f ? 'This is the first census.' : 'No first census.' }));
          const pl = deltaLine('vs previous', M.judgeAt(key, wi, i));
          pl.title = M.prevOf(i) >= 0 ? `vs ${M.points[M.prevOf(i)].title}` : 'first closure';
          pair.appendChild(pl);
          cell.appendChild(pair);
          let lane = null;
          if (key === FLAG_KEY) { lane = el('div', 'lane'); cell.appendChild(lane); }
          cell.appendChild(cellCensus(M, key, w, 88, key === lastKey, { lane, candidates, what: spec.movedAs || spec.label.toLowerCase() }));
          m.appendChild(cell);
        });
      });
    });
    const gl = el('div', 'mx-label');
    gl.appendChild(el('h3', null, 'Also watched'));
    gl.appendChild(el('p', 'small', 'Diversity and survival: context for the two goals.'));
    m.appendChild(gl);
    M.worlds.forEach((w, wi) => {
      const cell = cellOf(w);
      const i = M.sel;
      WATCH_KEYS.forEach((key) => {
        const spec = READINGS[key];
        const r = el('div', 'dline');
        r.appendChild(el('span', 'dk', spec.watch));
        const wv = el('span', 'wv');
        const v = el('span', 'dv', valueText(spec, M.vals[key][wi][i]));
        if (spec.extra) v.title = spec.extra(M.points[i], w);
        const jd = M.judgeAt(key, wi, i);
        const d = el('span', `dv ${jd.tone}`, jd.tone === 'flat' ? 'no change' : jd.tone === 'na' ? '—' : jd.signed);
        d.title = `vs previous. ${jd.say}`;
        wv.append(v, d);
        r.appendChild(wv);
        cell.appendChild(r);
      });
      m.appendChild(cell);
    });
    s.appendChild(m);
    app.appendChild(s);
  }

  // Compute cost: each run's flagged counters against its stored comparison.
  function renderCost(M, app) {
    const s = part('cost', 'Compute cost', 'Work per creature-tick against the stored earlier closure. Only flagged counters show.');
    s.classList.add('rule-top');
    const i = M.sel, pt = M.points[i];
    const { checks, runs } = guardChecks(M, i);
    const box = el('div', 'costbox');
    runs.forEach((r) => {
      const col = el('div');
      col.appendChild(el('div', 'fl', r.missing ? `${r.label}: ${r.missing}` : `${r.label} · ${r.what} · vs ${r.refTitle}`));
      if (!r.missing) {
        const loud = r.counters.filter((x) => x.level !== 'ok').sort((a, b) => b.d - a.d);
        const lines = el('div', 'costlines');
        loud.forEach((x) => {
          const d = el('div', 'dline');
          d.appendChild(el('span', 'dk', x.name));
          const v = el('span', `dv ${x.level}`, `${pctChange(x.d)} · ${x.level}`);
          v.title = `Flag +${r.work.flag}%, severe +${r.work.severe}%.`;
          d.appendChild(v);
          lines.appendChild(d);
        });
        if (r.wall && r.wall.level !== 'ok') {
          const d = el('div', 'dline');
          d.appendChild(el('span', 'dk', 'wall clock (depends on the machine)'));
          d.appendChild(el('span', `dv ${r.wall.level}`, `${pctChange(r.wall.d)} · ${r.wall.level}`));
          lines.appendChild(d);
        }
        if (!lines.firstChild) lines.appendChild(el('div', 'small', 'Every counter within its limit.'));
        col.appendChild(lines);
      }
      box.appendChild(col);
    });
    s.appendChild(box);
    const sim = checks.filter((c) => c.sim);
    if (!pt.changed && sim.length) s.appendChild(el('p', 'small', `This closure changed nothing, so these carry over from the closure before: ${sim.map((c) => c.text).join(' ')}`));
    // Everything else about cost, folded: the counters within limits, the
    // limits themselves, and cost by closure over the whole record.
    const d = el('details', 'topic');
    d.style.marginTop = '14px';
    const sm = el('summary');
    sm.appendChild(el('b', null, 'All counters and cost over time'));
    sm.appendChild(el('span', null, 'counters within limits, the limits, cost by closure'));
    d.appendChild(sm);
    const st = el('div', 'cards');
    d.appendChild(st);
    let built = false;
    const build = () => {
      if (built) return;
      built = true;
      runs.filter((r) => !r.missing).forEach((r) => {
        const quiet = r.counters.filter((x) => x.level === 'ok');
        st.appendChild(el('p', 'small', `${r.label}, within limits: ${quiet.length ? quiet.map((x) => `${x.name} ${pctChange(x.d)}`).join(', ') : 'none'}.`));
      });
      st.appendChild(el('p', 'small', 'Flag at +10%, severe at +50% per creature-tick; wall clock at +25% and +100%.'));
      const tp = topics(M).find((t) => t.key === 'cost');
      if (tp) tp.cards().forEach((c) => st.appendChild(c));
    };
    d.addEventListener('toggle', () => { if (d.open) { M.open.add('cost'); build(); } else M.open.delete('cost'); });
    if (M.open.has('cost')) { d.open = true; build(); }
    s.appendChild(d);
    app.appendChild(s);
  }

  // ── Page ─────────────────────────────────────────────────────────────────
  const hashParam = (key) => {
    const m = new RegExp(`(?:^#|&)${key}=([^&]+)`).exec(location.hash);
    try { return m ? decodeURIComponent(m[1]) : ''; } catch (e) { return ''; }
  };
  const setHash = (params) => {
    const parts = Object.entries(params).filter(([, v]) => v).map(([k, v]) => `${k}=${encodeURIComponent(v)}`);
    history.replaceState(null, '', parts.length ? `#${parts.join('&')}` : location.pathname + location.search);
  };

  function start(data) {
    const seriesKey = hashParam('horizon') === 'long' ? 'goal_worlds_long' : 'goal_worlds';
    const horizon = document.getElementById('horizon');
    horizon.value = seriesKey;
    horizon.addEventListener('change', () => {
      setHash({ horizon: horizon.value === 'goal_worlds_long' ? 'long' : '' });
      location.reload();
    });
    const M = buildModel(data, seriesKey);
    M.open = new Set();
    M.focus = null;
    M.unfold = false;
    M.syncTargets = [];
    const app = document.getElementById('app');
    const status = document.getElementById('status');
    const worldN = M.points.filter((p) => p.kind === 'world').length;
    const missing = (data.missing || []).length ? ` · ${data.missing.length} listed but could not be loaded` : '';
    if (!M.latest) {
      app.replaceChildren(el('p', 'small', seriesKey === 'goal_worlds_long'
        ? 'No 40,000-tick run is stored yet. The long series starts with the first feature whose Verification Plan declares the goal-long profile.'
        : 'No three-plot report is stored yet. The series starts at T12.F04.'));
      status.textContent = '';
      return;
    }
    status.textContent = missing ? `${worldN} closures loaded${missing}.` : '';
    const pick = document.getElementById('pick');
    for (let i = M.points.length - 1; i >= 0; i--) {
      const pt = M.points[i];
      if (pt.kind !== 'world') continue;
      const o = el('option', null, `${pt.title}${pt.changed ? '' : ' · changed nothing'}`);
      o.value = pt.slug;
      pick.appendChild(o);
    }
    const fromHash = () => {
      const slug = hashParam('closure');
      const k = slug ? M.points.findIndex((p) => p.kind === 'world' && p.slug === slug) : -1;
      return k >= 0 ? k : M.points.indexOf(M.latest);
    };
    M.hover = (i) => placeHover(M, i);
    M.render = () => {
      hideTip();
      OBSERVERS.splice(0).forEach((ro) => ro.disconnect());
      M.syncTargets = [];
      pick.value = M.points[M.sel].slug;
      renderFields(M);
      app.replaceChildren();
      renderNote(M, app);
      renderMatrix(M, app);
      renderCost(M, app);
      renderRegister(M, app);
      renderExplore(M, app);
      renderKey(M, app);
    };
    M.pick = (i) => {
      if (!M.points[i] || M.points[i].kind !== 'world' || i === M.sel) return;
      M.sel = i;
      setHash({ horizon: seriesKey === 'goal_worlds_long' ? 'long' : '', closure: M.points[i].slug });
      M.render();
    };
    pick.addEventListener('change', () => { const k = M.points.findIndex((p) => p.kind === 'world' && p.slug === pick.value); if (k >= 0) M.pick(k); });
    window.addEventListener('hashchange', () => { const k = fromHash(); if (k !== M.sel) { M.sel = k; M.render(); } });
    M.sel = fromHash();
    M.render();
    document.getElementById('foot').replaceChildren(
      el('p', null, `Source: benchmark-series.json (${get(data.index, `${seriesKey}.series`) || seriesKey}; ${get(data.index, 'gate.series') || 'gate-v1'} for the quick run). Single-world readings before T12.F04 are in docs/progress.md.`),
      el('p', null, 'No combined score. Plots are compared side by side, never averaged. Charts: Observable Plot 0.6.17 and d3 7.9.0, vendored in vendor/.'),
      el('p', null, M.latest.rep.kind === 'petri-benchmark-summary' ? `Latest closure: ${artifactNotice(M.latest.rep)}` : ''),
    );
  }

  function showNotice(err) {
    const n = document.getElementById('notice');
    n.hidden = false;
    const box = el('div', 'box');
    box.appendChild(el('strong', null, 'Reports not loaded.'));
    const p = el('p');
    const noPlot = typeof Plot === 'undefined' || typeof d3 === 'undefined';
    p.textContent = location.protocol === 'file:'
      ? 'Cause: the page was opened as a file, and browsers block fetch() from file:// pages. Fix: serve it over HTTP. From the repository root, run:'
      : noPlot ? 'Cause: the chart library in vendor/ did not load (missing file or checksum mismatch). Fix: restore docs/progress/vendor/ and serve from the repository root:'
        : `Cause: ${err && err.message ? err.message : err}. Fix: make that file readable under docs/progress, then serve from the repository root:`;
    box.appendChild(p);
    box.appendChild(el('pre', null, 'python3 -m http.server 8000 --directory docs/progress'));
    const p2 = el('p');
    p2.append('then open ');
    const a = el('a', null, 'http://localhost:8000/');
    a.href = 'http://localhost:8000/';
    p2.appendChild(a);
    p2.append('.');
    box.appendChild(p2);
    n.replaceChildren(box);
    document.getElementById('status').textContent = 'Reports not loaded. See the notice below.';
  }

  // ── Boot ─────────────────────────────────────────────────────────────────
  loadAll().then(start).catch((e) => { console.error(e); showNotice(e); });
})();
</script>
</body>
</html>
