<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petri progress</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
    --seq-100: #cde2fb; --seq-150: #b7d3f6; --seq-200: #9ec5f4; --seq-250: #86b6ef; --seq-300: #6da7ec; --seq-350: #5598e7;
    --seq-400: #3987e5; --seq-450: #2a78d6; --seq-500: #256abf; --seq-550: #1c5cab;
    --seq-600: #184f95; --seq-650: #104281; --seq-700: #0d366b;
    --warning: #fab219; --critical: #d03b3b; --good: #0ca30c;
    --focus: #2a78d6;
    --selection: rgba(42, 120, 214, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
      --selection: rgba(57, 135, 229, 0.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums;
  }
  ::selection { background: var(--selection); }
  a { color: var(--s1); text-underline-offset: 2px; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  header, .bar, .notice, main, footer { max-width: 1440px; margin: 0 auto; padding-left: 28px; padding-right: 28px; }
  header { padding-top: 18px; }
  header h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--ink-2); max-width: 78ch; }
  .bar { padding: 8px 28px 0; color: var(--muted); font-size: 12px; }
  main { padding-top: 12px; padding-bottom: 48px; }
  section.q { margin-top: 22px; }
  section.q > h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; letter-spacing: -0.01em; }
  section.q > p.lede { margin: 0 0 12px; color: var(--ink-2); max-width: 90ch; }
  .cards { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px 10px;
    min-width: 0;
  }
  .card-head { display: flex; align-items: flex-start; gap: 8px; }
  .card-head > div { min-width: 0; flex: 1; }
  .card-head h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .card-head .sub { color: var(--muted); font-size: 12px; margin: 2px 0 0; overflow-wrap: anywhere; }
  .card-head button, details summary {
    appearance: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--ink-2);
    border-radius: 6px;
    padding: 2px 8px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: background 150ms ease-out, color 150ms ease-out;
  }
  .card-head button:hover { background: var(--grid); color: var(--ink); }
  .card-head button[aria-pressed="true"] { background: var(--grid); color: var(--ink); }
  .panels { display: grid; gap: 0 22px; margin-top: 6px; }
  .panels.n1 { grid-template-columns: 1fr; }
  .panels.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .panels.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .panel { min-width: 0; }
  .panel .pn { font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 4px 0 0; }
  .panel .pn small { font-weight: 400; color: var(--muted); }
  .plot { position: relative; margin-top: 2px; }
  .plot svg { display: block; width: 100%; height: auto; overflow: visible; }
  .plot svg text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
  .plot svg text.tick { font-variant-numeric: tabular-nums; }
  .plot svg .grid line { stroke: var(--grid); stroke-width: 1; }
  .plot svg .axis { stroke: var(--axis); stroke-width: 1; }
  .plot svg .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .plot svg .line.emph { stroke-width: 3; }
  .plot svg .line.muted { stroke-width: 1.5; opacity: 0.55; }
  .plot svg .line.hist { opacity: 0.45; stroke-dasharray: 3 3; }
  .plot svg .dot { stroke: var(--surface); stroke-width: 2; }
  .plot svg .dot.hist { opacity: 0.55; }
  .plot svg .dot.clip { stroke: none; }
  .plot svg .band { opacity: 0.12; }
  .plot svg .ref { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 4 4; }
  .plot svg .ref.floor { stroke: var(--critical); }
  .plot svg .ref-label { fill: var(--ink-2); }
  .plot svg .ann { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 2 3; }
  .plot svg .ann-label { fill: var(--ink-2); }
  .plot svg .brk { stroke: var(--ink-2); stroke-width: 1; }
  .plot svg .brk-label { fill: var(--ink-2); font-weight: 600; }
  .plot svg .nm { fill: var(--surface); stroke: var(--muted); stroke-width: 1.5; }
  .plot svg .xhair { stroke: var(--ink-2); stroke-width: 1; pointer-events: none; }
  .plot svg .end-label { fill: var(--ink-2); }
  .plot svg .cell:hover, .plot svg .col:hover { opacity: 0.8; }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    margin-top: 6px;
    color: var(--ink-2);
    font-size: 12px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { display: inline-block; width: 16px; height: 2px; border-radius: 1px; }
  .legend i.rect { width: 12px; height: 12px; border-radius: 3px; }
  .legend i.hist { opacity: 0.45; border-top: 2px dashed currentColor; height: 0; background: none !important; }
  .legend i.nm { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); background: none !important; }
  .tip {
    position: absolute;
    pointer-events: none;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--border);
    box-shadow: 0 6px 18px rgba(0,0,0,0.14);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    min-width: 150px;
    max-width: 340px;
    z-index: 5;
    display: none;
  }
  .tip .t { font-weight: 600; margin-bottom: 2px; }
  .tip .m { color: var(--muted); margin-bottom: 4px; }
  .tip .row { display: flex; align-items: center; gap: 6px; }
  .tip .row i { display: inline-block; width: 12px; height: 2px; flex: none; }
  .tip .row b { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tip .row span { color: var(--ink-2); }
  .tbl { overflow-x: auto; margin-top: 8px; }
  table { border-collapse: collapse; font-size: 12px; width: 100%; }
  th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--ink-2); font-weight: 600; position: sticky; top: 0; background: var(--surface); }
  tr.hist td { color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 10px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px 8px; min-width: 0; }
  .tile h3 { margin: 0; font-size: 13px; font-weight: 600; }
  .tile .q { margin: 0 0 6px; font-size: 12px; color: var(--muted); }
  .tile .w { display: grid; grid-template-columns: 1fr; gap: 3px; }
  .tile .w > div { min-width: 0; }
  .tile .wr { display: flex; align-items: baseline; gap: 6px; }
  .tile .wn { font-size: 11px; color: var(--muted); width: 62px; flex: none; }
  .tile .v { font-size: 17px; font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; white-space: nowrap; }
  .tile .v.na { color: var(--muted); font-weight: 400; font-size: 13px; }
  .tile .v small { font-size: 11px; font-weight: 400; color: var(--ink-2); }
  .tile .b { font-size: 11px; color: var(--ink-2); line-height: 1.3; }
  .tile .b .d { color: var(--muted); }
  .tile .pass { color: var(--good); font-weight: 600; font-size: 11px; }
  .tile .fail { color: var(--critical); font-weight: 600; font-size: 11px; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  .notice { margin-top: 12px; }
  .notice .box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .notice code, pre { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  pre { background: var(--page); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
  p.art { margin: 0 0 8px; color: var(--muted); font-size: 12px; max-width: 100ch; }
  .scale { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .scale .bar { width: 140px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, var(--seq-100), var(--seq-700)); padding: 0; }
  details { margin-top: 14px; }
  details summary { display: inline-block; padding: 4px 10px; }
  details summary::-webkit-details-marker { display: none; }
  details[open] summary { margin-bottom: 12px; }
  details .cards { margin-top: 0; }
  footer { padding-bottom: 40px; color: var(--muted); font-size: 12px; }
  @media (max-width: 1100px) {
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 900px) {
    header, .bar, .notice, main, footer { padding-left: 16px; padding-right: 16px; }
    .panels.n2, .panels.n3 { grid-template-columns: 1fr; }
    .tiles { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Petri progress</h1>
  <p>Five questions about the simulation, answered from every closure's stored report (a closure is one finished feature's benchmark run). One chart row per indicator, three worlds per row. Hover for the exact reading; press Table for the numbers.</p>
</header>
<div class="bar" id="status">Loading the stored reports…</div>
<div class="notice" id="notice" hidden></div>
<main id="app"></main>
<footer id="foot"></footer>
<script>
(function () {
  'use strict';

  // ── Palette roles ────────────────────────────────────────────────────────
  const SERIES = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)', 'var(--s7)', 'var(--s8)'];
  const CAT_COLORS = SERIES.concat(['var(--seq-200)', 'var(--seq-300)', 'var(--seq-400)', 'var(--seq-500)',
    'var(--seq-600)', 'var(--seq-700)', 'var(--axis)', 'var(--muted)']);
  const ORDINAL_RAMP = ['var(--seq-250)', 'var(--seq-300)', 'var(--seq-350)', 'var(--seq-400)',
    'var(--seq-450)', 'var(--seq-500)', 'var(--seq-550)', 'var(--seq-600)', 'var(--seq-650)'];
  const SEQ_RAMP = ['var(--seq-100)', 'var(--seq-150)', 'var(--seq-200)', 'var(--seq-250)',
    'var(--seq-300)', 'var(--seq-350)', 'var(--seq-400)', 'var(--seq-450)', 'var(--seq-500)',
    'var(--seq-550)', 'var(--seq-600)', 'var(--seq-650)', 'var(--seq-700)'];
  const ramp = (i, n) => ORDINAL_RAMP[Math.round((i * (ORDINAL_RAMP.length - 1)) / Math.max(1, n - 1))];

  // ── Helpers ──────────────────────────────────────────────────────────────
  const num = (v) => {
    if (v === null || v === undefined) return NaN;
    if (typeof v === 'number') return v;
    if (typeof v === 'string') { const n = parseFloat(v); return Number.isFinite(n) ? n : NaN; }
    return NaN;
  };
  const isObj = (v) => v && typeof v === 'object' && !Array.isArray(v);
  const get = (o, path) => path.split('.').reduce((a, k) => (a && a[k] !== undefined ? a[k] : undefined), o);
  const sum = (xs) => xs.filter(Number.isFinite).reduce((a, b) => a + b, 0);
  const ratio = (a, b) => (Number.isFinite(a) && Number.isFinite(b) && b > 0 ? a / b : NaN);
  const fmt = (v, digits) => {
    if (!Number.isFinite(v)) return '—';
    if (digits !== undefined) return v.toLocaleString(undefined, { maximumFractionDigits: digits, minimumFractionDigits: 0 });
    const a = Math.abs(v);
    if (a >= 1000) return v.toLocaleString(undefined, { maximumFractionDigits: 0 });
    if (a >= 10) return v.toLocaleString(undefined, { maximumFractionDigits: 2 });
    if (a >= 0.01 || a === 0) return v.toLocaleString(undefined, { maximumFractionDigits: 4 });
    return v.toExponential(2);
  };
  const fmtTick = (v) => {
    if (!Number.isFinite(v)) return '';
    const a = Math.abs(v);
    if (a >= 1e6) return (v / 1e6).toLocaleString(undefined, { maximumFractionDigits: 1 }) + 'M';
    if (a >= 1e4) return (v / 1e3).toLocaleString(undefined, { maximumFractionDigits: 0 }) + 'k';
    if (a >= 1000) return v.toLocaleString(undefined, { maximumFractionDigits: 0 });
    if (a >= 1) return v.toLocaleString(undefined, { maximumFractionDigits: 2 });
    if (a === 0) return '0';
    if (a >= 0.001) return v.toLocaleString(undefined, { maximumFractionDigits: 4 });
    return v.toExponential(1);
  };
  const pct = (v) => Number.isFinite(v) ? (v * 100).toLocaleString(undefined, { maximumFractionDigits: 2 }) + '%' : '—';
  const pctTick = (v) => Number.isFinite(v) ? (v * 100).toLocaleString(undefined, { maximumFractionDigits: 1 }) + '%' : '';
  const signed = (v, digits) => Number.isFinite(v) ? (v > 0 ? '+' : '') + v.toLocaleString(undefined, { maximumFractionDigits: digits === undefined ? 1 : digits }) : '—';
  const NOT_MEASURED = 'not measured';
  const BREAK_LABEL = 'goal-worlds-v1 from T12.F04';
  // The T14.F12 per-world first reading of changed births at depth, strict not-below.
  const F12_FLOORS = { Orchards: 0.1464, Canyon: 0.13, Confluence: 0.1434 };
  // Axis ticks are feature ids; a slug that is not one is shortened, the hover keeps it whole.
  const tickLabel = (lab) => (lab.length > 9 ? lab.slice(0, 8) + '…' : lab);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const svgEl = (tag, attrs) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const featureId = (slug) => {
    const m = /^t(\d\d)-f(\d\d)/.exec(slug);
    return m ? `T${m[1]}.F${m[2]}` : slug;
  };
  const niceTicks = (lo, hi, count) => {
    if (!(hi > lo)) { hi = lo + 1; }
    const span = hi - lo;
    const step0 = span / Math.max(1, count);
    const mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const norm = step0 / mag;
    const step = (norm >= 5 ? 10 : norm >= 2 ? 5 : norm >= 1 ? 2 : 1) * mag;
    const start = Math.ceil(lo / step) * step;
    const out = [];
    for (let v = start; v <= hi + step * 1e-9; v += step) out.push(+v.toFixed(12));
    return out;
  };

  // ── Data loading ─────────────────────────────────────────────────────────
  const rel = (p) => p.replace(/^docs\/progress\//, '');
  async function fetchJson(path) {
    const r = await fetch(path, { cache: 'no-store' });
    if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
    return r.json();
  }

  const artifactNotice = (report) => report.kind === 'petri-benchmark-summary'
    ? `Committed summary. Detailed ${report.omitted_details.join('; ')} unavailable here. Raw bytes were verified locally at ${report.raw.verified_at}; this is not a download or a current availability guarantee.`
    : '';

  function validateArtifact(report) {
    if (report.kind !== undefined && (report.kind !== 'petri-benchmark-summary' || report.summary_version !== 1)) {
      throw new Error(`Unsupported benchmark summary version ${report.summary_version} (${report.kind})`);
    }
    if (!isObj(report.deterministic) || !isObj(report.environment)) throw new Error('Malformed benchmark artifact');
    return report;
  }

  async function loadAll() {
    const index = await fetchJson('benchmark-series.json');
    const order = [];
    const seen = new Set();
    const add = (p, profile) => { if (!seen.has(p)) { seen.add(p); order.push({ path: p, profile }); } };
    (get(index, 'gate.closed') || []).forEach((p) => add(p, 'gate'));
    (get(index, 'goal.closed') || []).forEach((p) => add(p, 'goal'));
    const worldEpoch = get(index, 'goal_worlds.epoch_baseline');
    if (worldEpoch) add(worldEpoch, 'goal_worlds');
    (get(index, 'goal_worlds.closed') || []).forEach((p) => add(p, 'goal_worlds'));
    // A listed report may not be stored yet — a series whose epoch baseline is
    // the measurement a feature is still taking. Skip it and say so rather than
    // failing the whole page.
    const missing = [];
    const loaded = await Promise.all(order.map(async (o) => {
      let report;
      try { report = await fetchJson(rel(o.path)); }
      catch (e) { missing.push(o.path); return null; }
      return { ...o, report: validateArtifact(report) };
    }));
    const reports = loaded.filter(Boolean);

    // Group by feature slug, preserving gate closure order, then any goal-only features.
    const bySlug = new Map();
    for (const r of reports) {
      const slug = r.report.feature || rel(r.path).replace(/^features\//, '').replace(/(-goal)?\.json$/, '');
      const prof = r.profile;
      if (!bySlug.has(slug)) bySlug.set(slug, { slug, id: featureId(slug), gate: null, goal: null, paths: {} });
      const f = bySlug.get(slug);
      f[prof] = r.report;
      f.paths[prof] = r.path;
    }
    return { index, features: [...bySlug.values()], reportCount: reports.length, missing };
  }

  // ── Extractors ───────────────────────────────────────────────────────────
  const COUNTERS = [
    ['mesh_hops', 'Mesh hops'], ['vm_steps', 'VM steps'], ['graph_relax_iters', 'Graph relaxation'],
    ['plasticity_updates', 'Plasticity updates'], ['actions_applied', 'Actions applied'], ['births', 'Births'],
  ];
  const seedRow = (rep, path, seed) => {
    const arr = get(rep, path);
    if (!Array.isArray(arr)) return undefined;
    return arr.find((r) => r && r.seed === seed);
  };
  const gi = (rep, key, seed) => seedRow(rep, `deterministic.goal_indicators.${key}.per_seed`, seed);
  const worldCase = (rep, world) => (get(rep, 'deterministic.goal_indicators.cases') || [])
    .find((c) => get(c, 'case.name') === world);
  const founderSingle = (mn, cls) => {
    const by = get(mn, 'founder.births.by_events');
    if (!Array.isArray(by)) return NaN;
    const one = by.find((b) => b.applied_events === 1);
    return one ? num(get(one, `tally.${cls}_fraction`)) : NaN;
  };
  const driftAt = (obs, depth, field) => {
    const readings = get(obs, 'drift_depth.readings');
    if (!Array.isArray(readings)) return NaN;
    const row = readings.find((r) => num(r.depth) === depth);
    return row ? num(row[field || 'changed_per_all_births']) : NaN;
  };
  const meshSums = (rep) => {
    const per = get(rep, 'deterministic.goal_indicators.mutational_neighborhood.evolved.per_seed');
    if (!Array.isArray(per)) return null;
    const out = { genomes: 0, total: 0, reachable: 0, executed: 0, knockout: 0, routeVaries: 0, capHits: 0, execs: 0 };
    let any = false;
    per.forEach((s) => {
      if (isObj(s.mesh_summary)) {
        any = true;
        Object.keys(out).forEach((key) => { out[key] += num(s.mesh_summary[key]) || 0; });
        return;
      }
      (s.sampled_genomes || []).forEach((g) => {
      const me = g.mesh_execution; if (!isObj(me)) return;
      any = true; out.genomes += 1;
      out.total += num(me.total_node_count) || 0; out.reachable += num(me.reachable_node_count) || 0;
      out.executed += num(me.executed_node_count) || 0; out.knockout += num(me.knockout_count) || 0;
      out.routeVaries += me.route_varies_with_input ? 1 : 0; out.capHits += num(me.pass_cap_hits ?? me.hop_cap_hits) || 0;
      out.execs += num(me.executions_per_genome) || 0;
      });
    });
    return any ? out : null;
  };
  // The stored comparison block a closure's deltas come from: walking its
  // series' closed list backwards from the closure itself, the first closed
  // summary the report names as a reference. Nothing is recomputed.
  const referenceFor = (rep, closed, path) => {
    const refs = get(rep, 'comparison.references') || [];
    let i = closed.indexOf(path);
    if (i < 0) i = closed.length;
    for (let k = i - 1; k >= 0; k--) {
      const r = refs.find((x) => x.path === closed[k]);
      if (r) return r;
    }
    return null;
  };
  const refId = (ref) => ref ? featureId((ref.path || '').split('/').pop()) : '';
  const readingDelta = (ref, world, name) => {
    if (!ref) return NaN;
    const c = (ref.cases || []).find((x) => x.case === world);
    if (!c || c.absent_in_reference) return NaN;
    const r = (c.readings || []).find((x) => x.name === name);
    return r ? num(r.percent_delta) : NaN;
  };
  const counterRow = (ref, name) => ref ? (ref.counters || []).find((x) => x.name === name) : undefined;
  const deltaText = (ref, v) => Number.isFinite(v) ? `${signed(v)}% vs ${refId(ref)}, single run` : 'no delta stored';
  const counterLevel = (ref, key) => { const c = counterRow(ref, key); return c ? ` · ${signed(num(c.percent_delta))}% vs ${refId(ref)}, single run, level ${c.level}` : ''; };

  // ── Chart primitives ─────────────────────────────────────────────────────
  function card(title, sub) {
    const c = el('div', 'card');
    const head = el('div', 'card-head');
    const tw = el('div');
    tw.appendChild(el('h3', null, title));
    if (sub) tw.appendChild(el('p', 'sub', sub));
    head.appendChild(tw);
    c.appendChild(head);
    return { card: c, head };
  }

  function addTableToggle(c, plotEl, tableEl) {
    const b = el('button', null, 'Table');
    b.type = 'button';
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => {
      const on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      plotEl.hidden = on;
      tableEl.hidden = !on;
    });
    c.head.appendChild(b);
    tableEl.hidden = true;
    c.card.appendChild(tableEl);
  }

  function table(headers, rows, rowClass) {
    const wrap = el('div', 'tbl');
    const t = el('table');
    const thead = el('thead'); const tr = el('tr');
    headers.forEach((h) => tr.appendChild(el('th', null, h)));
    thead.appendChild(tr); t.appendChild(thead);
    const tb = el('tbody');
    rows.forEach((r, i) => {
      const tr2 = el('tr', rowClass ? rowClass(i) : null);
      r.forEach((v) => tr2.appendChild(el('td', null, v)));
      tb.appendChild(tr2);
    });
    t.appendChild(tb);
    wrap.appendChild(t);
    return wrap;
  }

  function legend(items, rect) {
    const l = el('div', 'legend');
    items.forEach((it) => {
      const s = el('span');
      const i = el('i', (rect ? 'rect' : '') + (it.cls ? ' ' + it.cls : ''));
      i.style.background = it.color || 'transparent';
      if (it.cls === 'hist') i.style.color = it.color;
      s.appendChild(i);
      s.appendChild(document.createTextNode(it.name));
      l.appendChild(s);
    });
    return l;
  }

  // Redraw a plot at its real pixel width whenever the width changes.
  const observeWidth = (plot, draw) => {
    if (typeof ResizeObserver === 'undefined') { requestAnimationFrame(draw); return; }
    let last = -1;
    new ResizeObserver(() => {
      const w = Math.round(plot.clientWidth);
      if (w > 0 && w !== last) { last = w; draw(); }
    }).observe(plot);
  };

  function tooltip() { return el('div', 'tip'); }

  function showTip(tip, plot, x, y, titleText, rows, meta) {
    tip.replaceChildren();
    tip.appendChild(el('div', 't', titleText));
    if (meta) tip.appendChild(el('div', 'm', meta));
    rows.forEach((r) => {
      const d = el('div', 'row');
      const i = el('i'); i.style.background = r.color || 'transparent'; d.appendChild(i);
      d.appendChild(el('b', null, r.value));
      d.appendChild(el('span', null, r.name));
      tip.appendChild(d);
    });
    tip.style.display = 'block';
    const pw = plot.clientWidth;
    const tw = tip.offsetWidth;
    let left = x + 14;
    if (left + tw > pw) left = Math.max(0, x - tw - 14);
    tip.style.left = left + 'px';
    tip.style.top = Math.max(0, y - 10) + 'px';
  }

  // The x-axis shared by every panel in a row.
  // axis: { labels: string[], meta?: (i, panel) => string, breakAt?: index of
  //   the first goal-worlds point, gaps?: {i: reason}, title? }
  // panel: { name, series: [{ name, color, values, details?, emph?, muted?, dots? }],
  //   band?, refLines?: [{ y, label, floor? }], markFrom?: first index that
  //   draws a not-measured mark when every series is a gap }
  function linePanel(plot, axis, panel, dom, opts, first) {
    const { yFmt = fmtTick, tipFmt = fmt, height = 200 } = opts;
    const n = axis.labels.length;
    const series = panel.series;
    const draw = () => {
      const W = Math.max(200, Math.round(plot.clientWidth) || 380), H = height;
      plot.replaceChildren();
      const m = { t: 14, r: 10, b: axis.title ? 40 : 28, l: first ? 46 : 12 };
      const iw = W - m.l - m.r, ih = H - m.t - m.b;
      const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': `${opts.title} — ${panel.name}` });
      const xAt = (i) => m.l + (n <= 1 ? iw / 2 : (i * iw) / (n - 1));
      const { lo, hi, ticks } = dom;
      // A value above the shared scale draws at the top edge as a clipped mark.
      const yAt = (v) => m.t + ih - ((Math.min(v, hi) - lo) / (hi - lo)) * ih;

      const grid = svgEl('g', { class: 'grid' });
      ticks.forEach((t) => {
        grid.appendChild(svgEl('line', { x1: m.l, x2: m.l + iw, y1: yAt(t), y2: yAt(t) }));
        if (first) {
          const lab = svgEl('text', { x: m.l - 6, y: yAt(t) + 4, 'text-anchor': 'end', class: 'tick' });
          lab.textContent = yFmt(t);
          grid.appendChild(lab);
        }
      });
      svg.appendChild(grid);
      svg.appendChild(svgEl('line', { class: 'axis', x1: m.l, x2: m.l + iw, y1: m.t + ih, y2: m.t + ih }));

      const every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(iw / 50))));
      axis.labels.forEach((lab, i) => {
        if ((n - 1 - i) % every !== 0) return;
        const t = svgEl('text', { x: xAt(i), y: m.t + ih + 15, 'text-anchor': i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle', class: 'tick' });
        t.textContent = tickLabel(lab);
        svg.appendChild(t);
      });
      if (axis.title) {
        const t = svgEl('text', { x: m.l + iw / 2, y: H - 5, 'text-anchor': 'middle' });
        t.textContent = axis.title;
        svg.appendChild(t);
      }

      const brk = axis.breakAt;
      if (brk > 0 && brk < n) {
        const bx = (xAt(brk - 1) + xAt(brk)) / 2;
        svg.appendChild(svgEl('line', { class: 'brk', x1: bx, x2: bx, y1: m.t, y2: m.t + ih }));
        if (first) {
          const t = svgEl('text', { class: 'brk-label', x: bx + 4, y: m.t + 9, 'text-anchor': 'start' });
          t.textContent = BREAK_LABEL;
          svg.appendChild(t);
        }
      }

      if (panel.band) {
        const b = panel.band;
        const pts = [];
        for (let i = 0; i < n; i++) if (Number.isFinite(b.lo[i]) && Number.isFinite(b.hi[i])) pts.push(i);
        if (pts.length) {
          let d = 'M' + pts.map((i) => `${xAt(i)},${yAt(b.hi[i])}`).join('L');
          d += 'L' + pts.slice().reverse().map((i) => `${xAt(i)},${yAt(b.lo[i])}`).join('L') + 'Z';
          svg.appendChild(svgEl('path', { d, class: 'band', fill: b.color }));
        }
      }

      (panel.marks || []).forEach((a) => {
        if (!(a.x >= 0 && a.x < n)) return;
        svg.appendChild(svgEl('line', { class: 'ann', x1: xAt(a.x), x2: xAt(a.x), y1: m.t, y2: m.t + ih }));
        if (first) {
          const right = xAt(a.x) > m.l + iw / 2;
          const t = svgEl('text', { class: 'ann-label', x: xAt(a.x) + (right ? -4 : 4), y: m.t + ih - 6, 'text-anchor': right ? 'end' : 'start' });
          t.textContent = a.label;
          svg.appendChild(t);
        }
      });
      (panel.refLines || []).forEach((r) => {
        if (!Number.isFinite(r.y)) return;
        svg.appendChild(svgEl('line', { class: 'ref' + (r.floor ? ' floor' : ''), x1: m.l, x2: m.l + iw, y1: yAt(r.y), y2: yAt(r.y) }));
        const t = svgEl('text', { class: 'ref-label', x: m.l + 4, y: yAt(r.y) - 4 });
        t.textContent = r.label;
        svg.appendChild(t);
      });

      series.forEach((s) => {
        // The pen lifts at a gap and at the break: no segment crosses either.
        const seg = (from, to, cls) => {
          let d = '', pen = false;
          for (let i = from; i < to; i++) {
            const v = s.values[i];
            if (!Number.isFinite(v)) { pen = false; continue; }
            d += (pen ? 'L' : 'M') + xAt(i) + ',' + yAt(v);
            pen = true;
          }
          if (d) svg.appendChild(svgEl('path', { d, class: 'line' + cls, stroke: s.color }));
        };
        const cls = (s.emph ? ' emph' : '') + (s.muted ? ' muted' : '');
        const b = brk === undefined ? 0 : brk;
        seg(0, b, cls + ' hist');
        seg(b, n, cls);
        s.values.forEach((v, i) => {
          if (!Number.isFinite(v)) return;
          const isolated = !Number.isFinite(s.values[i - 1]) && !Number.isFinite(s.values[i + 1]);
          if (v > hi) {
            const x = xAt(i), y = m.t + 1;
            svg.appendChild(svgEl('path', { class: 'dot clip' + (i < b ? ' hist' : ''), d: `M${x - 4},${y + 7}L${x + 4},${y + 7}L${x},${y}Z`, fill: s.color }));
          } else if (s.dots !== false || isolated) {
            svg.appendChild(svgEl('circle', { class: 'dot' + (i < b ? ' hist' : ''), cx: xAt(i), cy: yAt(v), r: s.emph ? 4 : 3.5, fill: s.color }));
          }
        });
      });

      // A position nothing measured: a hollow mark on the axis, never a zero.
      const markFrom = panel.markFrom === undefined ? 0 : panel.markFrom;
      for (let i = markFrom; i < n; i++) {
        if (series.some((s) => Number.isFinite(s.values[i]))) continue;
        svg.appendChild(svgEl('circle', { class: 'nm', cx: xAt(i), cy: m.t + ih, r: 3.5 }));
      }
      if (!series.some((s) => s.values.some(Number.isFinite))) {
        const t = svgEl('text', { x: m.l + iw / 2, y: m.t + ih / 2, 'text-anchor': 'middle' });
        t.textContent = NOT_MEASURED;
        svg.appendChild(t);
      }

      const xhair = svgEl('line', { class: 'xhair', y1: m.t, y2: m.t + ih, visibility: 'hidden' });
      svg.appendChild(xhair);
      const hit = svgEl('rect', { x: m.l, y: m.t, width: iw, height: ih, fill: 'transparent' });
      svg.appendChild(hit);
      const tip = tooltip();
      plot.appendChild(svg);
      plot.appendChild(tip);
      hit.addEventListener('pointermove', (ev) => {
        const r = svg.getBoundingClientRect();
        const sx = (ev.clientX - r.left) * (W / r.width);
        let best = 0, bd = Infinity;
        for (let i = 0; i < n; i++) { const d = Math.abs(xAt(i) - sx); if (d < bd) { bd = d; best = i; } }
        xhair.setAttribute('x1', xAt(best)); xhair.setAttribute('x2', xAt(best));
        xhair.setAttribute('visibility', 'visible');
        const gap = axis.gaps && axis.gaps[best];
        const rows = gap ? [] : series.map((s) => ({
          color: s.color, name: s.name + (s.details && s.details[best] ? ` · ${s.details[best]}` : ''),
          value: Number.isFinite(s.values[best]) ? tipFmt(s.values[best]) + (s.values[best] > hi ? ' (above the chart top)' : '') : NOT_MEASURED,
        }));
        if (panel.band && !gap) rows.push({ color: panel.band.color, name: panel.band.name || 'band', value: `${tipFmt(panel.band.lo[best])} – ${tipFmt(panel.band.hi[best])}` });
        const meta = gap ? `${NOT_MEASURED} — ${gap}` : (axis.meta ? axis.meta(best, panel) : undefined);
        showTip(tip, plot, (xAt(best) / W) * r.width, ev.clientY - r.top, `${panel.name} · ${axis.labels[best]}`, rows, meta);
      });
      hit.addEventListener('pointerleave', () => { xhair.setAttribute('visibility', 'hidden'); tip.style.display = 'none'; });
    };
    observeWidth(plot, draw);
  }

  // Stacked columns per x with an optional line drawn over the stack.
  // panel: { name, categories: [{name,color}], data: number[][] (x → category), overlay?: series, denom?: string[] }
  function stackPanel(plot, axis, panel, dom, opts, first) {
    const { yFmt = fmtTick, tipFmt = fmt, height = 200 } = opts;
    const n = axis.labels.length;
    const draw = () => {
      const W = Math.max(200, Math.round(plot.clientWidth) || 380), H = height;
      plot.replaceChildren();
      const m = { t: 14, r: 10, b: 28, l: first ? 46 : 12 };
      const iw = W - m.l - m.r, ih = H - m.t - m.b;
      const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': `${opts.title} — ${panel.name}` });
      const slot = iw / Math.max(1, n);
      const bw = Math.min(22, slot * 0.7);
      const { hi, ticks } = dom;
      const yAt = (v) => m.t + ih - (v / hi) * ih;
      const grid = svgEl('g', { class: 'grid' });
      ticks.forEach((t) => {
        grid.appendChild(svgEl('line', { x1: m.l, x2: m.l + iw, y1: yAt(t), y2: yAt(t) }));
        if (first) {
          const lab = svgEl('text', { x: m.l - 6, y: yAt(t) + 4, 'text-anchor': 'end', class: 'tick' });
          lab.textContent = yFmt(t);
          grid.appendChild(lab);
        }
      });
      svg.appendChild(grid);
      svg.appendChild(svgEl('line', { class: 'axis', x1: m.l, x2: m.l + iw, y1: m.t + ih, y2: m.t + ih }));
      const tip = tooltip();
      const every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(iw / 50))));
      const brk = axis.breakAt;
      if (brk > 0 && brk < n) {
        const bx = m.l + slot * brk;
        svg.appendChild(svgEl('line', { class: 'brk', x1: bx, x2: bx, y1: m.t, y2: m.t + ih }));
        if (first) {
          const t = svgEl('text', { class: 'brk-label', x: bx + 4, y: m.t + 9 });
          t.textContent = BREAK_LABEL;
          svg.appendChild(t);
        }
      }
      let any = false;
      axis.labels.forEach((lab, i) => {
        const cx = m.l + slot * i + slot / 2;
        if ((n - 1 - i) % every === 0) {
          const t = svgEl('text', { x: cx, y: m.t + ih + 15, 'text-anchor': 'middle', class: 'tick' });
          t.textContent = tickLabel(lab);
          svg.appendChild(t);
        }
        const row = panel.data[i];
        const measured = row && row.some(Number.isFinite);
        const markFrom = panel.markFrom === undefined ? 0 : panel.markFrom;
        if (!measured && i >= markFrom) svg.appendChild(svgEl('circle', { class: 'nm', cx, cy: m.t + ih, r: 3.5 }));
        const hit = svgEl('rect', { x: m.l + slot * i, y: m.t, width: slot, height: ih, fill: 'transparent' });
        const gap = axis.gaps && axis.gaps[i];
        hit.addEventListener('pointermove', (ev) => {
          const r = svg.getBoundingClientRect();
          const rows = (measured && !gap) ? panel.categories.map((cat, k) => ({ color: cat.color, name: cat.name, value: tipFmt(row[k]) })) : [];
          if (panel.overlay && measured) rows.unshift({ color: panel.overlay.color, name: panel.overlay.name, value: tipFmt(panel.overlay.values[i]) });
          const meta = gap ? `${NOT_MEASURED} — ${gap}` : measured ? (axis.meta ? axis.meta(i, panel) : undefined) + (panel.denom && panel.denom[i] ? ` · ${panel.denom[i]}` : '') : NOT_MEASURED;
          showTip(tip, plot, (cx / W) * r.width, ev.clientY - r.top, `${panel.name} · ${lab}`, rows, meta);
        });
        hit.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
        if (measured) {
          any = true;
          let acc = 0;
          const g = svgEl('g', { class: 'col' });
          row.forEach((v, k) => {
            if (!Number.isFinite(v) || v <= 0) return;
            const y0 = yAt(acc + v), y1 = yAt(acc);
            g.appendChild(svgEl('rect', { x: cx - bw / 2, y: y0, width: bw, height: Math.max(0, y1 - y0), fill: panel.categories[k].color }));
            acc += v;
          });
          svg.appendChild(g);
        }
        svg.appendChild(hit);
      });
      if (panel.overlay) {
        let d = '', pen = false;
        panel.overlay.values.forEach((v, i) => {
          if (!Number.isFinite(v)) { pen = false; return; }
          d += (pen ? 'L' : 'M') + (m.l + slot * i + slot / 2) + ',' + yAt(Math.min(v, hi));
          pen = true;
        });
        if (d) svg.appendChild(svgEl('path', { d, class: 'line', stroke: panel.overlay.color }));
      }
      if (!any) {
        const t = svgEl('text', { x: m.l + iw / 2, y: m.t + ih / 2, 'text-anchor': 'middle' });
        t.textContent = NOT_MEASURED;
        svg.appendChild(t);
      }
      plot.appendChild(svg); plot.appendChild(tip);
    };
    observeWidth(plot, draw);
  }

  // Horizontal bars, one per category; panel: { name, items: [{ name, value, detail, color }] }
  function barPanel(plot, panel, dom, opts) {
    const { tipFmt = fmt } = opts;
    const items = panel.items;
    const draw = () => {
      const W = Math.max(200, Math.round(plot.clientWidth) || 380);
      const rowH = 20, labW = opts.labelWidth || 150;
      const H = 10 + items.length * rowH + 4;
      plot.replaceChildren();
      const m = { t: 6, r: 56, l: labW };
      const iw = W - m.l - m.r;
      const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': `${opts.title} — ${panel.name}` });
      const tip = tooltip();
      items.forEach((it, i) => {
        const y = m.t + i * rowH;
        const lab = svgEl('text', { x: m.l - 8, y: y + 13, 'text-anchor': 'end' });
        lab.textContent = it.name;
        svg.appendChild(lab);
        const v = it.value;
        if (Number.isFinite(v)) {
          const w = dom.hi > 0 ? (v / dom.hi) * iw : 0;
          svg.appendChild(svgEl('rect', { class: 'col', x: m.l, y: y + 3, width: Math.max(0, w), height: rowH - 8, rx: 2, fill: it.color || 'var(--s1)' }));
          const t = svgEl('text', { x: m.l + Math.max(0, w) + 6, y: y + 13, class: 'tick' });
          t.textContent = tipFmt(v);
          svg.appendChild(t);
        } else {
          svg.appendChild(svgEl('circle', { class: 'nm', cx: m.l + 4, cy: y + rowH / 2 - 1, r: 3.5 }));
          const t = svgEl('text', { x: m.l + 12, y: y + 13 });
          t.textContent = NOT_MEASURED;
          svg.appendChild(t);
        }
        const hit = svgEl('rect', { x: 0, y, width: W, height: rowH, fill: 'transparent' });
        hit.addEventListener('pointermove', (ev) => {
          const r = svg.getBoundingClientRect();
          showTip(tip, plot, ev.clientX - r.left, ev.clientY - r.top, `${panel.name} · ${it.name}`,
            [{ color: it.color || 'var(--s1)', name: it.detail || '', value: Number.isFinite(v) ? tipFmt(v) : NOT_MEASURED }], panel.meta);
        });
        hit.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
        svg.appendChild(hit);
      });
      plot.appendChild(svg); plot.appendChild(tip);
    };
    observeWidth(plot, draw);
  }

  // Heatmap grid; panel: { name, rows, cols, values[row][col], colorOf, cellFmt, cell }
  function heatmap(plot, panel, opts) {
    const { rows, cols, values, colorOf, cellFmt = (v) => fmt(v), cell = 18, labW = 0 } = panel;
    const gap = 1;
    const draw = () => {
      const W = Math.max(120, Math.round(plot.clientWidth) || 300);
      const cw = labW ? cell : Math.min(cell, Math.floor((W - 4) / Math.max(1, cols.length)));
      const gw = labW + cols.length * cw + 4;
      const H = rows.length * cw + 4;
      plot.replaceChildren();
      const svg = svgEl('svg', { viewBox: `0 0 ${gw} ${H}`, width: gw, height: H, role: 'img', 'aria-label': `${opts.title} — ${panel.name}` });
      const tip = tooltip();
      rows.forEach((row, i) => {
        if (labW) {
          const lab = svgEl('text', { x: labW - 6, y: i * cw + cw / 2 + 4, 'text-anchor': 'end' });
          lab.textContent = row;
          svg.appendChild(lab);
        }
        cols.forEach((col, j) => {
          const v = values[i][j];
          const rect = svgEl('rect', { class: 'cell', x: labW + j * cw + gap / 2, y: i * cw + gap / 2, width: cw - gap, height: cw - gap, rx: 1.5, fill: colorOf(v) });
          rect.addEventListener('pointermove', (ev) => {
            const r = svg.getBoundingClientRect();
            const extra = panel.tipRows ? panel.tipRows(i, j) : [];
            showTip(tip, plot, ev.clientX - r.left, ev.clientY - r.top, `${panel.name} · ${row} × ${col}`, [{ color: colorOf(v), name: panel.valueName || 'value', value: cellFmt(v) }, ...extra], panel.meta);
          });
          rect.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
          svg.appendChild(rect);
        });
      });
      plot.appendChild(svg); plot.appendChild(tip);
    };
    observeWidth(plot, draw);
  }

  // One card, N panels in a row on one y-scale, one legend, one table.
  // opts: { title, sub, axis, panels, kind: 'line'|'stack'|'bars'|'heat'|'table', yMin, yMax, yFmt, tipFmt, height, legendItems, hideLegend }
  function row(opts) {
    const { title, sub, axis, panels, kind = 'line', yMin = 0, yMax, tipFmt = fmt, domainFrom = 0 } = opts;
    const c = card(title, sub);
    const grid = el('div', `panels n${Math.min(3, Math.max(1, panels.length))}`);
    let dom = null;
    if (kind === 'line') {
      let lo = Infinity, hi = -Infinity;
      const consider = (v) => { if (Number.isFinite(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); } };
      panels.forEach((p) => {
        p.series.forEach((s) => s.values.forEach((v, i) => { if (i >= domainFrom) consider(v); }));
        if (p.band) { p.band.lo.forEach(consider); p.band.hi.forEach(consider); }
        (p.refLines || []).forEach((r) => consider(r.y));
      });
      if (!Number.isFinite(lo)) { lo = 0; hi = 1; }
      if (yMin !== undefined) lo = Math.min(lo, yMin);
      if (yMax !== undefined) hi = Math.max(hi, yMax);
      if (lo > 0 && lo / hi < 0.35) lo = 0;
      if (hi === lo) { hi = lo + (Math.abs(lo) || 1) * 0.5; lo = lo - (Math.abs(lo) || 1) * 0.5; if (yMin !== undefined) lo = Math.max(lo, yMin); }
      const ticks = niceTicks(lo, hi, 4);
      if (ticks.length) { lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]); }
      dom = { lo, hi, ticks };
    } else if (kind === 'stack') {
      let hi = 0;
      panels.forEach((p) => {
        p.data.forEach((r) => { const s = sum(r || []); if (s > hi) hi = s; });
        if (p.overlay) p.overlay.values.forEach((v) => { if (Number.isFinite(v) && v > hi) hi = v; });
      });
      if (yMax !== undefined) hi = Math.max(hi, yMax);
      if (!(hi > 0)) hi = 1;
      const ticks = niceTicks(0, hi, 4);
      hi = Math.max(hi, ticks[ticks.length - 1] || hi);
      dom = { lo: 0, hi, ticks };
    } else if (kind === 'bars') {
      let hi = 0;
      panels.forEach((p) => p.items.forEach((it) => { if (Number.isFinite(it.value) && it.value > hi) hi = it.value; }));
      dom = { lo: 0, hi: hi > 0 ? hi : 1 };
    }
    const plots = [];
    panels.forEach((p, k) => {
      const pane = el('div', 'panel');
      const pn = el('div', 'pn', p.name);
      if (p.caption) { pn.appendChild(document.createTextNode(' ')); pn.appendChild(el('small', null, p.caption)); }
      pane.appendChild(pn);
      if (kind === 'table') {
        pane.appendChild(table(p.headers, p.rows));
      } else {
        const plot = el('div', 'plot');
        pane.appendChild(plot);
        plots.push(plot);
        if (kind === 'line') linePanel(plot, axis, p, dom, opts, k === 0);
        else if (kind === 'stack') stackPanel(plot, axis, p, dom, opts, k === 0);
        else if (kind === 'bars') barPanel(plot, p, dom, opts);
        else if (kind === 'heat') heatmap(plot, p, opts);
      }
      grid.appendChild(pane);
    });
    c.card.appendChild(grid);
    if (opts.scaleLabel) {
      const s = el('div', 'scale');
      s.appendChild(el('span', null, opts.scaleLabel[0]));
      s.appendChild(el('span', 'bar'));
      s.appendChild(el('span', null, opts.scaleLabel[1]));
      c.card.appendChild(s);
    }
    const legendItems = opts.legendItems || (kind === 'line' ? (() => {
      const items = [];
      const seen = new Set();
      panels.forEach((p) => p.series.forEach((s) => { if (!seen.has(s.name)) { seen.add(s.name); items.push({ name: s.name, color: s.color }); } }));
      if (panels.some((p) => p.band)) items.push({ name: panels.find((p) => p.band).band.name, color: panels.find((p) => p.band).band.color, cls: 'rect' });
      if (axis && axis.breakAt > 0 && panels.some((p) => p.hasHistory)) items.push({ name: `earlier series: default world, seed ${panels.map((p) => p.seed).filter(Boolean).join('/')} (goal-v1)`, color: 'var(--ink-2)', cls: 'hist' });
      if (axis && axis.gaps && Object.keys(axis.gaps).length) items.push({ name: NOT_MEASURED, cls: 'nm' });
      return items;
    })() : kind === 'stack' ? panels[0].categories.map((x) => ({ ...x, cls: 'rect' })).concat(panels[0].overlay ? [{ name: panels[0].overlay.name, color: panels[0].overlay.color }] : []) : []);
    if (!opts.hideLegend && legendItems.length > 1) c.card.appendChild(legend(legendItems));
    if (opts.note) c.card.appendChild(el('p', 'sub', opts.note));

    // One table for the row: closure × panel × series.
    if (kind === 'line' || kind === 'stack') {
      const hdr = [axis.title ? axis.title : 'Closure'];
      const cols = [];
      panels.forEach((p) => {
        if (kind === 'line') {
          p.series.forEach((s) => { hdr.push(`${p.name} · ${s.name}`); cols.push((i) => fmt(s.values[i])); });
          if (p.band) { hdr.push(`${p.name} · ${p.band.name} low`, `${p.name} · ${p.band.name} high`); cols.push((i) => fmt(p.band.lo[i]), (i) => fmt(p.band.hi[i])); }
        } else {
          if (p.overlay) { hdr.push(`${p.name} · ${p.overlay.name}`); cols.push((i) => fmt(p.overlay.values[i])); }
          p.categories.forEach((cat, k) => { hdr.push(`${p.name} · ${cat.name}`); cols.push((i) => fmt((p.data[i] || [])[k])); });
        }
      });
      const rows = axis.labels.map((lab, i) => [lab, ...cols.map((f) => f(i))]);
      addTableToggle(c, grid, table(hdr, rows, (i) => (axis.breakAt > 0 && i < axis.breakAt ? 'hist' : null)));
    } else if (kind === 'bars') {
      const hdr = ['Reading', ...panels.map((p) => p.name)];
      const names = [];
      panels.forEach((p) => p.items.forEach((it) => { if (!names.includes(it.name)) names.push(it.name); }));
      addTableToggle(c, grid, table(hdr, names.map((nm) => [nm, ...panels.map((p) => { const it = p.items.find((x) => x.name === nm); return !it ? 'not in this world' : Number.isFinite(it.value) ? `${tipFmt(it.value)}${it.detail ? ` (${it.detail})` : ''}` : NOT_MEASURED; })])));
    } else if (kind === 'heat') {
      const hdr = ['Row', ...panels[0].cols];
      const rows = [];
      panels.forEach((p) => p.rows.forEach((r, i) => rows.push([`${p.name} · ${r}`, ...p.cols.map((_, j) => (p.cellFmt || fmt)(p.values[i][j]))])));
      addTableToggle(c, grid, table(hdr, rows));
    }
    return c.card;
  }

  function tile(question, title, worlds) {
    const t = el('div', 'tile');
    t.appendChild(el('p', 'q', question));
    t.appendChild(el('h3', null, title));
    const w = el('div', 'w');
    worlds.forEach((x) => {
      const d = el('div');
      const wr = el('div', 'wr');
      wr.appendChild(el('span', 'wn', x.world));
      const v = el('span', 'v' + (x.value === NOT_MEASURED ? ' na' : ''), x.value);
      if (x.unit) v.appendChild(el('small', null, ' ' + x.unit));
      wr.appendChild(v);
      if (x.verdict) wr.appendChild(el('span', x.verdict, x.verdict));
      d.appendChild(wr);
      const b = el('div', 'b');
      if (x.beside) b.append(x.beside + ' · ');
      b.appendChild(el('span', 'd', x.delta));
      if (x.ref) b.append(' · ' + x.ref);
      d.appendChild(b);
      w.appendChild(d);
    });
    t.appendChild(w);
    return t;
  }

  function question(title, lede) {
    const s = el('section', 'q');
    s.appendChild(el('h2', null, title));
    if (lede) s.appendChild(el('p', 'lede', lede));
    const cards = el('div', 'cards');
    s.appendChild(cards);
    return { section: s, cards };
  }

  // ── Series model ─────────────────────────────────────────────────────────
  // One closure axis for every chart over closure order: goal-v1 closures,
  // then the break, then goal-worlds-v1 closures with T13.F02's omission as a
  // gap at its place in the series.
  function buildModel(data) {
    const byPath = new Map();
    data.features.forEach((f) => Object.entries(f.paths).forEach(([prof, p]) => byPath.set(p, { f, prof })));
    const closedGoal = get(data.index, 'goal.closed') || [];
    const closedWorlds = get(data.index, 'goal_worlds.closed') || [];
    const closedGate = get(data.index, 'gate.closed') || [];
    const omissions = (get(data.index, 'report_omissions') || []).filter((o) => o.series === 'goal-worlds-v1');
    const points = [];
    closedGoal.forEach((p) => { const e = byPath.get(p); if (e && e.f.goal) points.push({ kind: 'goal', f: e.f, rep: e.f.goal, path: p, label: e.f.id }); });
    const breakAt = points.length;
    closedWorlds.forEach((p) => {
      const e = byPath.get(p);
      if (e && e.f.goal_worlds) points.push({ kind: 'world', f: e.f, rep: e.f.goal_worlds, path: p, label: e.f.id });
      omissions.filter((o) => o.retained_previous_reference === p).forEach((o) => points.push({ kind: 'gap', label: o.feature, reason: o.reason }));
    });
    const gaps = {};
    points.forEach((pt, i) => { if (pt.kind === 'gap') gaps[i] = pt.reason; });
    const worldPoints = points.filter((pt) => pt.kind === 'world');
    const latest = worldPoints[worldPoints.length - 1] || null;
    const worlds = [];
    worldPoints.forEach((pt) => (get(pt.rep, 'deterministic.goal_indicators.cases') || []).forEach((c) => {
      const name = get(c, 'case.name');
      if (name && !worlds.some((w) => w.name === name)) worlds.push({ name, short: name.split(' ')[0], seed: num(get(c, 'case.seed')) });
    }));
    const envMeta = (rep) => `${(get(rep, 'environment.generated_at') || '').slice(0, 10)} · ${get(rep, 'environment.host.cpu_model') || 'host unknown'} · ${(get(rep, 'environment.git_revision') || '').slice(0, 8)}`;
    const axis = {
      labels: points.map((pt) => pt.label),
      breakAt,
      gaps,
      meta: (i, panel) => {
        const pt = points[i];
        if (!pt || pt.kind === 'gap') return undefined;
        return `${envMeta(pt.rep)}${pt.kind === 'goal' ? ` · default world, seed ${panel.seed} (goal-v1)` : ' · three worlds (goal-worlds-v1)'}`;
      },
    };
    const goalEpoch = byPath.get(get(data.index, 'goal.epoch_baseline') || '');
    const worldEpoch = byPath.get(get(data.index, 'goal_worlds.epoch_baseline') || '');
    const gateEpoch = byPath.get(get(data.index, 'gate.epoch_baseline') || '');
    const definitionChanges = get(data.index, 'counter_definition_changes') || [];
    const gatePoints = closedGate.map((p) => byPath.get(p)).filter((e) => e && e.f.gate).map((e) => ({ f: e.f, rep: e.f.gate, path: e.f.paths.gate, label: e.f.id }));
    return {
      points, worldPoints, axis, breakAt, worlds, latest, closedGoal, closedWorlds, closedGate, envMeta, gatePoints, definitionChanges,
      goalEpoch: goalEpoch ? goalEpoch.f.goal : null, worldEpoch: worldEpoch ? worldEpoch.f.goal_worlds : null, gateEpoch: gateEpoch ? gateEpoch.f.gate : null,
      latestRef: latest ? referenceFor(latest.rep, closedWorlds, latest.path) : null,
    };
  }

  // Values over the closure axis for one world. `onWorld(rep, obs, seed, point)`
  // reads a goal-worlds closure; `onGoal(rep, seed, point)`, when given, reads
  // the same seed's default-world reading from a goal-v1 closure.
  const seriesFor = (M, world, onWorld, onGoal) => M.points.map((pt) => {
    if (pt.kind === 'gap') return NaN;
    if (pt.kind === 'goal') return onGoal ? num(onGoal(pt.rep, world.seed, pt)) : NaN;
    const obs = worldCase(pt.rep, world.name);
    return obs ? num(onWorld(pt.rep, obs, world.seed, pt)) : NaN;
  });
  // A seed-indexed reading that both series carry, read the same way on each.
  const seedSeries = (M, world, read) => seriesFor(M, world, (rep, obs, seed) => read(rep, seed), read);
  const pointRef = (M, pt) => referenceFor(pt.rep, pt.kind === 'world' ? M.closedWorlds : M.closedGoal, pt.path);
  const worldPanel = (M, w, build) => {
    const p = build(w);
    p.name = w.short;
    p.seed = w.seed;
    if (p.hasHistory === undefined) p.hasHistory = p.series.some((s) => s.values.slice(0, M.breakAt).some(Number.isFinite));
    if (p.markFrom === undefined) p.markFrom = p.hasHistory ? 0 : M.breakAt;
    return p;
  };
  const worldPanels = (M, build) => M.worlds.map((w) => worldPanel(M, w, build));
  const firstReading = (values, M) => {
    for (let i = M.breakAt; i < values.length; i++) if (Number.isFinite(values[i])) return { y: values[i], label: `first reading, ${M.points[i].label}` };
    return null;
  };
  const refLines = (values, M) => { const r = firstReading(values, M); return r ? [r] : []; };
  const pop = (rep, seed) => gi(rep, 'population_persistence', seed) || {};
  const samplesOf = (rep, seed) => { const s = pop(rep, seed).samples; return Array.isArray(s) ? s : []; };
  const lastSample = (rep, seed) => { const s = samplesOf(rep, seed); return s.length ? s[s.length - 1] : {}; };
  const checkpointTicks = (M) => {
    const ticks = new Set();
    M.worldPoints.forEach((pt) => M.worlds.forEach((w) => samplesOf(pt.rep, w.seed).forEach((s) => ticks.add(num(s.tick)))));
    return [...ticks].filter(Number.isFinite).sort((a, b) => a - b);
  };

  // Checkpoint rows: x is the tick, one line per goal-worlds closure, latest emphasized.
  function checkpointRow(M, title, sub, field, opts = {}) {
    const worldPts = M.worldPoints;
    const xs = checkpointTicks(M);
    const axis = { labels: xs.map(String), title: 'tick', meta: (i, panel) => panel.meta ? panel.meta[i] : undefined };
    const panels = worldPanels(M, (w) => ({
      hasHistory: true, markFrom: 0,
      series: worldPts.map((pt, k) => {
        const mp = new Map();
        samplesOf(pt.rep, w.seed).forEach((s) => mp.set(num(s.tick), num(field(s, pt.rep, w))));
        const last = k === worldPts.length - 1;
        return { name: pt.label, color: ramp(k, worldPts.length), emph: last, dots: last, values: xs.map((t) => (mp.has(t) ? mp.get(t) : NaN)) };
      }),
    }));
    panels.forEach((p) => { p.meta = xs.map(() => `${worldPts.length} closures, ${worldPts[0].label} to ${worldPts[worldPts.length - 1].label}; darker is later`); });
    const span = `one line per goal-worlds-v1 closure, ${worldPts[0] ? worldPts[0].label : ''} → ${M.latest ? M.latest.label : ''}, darker is later, the latest is emphasized`;
    return row(Object.assign({ title, sub: `${sub}; ${span}`, axis, panels, hideLegend: true, height: 170 }, opts));
  }

  // ── Rendering ────────────────────────────────────────────────────────────
  function renderHeadline(M, app) {
    const ref = M.latestRef;
    const latest = M.latest;
    const per = (fn) => M.worlds.map((w) => {
      const obs = worldCase(latest.rep, w.name);
      return fn(w, obs || {}, latest.rep);
    });
    const tiles = el('div', 'tiles');
    const refText = (values, f) => { const r = firstReading(values, M); return r ? `first reading ${f(r.y)} at ${r.label.replace('first reading, ', '')}` : 'no first reading'; };

    // Alive
    {
      const finals = M.worlds.map((w) => seriesFor(M, w, (rep, obs, seed) => pop(rep, seed).final_population));
      tiles.appendChild(tile('Is the world alive?', 'Creatures alive at the last tick', per((w, obs, rep) => ({
        world: w.short,
        value: Number.isFinite(num(pop(rep, w.seed).final_population)) ? fmt(num(pop(rep, w.seed).final_population), 0) : NOT_MEASURED,
        beside: `lowest ${fmt(num(pop(rep, w.seed).minimum_population), 0)} across ${samplesOf(rep, w.seed).length} checkpoints`,
        delta: deltaText(ref, readingDelta(ref, w.name, 'final_population')),
        ref: refText(finals[M.worlds.indexOf(w)], (v) => fmt(v, 0)),
      }))));
    }
    // Ways of living
    {
      const clades = M.worlds.map((w) => seriesFor(M, w, (rep, obs, seed) => get(gi(rep, 'lineage_diversity', seed), 'surviving_founder_clade_count')));
      tiles.appendChild(tile('How many ways of living?', 'Founder clades alive (a founder’s descendants)', per((w, obs, rep) => {
        const ld = gi(rep, 'lineage_diversity', w.seed) || {};
        return {
          world: w.short,
          value: Number.isFinite(num(ld.surviving_founder_clade_count)) ? fmt(num(ld.surviving_founder_clade_count), 0) : NOT_MEASURED,
          beside: `lineage entropy ${fmt(num(ld.shannon_entropy_nats), 3)} nats`,
          delta: deltaText(ref, readingDelta(ref, w.name, 'surviving_founder_clade_count')),
          ref: refText(clades[M.worlds.indexOf(w)], (v) => fmt(v, 0)),
        };
      })));
    }
    // Cognition present
    {
      const mem = M.worlds.map((w) => seriesFor(M, w, (rep, obs, seed) => get(gi(rep, 'memory_sensitivity', seed), 'different_from_either_fraction')));
      tiles.appendChild(tile('Is cognition present?', 'Creatures acting on memory', per((w, obs, rep) => {
        const ms = gi(rep, 'memory_sensitivity', w.seed) || {};
        const v = num(ms.different_from_either_fraction);
        return {
          world: w.short,
          value: Number.isFinite(v) ? pct(v) : NOT_MEASURED,
          beside: `${fmt(num(ms.different_from_either_count), 0)} of ${fmt(num(ms.final_creature_count), 0)} creatures at the end`,
          delta: deltaText(ref, readingDelta(ref, w.name, 'memory_different_from_either_fraction')),
          ref: refText(mem[M.worlds.indexOf(w)], pct),
        };
      })));
    }
    // Cognition paying
    {
      tiles.appendChild(tile('Is cognition paying?', 'Offspring per creature, state vs none', per((w, obs) => {
        const st = get(obs, 'reproductive_success_by_cognitive_class.by_class.stateful') || {};
        const no = get(obs, 'reproductive_success_by_cognitive_class.by_class.none') || {};
        const a = ratio(num(st.offspring_spawned_sum), num(st.creatures_observed_total));
        const b = ratio(num(no.offspring_spawned_sum), num(no.creatures_observed_total));
        return {
          world: w.short,
          value: Number.isFinite(a) ? fmt(a, 3) : NOT_MEASURED,
          unit: Number.isFinite(b) ? `vs ${fmt(b, 3)} with none` : '',
          beside: Number.isFinite(a) ? `${fmt(num(st.creatures_observed_total), 0)} with state, ${fmt(num(no.creatures_observed_total), 0)} without` : '',
          delta: 'no delta stored',
          ref: 'no first reading',
        };
      })));
    }
    // Evolvable
    {
      tiles.appendChild(tile('Is the substrate still evolvable?', 'Mutated births that changed behavior', per((w, obs) => {
        const nr = get(obs, 'neighborhood_read') || {};
        const v = num(nr.changed_per_all_births);
        const floor = F12_FLOORS[w.short];
        const births = num(get(nr, 'births.births_total'));
        const genomes = Array.isArray(nr.genomes) ? nr.genomes.length : num(nr.sample_size);
        return {
          world: w.short,
          value: Number.isFinite(v) ? pct(v) : NOT_MEASURED,
          beside: Number.isFinite(births) ? `${fmt(births, 0)} births from ${fmt(genomes, 0)} genomes` : '',
          delta: deltaText(ref, readingDelta(ref, w.name, 'neighborhood_read_changed_per_all_births')),
          ref: Number.isFinite(floor) ? `floor ${pct(floor)}, set at T14.F12` : 'no floor set',
          verdict: Number.isFinite(floor) && Number.isFinite(v) ? (v >= floor ? 'pass' : 'fail') : '',
        };
      })));
    }
    app.appendChild(tiles);
    const p = el('p', 'art');
    p.textContent = `Tiles show ${latest.label}, the latest closure, run ${(get(latest.rep, 'environment.generated_at') || '').slice(0, 10)} on ${get(latest.rep, 'environment.host.cpu_model') || 'an unrecorded host'}. Each world is a different environment, not a repeat with another seed. Each delta compares one run with one stored run (${refId(ref) || 'none stored'}). A first reading is the first three-world closure that measured the indicator.`;
    app.appendChild(p);
  }

  function renderAlive(M, app) {
    const q = question('1. Is the world alive?', 'How many creatures each world holds, and the births, deaths, energy and food behind that number. One panel per world, one point per closure. Every indicator this question needs is measured.');
    q.cards.appendChild(checkpointRow(M, 'Population at each of the 20 checkpoints', 'population_persistence.per_seed[<s>].samples[].population', (s) => s.population, { height: 120 }));
    q.cards.appendChild(row({
      title: 'Population at the end, at its lowest, and at plateau, per closure', sub: 'population_persistence.per_seed[<s>].{final_population,minimum_population,plateau_population}', axis: M.axis,
      panels: worldPanels(M, (w) => {
        const finals = seedSeries(M, w, (rep, seed) => pop(rep, seed).final_population);
        return {
          refLines: refLines(finals, M),
          series: [
            { name: 'at the end', color: SERIES[0], emph: true, values: finals },
            { name: 'lowest', color: SERIES[1], values: seedSeries(M, w, (rep, seed) => pop(rep, seed).minimum_population) },
            { name: 'plateau', color: SERIES[2], values: seedSeries(M, w, (rep, seed) => pop(rep, seed).plateau_population) },
          ],
        };
      }),
    }));
    q.cards.appendChild(row({
      title: 'Births and deaths per closure', sub: 'deterministic.per_seed[<s>].births; cases[<w>].mortality.deaths_total (T14.F03)', axis: M.axis,
      panels: worldPanels(M, (w) => {
        const births = seedSeries(M, w, (rep, seed) => get(seedRow(rep, 'deterministic.per_seed', seed), 'births'));
        return {
          refLines: refLines(births, M),
          series: [
            { name: 'births', color: SERIES[0], values: births },
            { name: 'deaths', color: SERIES[1], values: seriesFor(M, w, (rep, obs) => get(obs, 'mortality.deaths_total')) },
          ],
        };
      }),
    }));
    {
      const causes = [];
      M.worldPoints.forEach((pt) => M.worlds.forEach((w) => Object.keys(get(worldCase(pt.rep, w.name), 'mortality.by_cause') || {}).forEach((k) => { if (!causes.includes(k)) causes.push(k); })));
      const cats = causes.map((k, i) => ({ name: k.replace(/_/g, ' '), color: CAT_COLORS[i % CAT_COLORS.length] }));
      q.cards.appendChild(row({
        title: 'Deaths by cause, as a share of all deaths', sub: 'cases[<w>].mortality.by_cause / deaths_total (T14.F03)', axis: M.axis, kind: 'stack', yFmt: pctTick, tipFmt: pct,
        panels: worldPanels(M, (w) => ({
          series: [], markFrom: M.breakAt,
          data: M.points.map((pt) => {
            if (pt.kind !== 'world') return null;
            const mort = get(worldCase(pt.rep, w.name), 'mortality');
            const total = num(get(mort, 'deaths_total'));
            return mort ? causes.map((k) => ratio(num(get(mort, `by_cause.${k}`)), total)) : null;
          }),
          denom: M.points.map((pt) => pt.kind === 'world' ? `${fmt(num(get(worldCase(pt.rep, w.name), 'mortality.deaths_total')), 0)} deaths` : ''),
        })).map((p) => Object.assign(p, { categories: cats })),
      }));
    }
    {
      const CHARGES = ['lifecycle_decay', 'action_charges', 'genome_carrying', 'vm_compute', 'graph_compute', 'priority_bid', 'failed_action_penalty',
        'hebbian_learning', 'reward_learning', 'parental_transfer_debit', 'predation_victim_debit', 'external_removal_loss', 'maximum_energy_clamp_loss'];
      const cats = CHARGES.map((k, i) => ({ name: k.replace(/_/g, ' '), color: CAT_COLORS[i % CAT_COLORS.length] }));
      const charge = (ef, k) => k === 'action_charges' ? sum(Object.values(get(ef, 'action_charges') || {}).map(num)) : num(get(ef, k));
      q.cards.appendChild(row({
        title: 'Energy spent, by kind, with food eaten drawn as the line', sub: 'cases[<w>].energy_flows: thirteen charge keys stacked; the line is food_intake_by_type summed (T14.F03)', axis: M.axis, kind: 'stack',
        panels: worldPanels(M, (w) => ({

  // Display rows for one world's `mutation_effects` block (T11.F26), pure over
  // the block so fixtures can check every count and ratio shown. A report
  // without the block reads "not measured"; an Undefined block or cohort
  // reads "undefined: <reason>"; a zero denominator reads "undefined".
  const COHORT_NAMES = ['founder', 'drift', 'selected'];
  function mutationEffectsView(block) {
    if (block === undefined || block === null) return { status: NOT_MEASURED };
    if (typeof block === 'string') return { status: `undefined: ${block}` };
    const share = (n, d) => (Number.isFinite(n) && d > 0 ? `${fmt(n, 0)} of ${fmt(d, 0)} (${pct(n / d)})` : 'undefined');
    const perBirth = (n, d) => (d > 0 ? fmt(n / d, 3) : 'undefined');
    const fields = block.count_fields || [];
    const counts = (row) => Object.fromEntries(fields.map((f, i) => [f, num((row || [])[i])]));
    const sideSum = (side) => sum(['silent', 'changed', 'dead', 'zero_applied'].map((k) => num(get(side, k))));
    const exposure = (block.exposure || []).map((r) => {
      const births = num(r.births_total);
      return {
        panel: r.panel, supply: r.supply,
        requestedPerBirth: perBirth(num(r.requested_events_total), births),
        appliedPerBirth: perBirth(num(r.applied_events_total), births),
        zeroApplied: share(num(r.zero_requested) + num(r.requested_all_skipped), births),
        identical: share(num(r.genome_identical), num(r.event_bearing)),
        allNoop: share(num(r.parents_all_noop), num(r.parents)),
        oneQueue: share(num(r.parents_one_queue), num(r.parents)),
        fromActing: share(sideSum(r.from_acting), births),
      };
    });
    const mean = (rows, key) => (rows.length ? fmt(sum(rows.map((p) => num(p[key]))) / rows.length, 1) : 'undefined');
    const cohorts = (block.cohorts || []).map((c, i) => {
      const name = COHORT_NAMES[i] || `cohort ${i}`;
      if (typeof c === 'string') return { name, status: `undefined: ${c}` };
      const t = counts(c.totals);
      const applied = t.proposals - t.skipped;
      const silent = applied - t.action_changed - t.action_dead;
      const cov = c.coverage || {};
      const pairs = num(cov.pairs_sampled);
      const parents = c.parents || [];
      const detail = (rows) => (rows || []).map((r) => {
        const k = counts(r.counts);
        return [r.key, fmt(k.proposals, 0), fmt(k.skipped, 0), fmt(k.proposals - k.skipped, 0)]
          .concat(fields.slice(2).map((f) => fmt(k[f], 0)));
      });
      return {
        name, identity: c.identity,
        parents: `${fmt(num(c.parents_evaluated), 0)} of ${fmt(num(c.parents_requested), 0)} requested`,
        meanDepthOrGeneration: mean(parents, 'depth_or_generation'),
        meanGenomeSize: mean(parents, 'genome_size'),
        proposals: fmt(t.proposals, 0), skipped: fmt(t.skipped, 0), applied: fmt(applied, 0),
        categories: fields.slice(2, 9).map((f) => [f, share(t[f], applied)]),
        actionEffects: share(t.action_changed + t.action_dead, applied),
        silentWithStateOrCost: share(t.silent_with_state_or_cost, silent),
        unresolved: share(t.unresolved, applied),
        consistencyViolations: fmt(t.consistency_violations, 0),
        coverage: {
          pairs: `${fmt(pairs, 0)} of ${fmt(num(cov.pairs_requested), 0)} requested`,
          recorded: cov.differ_recorded === null || cov.differ_recorded === undefined ? 'undefined' : share(num(cov.differ_recorded), pairs),
          authored: share(num(cov.differ_authored), pairs),
          early: share(num(cov.differ_sequence_ticks_1_4), pairs),
          late: share(num(cov.differ_sequence_ticks_5_32), pairs),
          any: share(num(cov.differ_any), pairs),
          stateOnly: share(num(cov.state_or_cost_only), pairs),
          noopActing: share(num(cov.all_noop_parents_acting), num(cov.all_noop_parents)),
        },
        operators: detail(c.operators),
        targets: detail(c.targets),
      };
    });
    const cov = block.coverage || {};
    const recorded = cov.recorded;
    return {
      status: 'measured', version: block.version, batteryVersion: block.battery_version, coverageVersion: cov.version, fields,
      exposure, cohorts,
      recorded: typeof recorded === 'string' || recorded === undefined
        ? `undefined: ${recorded || NOT_MEASURED}`
        : `${fmt(num(recorded.actual), 0)} of ${fmt(num(recorded.requested), 0)} requested`,
      sequenceSource: cov.sequence_source,
      controls: (cov.controls || []).map((x) => [x.name, x.passed ? 'passed' : 'failed', (x.differing_groups || []).join(', ') || 'none']),
    };
  }

  function renderMutationEffects(M, cards) {
    const views = M.worlds.map((w) => ({ w, v: mutationEffectsView(M.latest ? get(worldCase(M.latest.rep, w.name), 'mutation_effects') : undefined) }));
    const label = M.latest ? `latest goal-worlds-v1 closure ${M.latest.label}` : NOT_MEASURED;
    const note = (c) => {
      const p = el('p', 'sub', 'An action change is not evidence of useful behavior. Drift depth and selected generation, and pinned and own-size supply, are separate panels, never one trend. ');
      const a = el('a', null, 'Closure reading (T11.F26)');
      a.href = 'readings/t11-f26.md';
      p.appendChild(a);
      c.card.appendChild(p);
    };
    const add = (title, sub, headers, rowsOf) => {
      const rows = [];
      views.forEach(({ w, v }) => {
        if (v.status !== 'measured') { rows.push([w.short, v.status].concat(headers.slice(2).map(() => ''))); return; }
        rowsOf(v).forEach((r) => rows.push([w.short].concat(r)));
      });
      const c = card(title, `${sub} · ${label}`);
      c.card.appendChild(table(headers, rows));
      if (!cards.querySelector('a[href="readings/t11-f26.md"]')) note(c);
      cards.appendChild(c.card);
    };
    const cohortRows = (v, cells) => v.cohorts.map((c) => (c.status ? [c.name, c.status] : [c.name].concat(cells(c))));

            details: M.points.map((pt) => { if (pt.kind !== 'world') return ''; const s = get(worldCase(pt.rep, w.name), 'mutation_outcome_summary'); return s ? `${fmt(num(s.survived_short_horizon_total), 0)} of ${fmt(num(s.carriers_observed_total), 0)} carriers` : ''; }) },

  function renderCost(M, app) {
    const q = question('5. What did this closure cost?', 'Work per creature-tick (one creature simulated for one tick), as a percent of the series’ epoch baseline (the closure every later one is measured against). Wall clock on the recorded host. The gate profile is the shorter benchmark run every closure records. Each percent delta is the stored comparison’s, single run; the hover names its level.');
    const ctr = (rep, seed, key) => { const r = seedRow(rep, 'deterministic.per_seed', seed); return r ? ratio(num(r[key]), num(r.creature_ticks)) : NaN; };
    const baseOf = (pt) => (pt.kind === 'goal' ? M.goalEpoch : M.worldEpoch);
    const baseId = (rep) => (rep ? featureId(rep.feature || '') : '');
    const marksOn = (labels) => M.definitionChanges.map((c) => ({ x: labels.indexOf(c.feature), label: `${c.counter} counted differently from ${c.feature}` })).filter((a) => a.x >= 0);
    q.cards.appendChild(row({
      title: 'Six work counters as percent of the series’ epoch baseline', sub: `deterministic.per_seed[<s>].<counter> / creature_ticks over the same seed in the epoch baseline: ${baseId(M.goalEpoch) || 'none'} left of the break, ${baseId(M.worldEpoch) || 'none'} right of it; the scale fits the goal-worlds-v1 segment, a triangle at the top is a goal-v1 point above it; hover carries the stored level`, axis: M.axis, yFmt: pctTick, tipFmt: pct, domainFrom: M.breakAt,
      panels: worldPanels(M, (w) => ({
        marks: marksOn(M.axis.labels),
        refLines: [{ y: 1, label: `epoch baseline 100% (${baseId(M.goalEpoch)} · ${baseId(M.worldEpoch)})` }],
        series: COUNTERS.map(([key, name], i) => ({
          name, color: SERIES[i],
          values: M.points.map((pt) => pt.kind === 'gap' ? NaN : ratio(ctr(pt.rep, w.seed, key), ctr(baseOf(pt), w.seed, key))),
          details: M.points.map((pt) => pt.kind === 'gap' ? '' : `${fmt(ctr(pt.rep, w.seed, key), 4)} per creature-tick${counterLevel(pointRef(M, pt), key)}`),
        })),
      })),
    }));
    q.cards.appendChild(row({
      title: 'Wall clock per creature-tick (compare only on the same host)', sub: 'environment.wall_clock_ms_per_seed[<s>].wall_clock_ms / per_seed[<s>].creature_ticks; comparable only on the same host, which the hover names; the scale fits the goal-worlds-v1 segment', axis: M.axis, tipFmt: (v) => Number.isFinite(v) ? v.toFixed(6) + ' ms' : '—', domainFrom: M.breakAt,
      panels: worldPanels(M, (w) => {
        const v = seedSeries(M, w, (rep, seed) => { const wc = seedRow(rep, 'environment.wall_clock_ms_per_seed', seed); const r = seedRow(rep, 'deterministic.per_seed', seed); return wc && r ? ratio(num(wc.wall_clock_ms), num(r.creature_ticks)) : NaN; });
        return {
          refLines: refLines(v, M),
          series: [{ name: 'ms per creature-tick', color: SERIES[0], emph: true, values: v,
            details: M.points.map((pt) => { if (pt.kind === 'gap') return ''; const wcr = pointRef(M, pt); const wc = get(wcr, 'wall_clock'); return wc ? `${signed(num(wc.percent_delta))}% vs ${refId(wcr)}, single run, level ${get(wc, 'level')}` : ''; }) }],
        };
      }),
    }));
    {
      const pts = M.gatePoints;
      const axis = { labels: pts.map((p) => p.label), meta: (i) => `${M.envMeta(pts[i].rep)} · gate profile (gate-v1)` };
      const base = M.gateEpoch;
      q.cards.appendChild(row({
        title: 'Gate profile: six work counters as a percent of the gate epoch baseline', sub: `deterministic.per_creature_tick.<counter> over ${baseId(base) || 'no'} epoch baseline; environment.wall_clock_ms_per_creature_tick`, axis, yFmt: pctTick, tipFmt: pct,
        panels: [
          {
            name: 'Work per creature-tick', hasHistory: true, markFrom: 0, marks: marksOn(axis.labels),
            refLines: [{ y: 1, label: `epoch baseline 100% (${baseId(base)})` }],
            series: COUNTERS.map(([key, name], i) => ({
              name, color: SERIES[i], dots: false,
              values: pts.map((p) => ratio(num(get(p.rep, `deterministic.per_creature_tick.${key}`)), num(get(base, `deterministic.per_creature_tick.${key}`)))),
              details: pts.map((p) => `${fmt(num(get(p.rep, `deterministic.per_creature_tick.${key}`)), 4)}${counterLevel(referenceFor(p.rep, M.closedGate, p.path), key)}`),
            })),
          },
        ],
      }));
      q.cards.appendChild(row({
        title: 'Gate profile: wall clock per creature-tick, seed mean', sub: 'environment.wall_clock_ms_per_creature_tick over all seeds; hover names the host', axis, tipFmt: (v) => Number.isFinite(v) ? v.toFixed(6) + ' ms' : '—',
        panels: [{
          name: 'Gate wall clock', hasHistory: true, markFrom: 0,
          series: [{ name: 'ms per creature-tick', color: SERIES[0], emph: true, values: pts.map((p) => num(get(p.rep, 'environment.wall_clock_ms_per_creature_tick'))),
            details: pts.map((p) => { const ref = referenceFor(p.rep, M.closedGate, p.path); const wc = get(ref, 'wall_clock'); return wc ? `${signed(num(wc.percent_delta))}% vs ${refId(ref)}, single run, level ${get(wc, 'level')}` : ''; }) }],
        }],
      }));
    }
    app.appendChild(q.section);
  }

  function render(data) {
    const app = document.getElementById('app');
    app.replaceChildren();
    const M = buildModel(data);
    const missing = (data.missing || []).length ? ` · ${data.missing.length} listed but not stored yet` : '';
    const worldsN = M.worldPoints.length;
    const gapsN = Object.keys(M.axis.gaps).length;
    document.getElementById('status').textContent =
      `${data.reportCount} reports loaded · ${worldsN} closures on the three worlds (goal-worlds-v1)${gapsN ? `, ${gapsN} not measured` : ''} · ${M.breakAt} on the default world (goal-v1) · ${M.gatePoints.length} gate profiles${missing}`;
    if (!M.latest) {
      app.appendChild(el('div', 'empty', 'No world-set report has been recorded yet. The goal-worlds-v1 series starts at T12.F04.'));
      return;
    }
    renderHeadline(M, app);
    renderAlive(M, app);
    renderWays(M, app);
    renderCognition(M, app);
    renderEvolvable(M, app);
    renderCost(M, app);
    renderDetail(M, app);
    document.getElementById('foot').textContent =
      `Reports discovered through benchmark-series.json (${get(data.index, 'goal.series') || ''}, ${get(data.index, 'goal_worlds.series') || ''}, ${get(data.index, 'gate.series') || ''}). ` +
      `goal-worlds-v1 starts at T12.F04; each world is a distinct environment, not a seed replicate, so cross-world deltas are not comparable. ` +
      `A hollow mark on an axis is a reading the report did not measure. No score is composed from these readings. ` +
      (M.latest.rep.kind === 'petri-benchmark-summary' ? `Latest closure: ${artifactNotice(M.latest.rep)}` : '');
  }

  function showNotice(err) {
    const n = document.getElementById('notice');
    n.hidden = false;
    const box = el('div', 'box');
    box.appendChild(el('strong', null, 'Reports not loaded.'));
    const p = el('p');
    p.textContent = location.protocol === 'file:'
      ? 'Cause: the page was opened as a file, and browsers block fetch() from file:// pages. Fix: serve it over HTTP. From the repository root, run:'
      : `Cause: ${err && err.message ? err.message : err}. Fix: make that file readable under docs/progress, then serve from the repository root:`;
    box.appendChild(p);
    const pre = el('pre', null, 'python3 -m http.server 8000 --directory docs/progress');
    box.appendChild(pre);
    const p2 = el('p');
    p2.append('then open ');
    const a = el('a', null, 'http://localhost:8000/');
    a.href = 'http://localhost:8000/';
    p2.appendChild(a);
    p2.append('.');
    box.appendChild(p2);
    n.replaceChildren(box);
    document.getElementById('status').textContent = 'Reports not loaded. See the notice below.';
  }

  // ── Boot ─────────────────────────────────────────────────────────────────
  loadAll().then(render).catch((e) => { console.error(e); showNotice(e); });
})();
</script>
</body>
</html>
