<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petri long-term record</title>
<style>
  @font-face { font-family: "Geist Sans"; src: url("vendor/geist-sans-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Geist Sans"; src: url("vendor/geist-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Geist Sans"; src: url("vendor/geist-sans-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "JetBrains Mono"; src: url("vendor/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 800; font-display: swap; }
  /* A field record on a dark slate sheet. One hairline weight; one tonal ramp;
     one amber accent reserved for the closure being read. */
  :root {
    color-scheme: dark;
    --sheet: #14181c;
    --sheet-2: #191e23;
    --sheet-3: #20262c;
    --rule: #2a3138;
    --rule-2: #3a434c;
    --ink: #ebe7dd;
    --ink-2: #b9b5aa;
    --muted: #8a877d;
    --plot-11: #199e70;
    --plot-22: #d95926;
    --plot-33: #3987e5;
    --accent: #e8b44c;
    --good: #4cc46a;
    --bad: #ef6b6b;
    --sans: "Geist Sans", ui-sans-serif, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--sheet);
    color: var(--ink);
    font: 14px/1.55 var(--sans);
    font-feature-settings: "tnum" 1;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(232, 180, 76, 0.28); color: var(--ink); }
  a { color: var(--ink); text-decoration-color: var(--rule-2); text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  html { scrollbar-color: var(--rule-2) var(--sheet); }
  .sheet { max-width: 1360px; margin: 0 auto; padding: 0 40px 56px; }

  /* Survey-sheet header: a ruled form strip. */
  header.form { padding-top: 24px; }
  .title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 32px; flex-wrap: wrap; }
  .title-row h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .title-row p { margin: 4px 0 0; color: var(--ink-2); }
  .pickers { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
  .picker { display: flex; align-items: center; gap: 10px; }
  .picker select.short { min-width: 0; }
  .picker label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .picker select {
    font: inherit; font-size: 13px; color: var(--ink); background: var(--sheet-2);
    border: 1px solid var(--rule-2); border-radius: 6px; padding: 6px 10px; min-width: 300px; max-width: 420px;
  }
  .fields { display: grid; grid-template-columns: repeat(3, minmax(120px, 1fr)) minmax(380px, 2.6fr); margin-top: 18px; border: 1px solid var(--rule); border-radius: 8px; }
  .field { padding: 8px 14px 9px; border-left: 1px solid var(--rule); min-width: 0; }
  .field:first-child { border-left: none; }
  .field .fl { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .field .fv { font-size: 16px; font-weight: 500; margin-top: 2px; }
  .field .fv small { font-size: 12px; color: var(--muted); font-weight: 400; }
  .plotmap { display: inline-flex; margin-top: 4px; border: 1px solid var(--rule-2); border-radius: 6px; overflow: hidden; }
  .plotbtn {
    appearance: none; font: inherit; font-size: 13px; color: var(--ink); background: transparent; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px; padding: 4px 14px 4px 0; border: none; border-left: 1px solid var(--rule-2); border-radius: 0;
    transition: border-color 160ms ease-out, background 160ms ease-out, opacity 160ms ease-out;
  }
  .plotbtn:first-child { border-left: none; }
  .plotbtn { background: color-mix(in srgb, var(--c) 20%, transparent); padding-left: 12px; }
  .plotbtn i { display: none; }
  .plotbtn b { font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--ink-2); }
  .plotbtn:hover { background: color-mix(in srgb, var(--c) 32%, transparent); }
  .plotbtn[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 48%, transparent); }
  .plotmap.focused .plotbtn[aria-pressed="false"] { opacity: 0.45; }
  .note { margin: 14px 0 0; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; color: var(--ink-2); }
  .note .badge { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; padding: 1px 7px; border-radius: 4px; }
  .badge.ok { color: var(--good); background: rgba(76, 196, 106, 0.12); }
  .badge.check { color: var(--bad); background: rgba(239, 107, 107, 0.12); }
  .badge.same { color: var(--ink-2); background: var(--sheet-3); }
  .note b { color: var(--ink); font-weight: 600; }

  /* Sections */
  section.part { margin-top: 44px; }
  section.part > h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.015em; }
  section.part > p.lede { margin: 4px 0 0; color: var(--ink-2); max-width: 80ch; }
  .rule-top { border-top: 1px solid var(--rule); padding-top: 22px; }

  .meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 4px; color: var(--ink-2); font-size: 13px; }
  .tag { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-2); border: 1px solid var(--rule-2); border-radius: 4px; padding: 0 6px; white-space: nowrap; }
  .fig { position: relative; margin-top: 6px; }
  .fig svg { display: block; overflow: visible; }
  .fig .hover-line { position: absolute; width: 1px; background: var(--ink-2); opacity: 0.5; pointer-events: none; display: none; }
  .fl { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

  /* The census matrix: readings as rows, plots as columns, every cell ruled. */
  .matrix { display: grid; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
  .matrix > * { padding: 10px 16px 10px; border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); min-width: 0; }
  .matrix > .mx-corner, .matrix > .mx-plot { border-top: none; background: var(--sheet-2); }
  .matrix > .mx-corner, .matrix > .mx-label { border-left: none; }
  .mx-since { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .mx-plot { appearance: none; border-right: none; font: inherit; color: var(--ink); text-align: left; cursor: pointer; display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 600; border-bottom: 2px solid var(--c); transition: opacity 160ms ease-out, background 160ms ease-out; }
  .mx-plot:hover { background: var(--sheet-3); }
  .mx-plot i { width: 14px; height: 14px; border-radius: 3px; background: var(--c); }
  .mx-plot b { font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--ink-2); }
  .mx-plot.dim, .mx-cell.dim { opacity: 0.4; }
  .mx-lh { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .mx-label h3 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .mx-verdict { margin: 4px 0 0; color: var(--ink); font-size: 13px; }
  .mx-label .small { margin: 6px 0 0; }
  .matrix > .mx-band { grid-column: 1 / -1; border-left: none; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; padding: 20px 16px 10px; }
  .mx-band h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.015em; }
  .mx-band p { margin: 0; color: var(--ink-2); }
  .mx-band p.small { color: var(--muted); }
  .mx-val .chip { margin-left: 10px; font-size: 12px; font-weight: 600; letter-spacing: 0; vertical-align: 3px; }
  .wv { display: inline-flex; gap: 12px; }
  .mx-cell { transition: opacity 160ms ease-out; }
  .mx-cellplot { display: none; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
  .mx-cellplot i { width: 9px; height: 9px; border-radius: 2px; background: var(--c); }
  .mx-val { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; font-feature-settings: "tnum" 0; }
  .mx-val small { font-size: 12px; font-weight: 400; color: var(--muted); letter-spacing: 0; margin-left: 5px; }
  .dline { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 2px 0; border-top: 1px solid var(--rule); font-size: 12px; margin-top: 3px; }
  .dline .dk { color: var(--muted); }
  .dpair { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .dline .dv { color: var(--ink-2); font-weight: 500; white-space: nowrap; }
  .dv.good { color: var(--good); }
  .dv.bad, .dv.severe { color: var(--bad); }
  .dv.severe { font-weight: 600; }
  .dv.flag { color: var(--ink); font-weight: 600; }
  .dv.small, .dv.flat, .dv.na, .dv.neutral { color: var(--muted); font-weight: 400; }
  .lane { position: relative; height: 40px; margin-top: 8px; }
  .mflag {
    position: absolute; top: 0; appearance: none; white-space: nowrap; font-family: var(--mono); font-size: 10.5px; line-height: 18px; height: 18px;
    padding: 0 10px 0 5px; color: var(--ink-2); background: var(--sheet-3); border: none; border-left: 1.5px solid var(--ink-2); cursor: pointer;
    clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 50%, 100% 100%, 0 100%); transition: color 140ms ease-out, background 140ms ease-out;
  }
  .mflag:hover { color: var(--ink); background: var(--rule-2); }
  .lane .staff { position: absolute; top: 18px; width: 1px; background: var(--ink-2); opacity: 0.35; pointer-events: none; }
  .lane .staff.sel { background: var(--accent); opacity: 0.5; }
  .lane { z-index: 1; }
  .mflag.flip { padding: 0 5px 0 10px; border-left: none; border-right: 1.5px solid var(--ink-2); clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 6px 50%); }
  .mflag.sel { color: var(--accent); background: rgba(232, 180, 76, 0.16); border-color: var(--accent); cursor: default; }
  .costbox { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 40px; margin-top: 14px; }
  .costbox .costlines { margin-top: 6px; }

  /* Change chips: arrow for direction, colour for better or worse, grey for small. */
  .chip { display: inline-flex; align-items: baseline; gap: 4px; white-space: nowrap; font-size: 12px; line-height: 1.5; padding: 0 7px; border-radius: 4px; color: var(--ink-2); background: var(--sheet-3); cursor: default; }
  .chip .w { color: var(--muted); }
  .chip.good { color: var(--good); background: rgba(76, 196, 106, 0.1); }
  .chip.bad { color: var(--bad); background: rgba(239, 107, 107, 0.1); }
  .chip.flag { color: var(--ink); background: var(--sheet-3); font-weight: 600; }
  .chip.severe { color: var(--bad); background: rgba(239, 107, 107, 0.14); font-weight: 600; }
  .chip.small, .chip.flat, .chip.na, .chip.neutral { color: var(--muted); background: transparent; }

  /* Closure register: a ruled ledger. */
  .ledger { margin-top: 16px; border: 1px solid var(--rule); border-radius: 8px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  th { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: var(--sheet-2); position: sticky; top: 0; }
  td.num, th.num { text-align: right; }
  .ledger tbody tr { cursor: pointer; transition: background 120ms ease-out; }
  .ledger tbody tr:hover td, .ledger tbody tr.hot td { background: var(--sheet-3); }
  .ledger tr.sel td { background: rgba(232, 180, 76, 0.1); border-bottom-color: rgba(232, 180, 76, 0.45); }
  .ledger tr.sel td.no { color: var(--accent); }
  .ledger td.name { white-space: normal; min-width: 180px; }
  .ledger td.cost { white-space: normal; min-width: 130px; max-width: 190px; }
  .ledger td.cost .mc { text-align: left; min-width: 0; }
  .ledger td.name b { font-weight: 500; }
  .ledger td.name code { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: 6px; }
  .ledger td.no { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .ledger tr.fold td { color: var(--muted); font-size: 12px; cursor: pointer; white-space: normal; }
  .ledger tr.fold:hover td { color: var(--ink-2); }
  .trio { display: inline-flex; gap: 8px; }
  .mc { font-size: 12px; min-width: 44px; display: inline-block; text-align: right; color: var(--muted); }
  .mc.good { color: var(--good); }
  .mc.bad { color: var(--bad); }
  .mc.flag { color: var(--ink); font-weight: 600; }
  .mc.severe { color: var(--bad); font-weight: 600; }
  th .sw { display: flex; gap: 8px; margin-top: 5px; }
  th .sw i { display: inline-block; width: 44px; height: 4px; border-radius: 2px; }

  /* Supplementary census */
  details.topic { border-top: 1px solid var(--rule); }
  details.topic:last-of-type { border-bottom: 1px solid var(--rule); }
  details.topic > summary { list-style: none; cursor: pointer; padding: 14px 4px; display: flex; gap: 14px; align-items: baseline; }
  details.topic > summary::-webkit-details-marker { display: none; }
  details.topic > summary::before { content: ""; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg); transition: transform 160ms ease-out; align-self: center; }
  details.topic[open] > summary::before { transform: rotate(45deg); }
  details.topic > summary b { font-size: 16px; font-weight: 600; }
  details.topic > summary span { color: var(--muted); font-size: 13px; }
  .cards { display: grid; gap: 28px; padding: 6px 0 30px 21px; }
  .card { min-width: 0; }
  .card .chead { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
  .card .tools { display: flex; gap: 8px; align-items: center; }
  .card .def { margin: 3px 0 0; color: var(--ink-2); font-size: 13px; max-width: 90ch; }
  .tbtn { appearance: none; font: inherit; font-size: 12px; color: var(--ink-2); background: transparent; border: 1px solid var(--rule-2); border-radius: 4px; padding: 0 8px; cursor: pointer; }
  .tbtn:hover, .tbtn[aria-pressed="true"] { color: var(--ink); background: var(--sheet-3); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 8px; color: var(--ink-2); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid currentColor; }
  .legend i.box { width: 10px; height: 10px; border: none; border-radius: 2px; opacity: 0.35; }
  .legend i.dot { width: 9px; height: 9px; border: none; border-radius: 50%; }
  .legend i.dash { border-top-style: dashed; }
  .legend i.dots { border-top-style: dotted; }
  .tbl { overflow-x: auto; margin-top: 10px; border: 1px solid var(--rule); border-radius: 8px; }
  .scale { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; margin-top: 6px; }
  .scale i { display: inline-block; width: 120px; height: 8px; border-radius: 2px; background: linear-gradient(90deg, #1c2a3a, #9ec5f4); }
  .pn { font-size: 12px; font-weight: 600; color: var(--ink-2); margin-top: 12px; }
  .small { color: var(--muted); font-size: 12px; }

  details.about { margin-top: 8px; }
  details.about > summary { display: inline-block; cursor: pointer; font-size: 12px; color: var(--muted); list-style: none; }
  details.about > summary::-webkit-details-marker { display: none; }
  details.about > summary:hover { color: var(--ink-2); }
  details.about > summary::before { content: "+ "; }
  details.about[open] > summary::before { content: "− "; }
  details.about dl { display: grid; grid-template-columns: 90px 1fr; gap: 4px 14px; margin: 8px 0 2px; font-size: 13px; max-width: 90ch; }
  details.about dt { color: var(--muted); }
  details.about dd { margin: 0; color: var(--ink-2); }
  details.about dd.path { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }

  dl.key { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 40px; margin: 16px 0 0; }
  dl.key div { border-top: 1px solid var(--rule); padding-top: 8px; }
  dl.key dt { font-weight: 600; }
  dl.key dd { margin: 2px 0 0; color: var(--ink-2); }

  .tip {
    position: fixed; z-index: 50; pointer-events: none; display: none;
    background: var(--sheet-2); color: var(--ink); border: 1px solid var(--rule-2);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45); border-radius: 6px; padding: 8px 10px; font-size: 12px; max-width: 360px;
  }
  .tip .t { font-weight: 600; margin-bottom: 2px; }
  .tip .m { color: var(--muted); margin-bottom: 4px; }
  .tip .r { display: flex; gap: 7px; align-items: center; }
  .tip .r i { width: 10px; height: 3px; border-radius: 2px; flex: none; }
  .tip .r b { white-space: nowrap; }
  .tip .r span { color: var(--ink-2); }

  .bar-status { margin-top: 10px; color: var(--muted); font-size: 12px; }
  .bar-status:empty { display: none; }
  .notice .box { margin-top: 18px; border: 1px solid var(--rule-2); border-radius: 8px; padding: 14px 16px; }
  pre, code { font-family: var(--mono); font-size: 12px; }
  pre { background: var(--sheet-2); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; overflow-x: auto; }
  footer { margin-top: 48px; color: var(--muted); font-size: 12px; }
  footer p { margin: 4px 0; max-width: 110ch; }


  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 1100px) {
    .fields { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .fields .field.plots { grid-column: 1 / -1; border-left: none; border-top: 1px solid var(--rule); }
    .matrix { grid-template-columns: 1fr !important; }
    .matrix > * { border-left: none; }
    .matrix > .mx-corner { display: none; }
    .matrix > .mx-plot { display: none; }
    .mx-cellplot { display: flex; }
    .costbox { grid-template-columns: 1fr; }
  }
  @media (max-width: 820px) {
    .sheet { padding: 0 18px 40px; }
    dl.key { grid-template-columns: 1fr; }
    .picker select { min-width: 0; width: 100%; }
    .ledger th:nth-child(1), .ledger td.no, .ledger th:nth-child(2), .ledger tr[data-i] td:nth-child(2) { display: none; }
    .trio { flex-direction: column; gap: 0; }
    .trio .mc::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: middle; }
    .mc { min-width: 0; text-align: left; }
    th .sw { display: none; }
    .ledger td.name { min-width: 120px; }
    .ledger td.cost { min-width: 84px; }
    .ledger th { white-space: normal; letter-spacing: 0.04em; }
    .ledger th, .ledger td { padding: 6px 6px; }
  }
</style>
</head>
<body>
<div class="sheet">
<header class="form">
  <div class="title-row">
    <div>
      <h1>Petri long-term record</h1>
      <p>Cognition and evolvability, counted in three plots after every closure.</p>
    </div>
    <div class="pickers">
      <div class="picker"><label for="horizon">Run length</label><select id="horizon" class="short"><option value="goal_worlds">2,000 ticks</option><option value="goal_worlds_long">40,000 ticks</option></select></div>
      <div class="picker"><label for="pick">Reading closure</label><select id="pick"></select></div>
    </div>
  </div>
  <div class="fields" id="fields"></div>
  <div class="bar-status" id="status">Loading the stored reports…</div>
</header>
<div class="notice" id="notice" hidden></div>
<main id="app"></main>
<footer id="foot"></footer>
</div>
<script src="vendor/d3-7.9.0.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i"></script>
<script src="vendor/plot-0.6.17.umd.min.js" integrity="sha384-JUpn2GgRr0gxU0xOBd8D8P634jhRCwobtG8G2MMEkX1RnGJ7/FJNnuukpfT+H2w1"></script>
<script>
(function () {
  'use strict';

  // ── Helpers ──────────────────────────────────────────────────────────────
  const SERIES = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)', 'var(--s7)', 'var(--s8)'];
  const SEQ = ['var(--seq-100)', 'var(--seq-200)', 'var(--seq-300)', 'var(--seq-400)', 'var(--seq-500)', 'var(--seq-600)', 'var(--seq-700)'];
  const num = (v) => {
    if (v === null || v === undefined) return NaN;
    if (typeof v === 'number') return v;
    if (typeof v === 'string') { const n = parseFloat(v); return Number.isFinite(n) ? n : NaN; }
    return NaN;
  };
  const isObj = (v) => v && typeof v === 'object' && !Array.isArray(v);
  const get = (o, path) => path.split('.').reduce((a, k) => (a && a[k] !== undefined ? a[k] : undefined), o);
  const sum = (xs) => xs.filter(Number.isFinite).reduce((a, b) => a + b, 0);
  const ratio = (a, b) => (Number.isFinite(a) && Number.isFinite(b) && b > 0 ? a / b : NaN);
  const median = (xs) => {
    const a = xs.filter(Number.isFinite).sort((x, y) => x - y);
    if (!a.length) return NaN;
    const m = a.length >> 1;
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  };
  const fin = Number.isFinite;
  const fmt = (v, digits) => {
    if (!fin(v)) return '—';
    if (digits !== undefined) return v.toLocaleString(undefined, { maximumFractionDigits: digits, minimumFractionDigits: 0 });
    const a = Math.abs(v);
    if (a >= 1000) return v.toLocaleString(undefined, { maximumFractionDigits: 0 });
    if (a >= 10) return v.toLocaleString(undefined, { maximumFractionDigits: 1 });
    if (a >= 0.01 || a === 0) return v.toLocaleString(undefined, { maximumFractionDigits: 3 });
    return v.toExponential(1);
  };
  const fmtInt = (v) => (fin(v) ? Math.round(v).toLocaleString() : '—');
  // A share as a percent, with enough digits that a small nonzero share never reads as 0%.
  const pct = (v) => {
    if (!fin(v)) return '—';
    const a = Math.abs(v * 100);
    const d = a === 0 ? 0 : a < 0.1 ? 3 : a < 1 ? 2 : a < 100 ? 1 : 0;
    return (v * 100).toLocaleString(undefined, { maximumFractionDigits: d }) + '%';
  };
  const pts = (d) => {
    const a = Math.abs(d * 100);
    const dg = a < 0.1 ? 3 : a < 1 ? 2 : 1;
    return (d * 100).toLocaleString(undefined, { maximumFractionDigits: dg }) + ' pts';
  };
  const MINUS = '−';
  const signedWith = (d, f) => (d > 0 ? '+' : d < 0 ? MINUS : '±') + f(Math.abs(d));
  const pctChange = (d) => signedWith(d, (a) => a.toLocaleString(undefined, { maximumFractionDigits: a >= 100 ? 0 : 1 }) + '%');
  const fmtTick = (v) => {
    if (!fin(v)) return '';
    const a = Math.abs(v);
    if (a >= 1e6) return (v / 1e6).toLocaleString(undefined, { maximumFractionDigits: 1 }) + 'M';
    if (a >= 1e4) return (v / 1e3).toLocaleString(undefined, { maximumFractionDigits: 0 }) + 'k';
    if (a >= 1000) return (v / 1e3).toLocaleString(undefined, { maximumFractionDigits: 1 }) + 'k';
    if (a >= 1) return v.toLocaleString(undefined, { maximumFractionDigits: 2 });
    if (a === 0) return '0';
    return v.toLocaleString(undefined, { maximumFractionDigits: 4 });
  };
  const pctTick = (v) => (fin(v) ? (v * 100).toLocaleString(undefined, { maximumFractionDigits: 2 }) + '%' : '');
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; return e; };
  const svgEl = (tag, attrs) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const featureId = (slug) => {
    const m = /^t(\d\d)-f(\d\d)/.exec(slug || '');
    return m ? `T${m[1]}.F${m[2]}` : '';
  };
  // A closure's name comes from its feature slug: "t16-f02-effort-priced-actions" reads "Effort priced actions".
  const ACRONYMS = { vm: 'VM', cpu: 'CPU', gpu: 'GPU', ids: 'IDs' };
  const featureName = (slug) => {
    const rest = (slug || '').replace(/^t\d\d-f\d\d-?/, '').replace(/-goal$/, '');
    if (!rest) return featureId(slug) || slug || 'unnamed';
    const s = rest.split('-').map((w) => ACRONYMS[w] || w).join(' ');
    return s.charAt(0).toUpperCase() + s.slice(1);
  };
  const niceTicks = (lo, hi, count) => {
    if (!(hi > lo)) hi = lo + 1;
    const step0 = (hi - lo) / Math.max(1, count);
    const mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const norm = step0 / mag;
    const step = (norm >= 5 ? 10 : norm >= 2 ? 5 : norm >= 1 ? 2 : 1) * mag;
    const out = [];
    for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) out.push(+v.toFixed(12));
    return out;
  };
  const domainOf = (arrays, zero, count) => {
    let lo = Infinity, hi = -Infinity;
    arrays.forEach((a) => a.forEach((v) => { if (fin(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }));
    if (!fin(lo)) { lo = 0; hi = 1; }
    if (zero !== false) lo = Math.min(0, lo);
    if (hi === lo) hi = lo + (Math.abs(lo) || 1);
    const ticks = niceTicks(lo, hi, count || 4);
    return { lo: Math.min(lo, ticks[0]), hi: Math.max(hi, ticks[ticks.length - 1]), ticks };
  };

  // ── Data loading ─────────────────────────────────────────────────────────
  const rel = (p) => p.replace(/^docs\/progress\//, '');
  // A dropped connection is retried twice: simple local servers reset some of
  // the hundred-odd parallel requests. An HTTP error is not retried.
  async function fetchJson(path) {
    for (let attempt = 0; ; attempt++) {
      let r;
      try { r = await fetch(path, { cache: 'no-store' }); }
      catch (e) { if (attempt < 2) continue; throw e; }
      if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
      return r.json();
    }
  }

  const artifactNotice = (report) => report.kind === 'petri-benchmark-summary'
    ? `Committed summary. Detailed observations are omitted; see \`omitted_details\` in the summary. Raw bytes were verified locally at ${report.raw.verified_at}; this is not a download or a current availability guarantee.`
    : '';

  function validateArtifact(report) {
    if (report.kind !== undefined && (report.kind !== 'petri-benchmark-summary' || report.summary_version !== 2)) {
      throw new Error(`Unsupported benchmark summary version ${report.summary_version} (${report.kind})`);
    }
    if (!isObj(report.deterministic) || !isObj(report.environment)) throw new Error('Malformed benchmark artifact');
    return report;
  }

  async function loadAll() {
    const index = await fetchJson('benchmark-series.json');
    const order = [];
    const seen = new Set();
    const add = (p, profile) => { if (!seen.has(p)) { seen.add(p); order.push({ path: p, profile }); } };
    (get(index, 'gate.closed') || []).forEach((p) => add(p, 'gate'));
    (get(index, 'goal.closed') || []).forEach((p) => add(p, 'goal'));
    const worldEpoch = get(index, 'goal_worlds.epoch_baseline');
    if (worldEpoch) add(worldEpoch, 'goal_worlds');
    (get(index, 'goal_worlds.closed') || []).forEach((p) => add(p, 'goal_worlds'));
    // The long goal profile (40,000 ticks) is its own series, never mixed with the 2,000-tick one.
    const longEpoch = get(index, 'goal_worlds_long.epoch_baseline');
    if (longEpoch) add(longEpoch, 'goal_worlds_long');
    (get(index, 'goal_worlds_long.closed') || []).forEach((p) => add(p, 'goal_worlds_long'));
    // A listed report may not be stored yet — a series whose epoch baseline is
    // the measurement a feature is still taking. Skip it and say so rather than
    // failing the whole page.
    const missing = [];
    const loaded = await Promise.all(order.map(async (o) => {
      let report;
      try { report = await fetchJson(rel(o.path)); }
      catch (e) { missing.push(o.path); return null; }
      return { ...o, report: validateArtifact(report) };
    }));
    const reports = loaded.filter(Boolean);

    // Group by feature slug, preserving gate closure order, then any goal-only features.
    const bySlug = new Map();
    for (const r of reports) {
      const slug = r.report.feature || rel(r.path).replace(/^features\//, '').replace(/(-goal-long|-goal)?\.json$/, '');
      const prof = r.profile;
      if (!bySlug.has(slug)) bySlug.set(slug, { slug, id: featureId(slug), gate: null, goal: null, paths: {} });
      const f = bySlug.get(slug);
      f[prof] = r.report;
      f.paths[prof] = r.path;
    }
    return { index, features: [...bySlug.values()], reportCount: reports.length, missing };
  }

  // ── Extractors ───────────────────────────────────────────────────────────
  const seedRow = (rep, path, seed) => {
    const arr = get(rep, path);
    if (!Array.isArray(arr)) return undefined;
    return arr.find((r) => r && r.seed === seed);
  };
  const gi = (rep, key, seed) => seedRow(rep, `deterministic.goal_indicators.${key}.per_seed`, seed);
  const worldCase = (rep, world) => (get(rep, 'deterministic.goal_indicators.cases') || []).find((c) => get(c, 'case.name') === world);
  const pop = (rep, seed) => gi(rep, 'population_persistence', seed) || {};
  const samplesOf = (rep, seed) => { const s = pop(rep, seed).samples; return Array.isArray(s) ? s : []; };
  const lastSample = (rep, seed) => { const s = samplesOf(rep, seed); return s.length ? s[s.length - 1] : {}; };
  const driftAt = (obs, depth) => {
    const row = (get(obs, 'drift_depth.readings') || []).find((r) => num(r.depth) === depth);
    return row ? num(row.changed_per_all_births) : NaN;
  };
  const meshSums = (rep) => {
    const per = get(rep, 'deterministic.goal_indicators.mutational_neighborhood.evolved.per_seed');
    if (!Array.isArray(per)) return null;
    const out = { genomes: 0, total: 0, reachable: 0, executed: 0, knockout: 0, routeVaries: 0, capHits: 0, execs: 0 };
    let any = false;
    per.forEach((s) => {
      if (isObj(s.mesh_summary)) {
        any = true;
        Object.keys(out).forEach((key) => { out[key] += num(s.mesh_summary[key]) || 0; });
        return;
      }
      (s.sampled_genomes || []).forEach((g) => {
      const me = g.mesh_execution; if (!isObj(me)) return;
      any = true; out.genomes += 1;
      out.total += num(me.total_node_count) || 0; out.reachable += num(me.reachable_node_count) || 0;
      out.executed += num(me.executed_node_count) || 0; out.knockout += num(me.knockout_count) || 0;
      out.routeVaries += me.route_varies_with_input ? 1 : 0; out.capHits += num(me.pass_cap_hits ?? me.hop_cap_hits) || 0;
      out.execs += num(me.executions_per_genome) || 0;
      });
    });
    return any ? out : null;
  };
  // The stored comparison a report carries against the nearest earlier closure
  // of its series that it names. Cost levels (ok, flag, severe) come only from here.
  const referenceFor = (rep, closed, path) => {
    const refs = get(rep, 'comparison.references') || [];
    let i = closed.indexOf(path);
    if (i < 0) i = closed.length;
    for (let k = i - 1; k >= 0; k--) {
      const r = refs.find((x) => x.path === closed[k]);
      if (r) return r;
    }
    return null;
  };

  const NOT_MEASURED = 'not measured';
  // The T11.F26 tables keep their two-decimal percents.
  const pct2 = (v) => (fin(v) ? (v * 100).toLocaleString(undefined, { maximumFractionDigits: 2 }) + '%' : '—');
  // Display rows for one world's `mutation_effects` block (T11.F26), pure over
  // the block so fixtures can check every count and ratio shown. A report
  // without the block reads "not measured"; an Undefined block or cohort
  // reads "undefined: <reason>"; a zero denominator reads "undefined".
  const COHORT_NAMES = ['founder', 'drift', 'selected'];
  function mutationEffectsView(block) {
    if (block === undefined || block === null) return { status: NOT_MEASURED };
    if (typeof block === 'string') return { status: `undefined: ${block}` };
    const share = (n, d) => (Number.isFinite(n) && d > 0 ? `${fmt(n, 0)} of ${fmt(d, 0)} (${pct2(n / d)})` : 'undefined');
    const perBirth = (n, d) => (d > 0 ? fmt(n / d, 3) : 'undefined');
    const fields = block.count_fields || [];
    const counts = (row) => Object.fromEntries(fields.map((f, i) => [f, num((row || [])[i])]));
    const sideSum = (side) => sum(['silent', 'changed', 'dead', 'zero_applied'].map((k) => num(get(side, k))));
    const exposure = (block.exposure || []).map((r) => {
      const births = num(r.births_total);
      return {
        panel: r.panel, supply: r.supply,
        requestedPerBirth: perBirth(num(r.requested_events_total), births),
        appliedPerBirth: perBirth(num(r.applied_events_total), births),
        zeroApplied: share(num(r.zero_requested) + num(r.requested_all_skipped), births),
        identical: share(num(r.genome_identical), num(r.event_bearing)),
        allNoop: share(num(r.parents_all_noop), num(r.parents)),
        oneQueue: share(num(r.parents_one_queue), num(r.parents)),
        fromActing: share(sideSum(r.from_acting), births),
      };
    });
    const mean = (rows, key) => (rows.length ? fmt(sum(rows.map((p) => num(p[key]))) / rows.length, 1) : 'undefined');
    const cohorts = (block.cohorts || []).map((c, i) => {
      const name = COHORT_NAMES[i] || `cohort ${i}`;
      if (typeof c === 'string') return { name, status: `undefined: ${c}` };
      const t = counts(c.totals);
      const applied = t.proposals - t.skipped;
      const silent = applied - t.action_changed - t.action_dead;
      const cov = c.coverage || {};
      const pairs = num(cov.pairs_sampled);
      const parents = c.parents || [];
      const detail = (rows) => (rows || []).map((r) => {
        const k = counts(r.counts);
        return [r.key, fmt(k.proposals, 0), fmt(k.skipped, 0), fmt(k.proposals - k.skipped, 0)]
          .concat(fields.slice(2).map((f) => fmt(k[f], 0)));
      });
      return {
        name, identity: c.identity,
        parents: `${fmt(num(c.parents_evaluated), 0)} of ${fmt(num(c.parents_requested), 0)} requested`,
        meanDepthOrGeneration: mean(parents, 'depth_or_generation'),
        meanGenomeSize: mean(parents, 'genome_size'),
        proposals: fmt(t.proposals, 0), skipped: fmt(t.skipped, 0), applied: fmt(applied, 0),
        categories: fields.slice(2, 9).map((f) => [f, share(t[f], applied)]),
        actionEffects: share(t.action_changed + t.action_dead, applied),
        silentWithStateOrCost: share(t.silent_with_state_or_cost, silent),
        unresolved: share(t.unresolved, applied),
        consistencyViolations: fmt(t.consistency_violations, 0),
        coverage: {
          pairs: `${fmt(pairs, 0)} of ${fmt(num(cov.pairs_requested), 0)} requested`,
          recorded: cov.differ_recorded === null || cov.differ_recorded === undefined ? 'undefined' : share(num(cov.differ_recorded), pairs),
          authored: share(num(cov.differ_authored), pairs),
          early: share(num(cov.differ_sequence_ticks_1_4), pairs),
          late: share(num(cov.differ_sequence_ticks_5_32), pairs),
          any: share(num(cov.differ_any), pairs),
          stateOnly: share(num(cov.state_or_cost_only), pairs),
          noopActing: share(num(cov.all_noop_parents_acting), num(cov.all_noop_parents)),
        },
        operators: detail(c.operators),
        targets: detail(c.targets),
      };
    });
    const cov = block.coverage || {};
    const recorded = cov.recorded;
    return {
      status: 'measured', version: block.version, batteryVersion: block.battery_version, coverageVersion: cov.version, fields,
      exposure, cohorts,
      recorded: typeof recorded === 'string' || recorded === undefined
        ? `undefined: ${recorded || NOT_MEASURED}`
        : `${fmt(num(recorded.actual), 0)} of ${fmt(num(recorded.requested), 0)} requested`,
      sequenceSource: cov.sequence_source,
      controls: (cov.controls || []).map((x) => [x.name, x.passed ? 'passed' : 'failed', (x.differing_groups || []).join(', ') || 'none']),
    };
  }

  // ── What each reading means ──────────────────────────────────────────────
  // The T14.F12 per-world first reading of changed births at depth: the floor.
  const F12_FLOORS = { Orchards: 0.1464, Canyon: 0.13, Confluence: 0.1434 };
  const WORLD_INFO = {
    Orchards: 'Thin grass almost everywhere, rich meadows, and fruit orchards that founders cannot yet eat. Seed 11.',
    Canyon: 'Rock masses cut by winding channels; about half the map blocks movement. Seed 22.',
    Confluence: 'Every pressure at once: rock, ridges, both foods and scarce regions on a bounded map. Seed 33.',
  };
  // kind: how values and changes print. better: 'up', 'down' or null (context only).
  const READINGS = {
    clades: {
      label: 'Founder families alive', watch: 'founder families alive', kind: 'count', unit: 'families', better: 'up',
      read: (pt, w) => get(gi(pt.rep, 'lineage_diversity', w.seed), 'surviving_founder_clade_count'),
      def: 'Founders (of 10,000) with living descendants at the end of the run.',
      why: 'Diversity. More families alive means more ways of living side by side.',
      how: 'Each creature at tick zero starts a family. At tick 2,000, count families with a living member.',
      caveat: 'Counts families, not strategies. One run per world.',
      path: 'deterministic.goal_indicators.lineage_diversity.per_seed[].surviving_founder_clade_count',
    },
    even: {
      label: 'Even spread of families', kind: 'number', unit: 'families', better: 'up',
      read: (pt, w) => { const e = num(get(gi(pt.rep, 'lineage_diversity', w.seed), 'shannon_entropy_nats')); return fin(e) ? Math.exp(e) : NaN; },
      extra: (pt, w) => { const e = num(get(gi(pt.rep, 'lineage_diversity', w.seed), 'shannon_entropy_nats')); return fin(e) ? `lineage entropy ${fmt(e, 3)} nats` : ''; },
      def: 'The number of equal-sized families that would give this spread. 1 means one family holds everyone.',
      why: 'Diversity. Catches one giant family hiding among many tiny ones.',
      how: 'e to the power of the lineage entropy. Ecologists call it the effective number of types.',
      caveat: 'The stored indicator is the entropy. Hover a value to see it.',
      path: 'deterministic.goal_indicators.lineage_diversity.per_seed[].shannon_entropy_nats',
    },
    memory: {
      label: 'Memory use', short: 'Memory use', kind: 'share', unit: 'of living creatures', better: 'up',
      low: 0.01, lowText: 'Not yet. Under 1% of creatures in every plot.',
      read: (pt, w) => get(gi(pt.rep, 'memory_sensitivity', w.seed), 'different_from_either_fraction'),
      extra: (pt, w) => { const r = gi(pt.rep, 'memory_sensitivity', w.seed); return r ? `${fmtInt(num(r.different_from_either_count))} of ${fmtInt(num(r.final_creature_count))} creatures` : ''; },
      def: 'Creatures at the end whose next action changes when their memory is wiped or scrambled.',
      why: 'Cognition. Behaviour that depends on remembering, not just on sensing.',
      how: 'Each final creature decides three times: memory intact, zeroed, scrambled. Count those whose action differs.',
      caveat: 'Shows dependence, not benefit. Learning and prediction are not measured yet.',
      path: 'deterministic.goal_indicators.memory_sensitivity.per_seed[].different_from_either_fraction',
    },
    population: {
      label: 'Creatures alive at the end', watch: 'creatures alive at the end', kind: 'count', unit: 'creatures', better: 'up',
      read: (pt, w) => pop(pt.rep, w.seed).final_population,
      extra: (pt, w) => `lowest ${fmtInt(num(pop(pt.rep, w.seed).minimum_population))} during the run`,
      def: 'Living creatures at tick 2,000.',
      why: '0 means the world went extinct.',
      how: 'The lowest point is the fewest alive at any of 20 checkpoints.',
      caveat: 'Every world booms to 100,000, then crashes. The end is a plateau.',
      path: 'deterministic.goal_indicators.population_persistence.per_seed[].final_population',
    },
    floor: {
      label: 'Mutations that change behaviour', short: 'Changes behaviour', movedAs: 'mutation outcomes', kind: 'share', unit: 'of 5,000 offspring', better: 'up',
      read: (pt, w) => get(worldCase(pt.rep, w.name), 'neighborhood_read.changed_per_all_births'),
      extra: (pt, w) => { const nr = get(worldCase(pt.rep, w.name), 'neighborhood_read'); return nr ? `${fmtInt(num(get(nr, 'births.any_events.changed')))} of ${fmtInt(num(get(nr, 'births.births_total')))} offspring` : ''; },
      def: 'Offspring that act differently from their parent. The first reading, at T14.F12, is the floor.',
      why: 'No variation, no evolution. It must stay at or above the floor.',
      how: '5,000 offspring of 50 living genomes. Each is mutated, then tested beside its parent: same (silent), different (changed) or never acts (dead).',
      caveat: 'About 60% of offspring get no mutation. They count as unchanged.',
      path: 'deterministic.goal_indicators.cases[].neighborhood_read.changed_per_all_births',
    },
    drift: {
      label: 'New behaviour after long drift', short: 'After long drift', kind: 'share', unit: 'of offspring', better: 'up',
      read: (pt, w) => driftAt(worldCase(pt.rep, w.name), 2000),
      def: 'The founder, mutated for 2,000 generations with no selection. The share of offspring that then act differently.',
      why: 'Evolvability at depth. If variation fades over the generations, evolution stalls.',
      how: '2,000 generations of mutation only from the founder. At that depth, 2,000 offspring are tested beside their parent.',
      caveat: 'Mutation only: no ecology and no survival.',
      path: 'deterministic.goal_indicators.cases[].drift_depth.readings[depth 2000].changed_per_all_births',
    },
    births: { label: 'Births', kind: 'count', better: null, read: (pt, w) => get(seedRow(pt.rep, 'deterministic.per_seed', w.seed), 'births') },
    hops: { label: 'Mesh hops', kind: 'count', better: null, read: (pt, w) => get(seedRow(pt.rep, 'deterministic.per_seed', w.seed), 'mesh_hops') },
  };
  // Readings that, all identical to the previous closure in every world, mean
  // the closure did not change the simulation (runs are deterministic).
  const FINGERPRINT = ['population', 'births', 'hops', 'clades', 'even', 'memory'];
  // The two goals read first (owner, 2026-10-10), then context.
  const BANDS = [
    { title: 'Cognition', ask: 'Does behaviour depend on memory?', note: 'Learning and prediction are not measured yet.', keys: ['memory'] },
    { title: 'Evolvability', ask: 'Do mutations keep making new behaviour?', keys: ['floor', 'drift'] },
  ];
  const GOAL_KEYS = BANDS.flatMap((b) => b.keys);
  const WATCH_KEYS = ['clades', 'population'];
  const valueText = (spec, v) => (!fin(v) ? 'not measured' : spec.kind === 'share' ? pct(v) : spec.kind === 'count' ? fmtInt(v) : fmt(v, 1));
  const fmtNum = (a) => fmt(a, Math.abs(a) >= 10 ? 1 : 2);
  const deltaText = (spec, d) => (spec.kind === 'share' ? signedWith(d, (a) => pts(a)) : spec.kind === 'count' ? signedWith(d, (a) => fmtInt(a)) : signedWith(d, fmtNum));
  const sizeText = (spec, d) => (spec.kind === 'share' ? pts(d) : spec.kind === 'count' ? fmtInt(d) : fmtNum(d));

  // One change, judged: direction by arrow, better or worse by the reading's
  // direction, grey when smaller than the reading's typical move.
  function judge(spec, cur, prev, typical) {
    if (!fin(cur) || !fin(prev)) return { tone: 'na', text: fin(cur) ? 'no earlier reading' : 'not measured', say: fin(cur) ? 'No earlier reading to compare with.' : 'Not measured in this closure.' };
    const d = cur - prev;
    if (d === 0) return { tone: 'flat', d, text: 'no change', say: 'No change.' };
    const small = fin(typical) && Math.abs(d) < typical;
    const better = spec.better === 'up' ? d > 0 : spec.better === 'down' ? d < 0 : null;
    const tone = small ? 'small' : better === null ? 'neutral' : better ? 'good' : 'bad';
    const word = small ? 'small' : better === null ? '' : better ? 'better' : 'worse';
    return {
      tone, d, better,
      text: `${d > 0 ? '▲' : '▼'} ${sizeText(spec, Math.abs(d))}`,
      signed: deltaText(spec, d),
      say: `${d > 0 ? 'Up' : 'Down'} ${sizeText(spec, Math.abs(d))}${word ? ': ' + word : ''}.` + (fin(typical) ? ` Typical move: ${sizeText(spec, typical)}.` : ''),
    };
  }

  // ── Model ────────────────────────────────────────────────────────────────
  // One point per three-world closure of the chosen series (`goal_worlds` at
  // 2,000 ticks or `goal_worlds_long` at 40,000), plus a gap where a closure's
  // report is not stored. The selected closure drives every view.
  function buildModel(data, seriesKey = 'goal_worlds') {
    const byPath = new Map();
    data.features.forEach((f) => Object.entries(f.paths).forEach(([prof, p]) => byPath.set(p, { f, prof })));
    const closedWorlds = get(data.index, `${seriesKey}.closed`) || [];
    const closedGate = get(data.index, 'gate.closed') || [];
    const omissions = (get(data.index, 'report_omissions') || []).filter((o) => o.series === get(data.index, `${seriesKey}.series`));
    const points = [];
    closedWorlds.forEach((p) => {
      const e = byPath.get(p);
      if (!e || !e.f[seriesKey]) {
        const s = slugOfPath(p);
        points.push({ kind: 'gap', loadFailed: true, slug: s, id: featureId(s) || s, name: featureName(s), title: `${titleOfPath(p)} (report could not be loaded)`, reason: 'Listed in benchmark-series.json but could not be loaded.', date: '' });
      } else {
        const rep = e.f[seriesKey];
        const id = featureId(e.f.slug), name = featureName(e.f.slug);
        points.push({
          kind: 'world', f: e.f, rep, path: p, slug: e.f.slug, id, name,
          title: id && name !== id ? `${name} (${id})` : name,
          date: (get(rep, 'environment.generated_at') || '').slice(0, 10),
          host: get(rep, 'environment.host.cpu_model') || 'an unrecorded host',
        });
      }
      omissions.filter((o) => o.retained_previous_reference === p).forEach((o) => points.push({
        kind: 'gap', slug: o.feature, id: o.feature, name: o.feature, title: `${o.feature} (report not stored)`, reason: o.reason, readings: o.readings, date: '',
      }));
    });
    const worldPoints = points.filter((p) => p.kind === 'world');
    const latest = worldPoints[worldPoints.length - 1];
    const worlds = [];
    (latest ? get(latest.rep, 'deterministic.goal_indicators.cases') || [] : []).forEach((c) => {
      const name = get(c, 'case.name');
      if (name) worlds.push({ name, short: name.split(' ')[0], seed: num(get(c, 'case.seed')) });
    });
    const M = { data, points, worlds, closedWorlds, closedGate, latest, vals: {}, typical: {} };
    M.prevOf = (i) => { for (let k = i - 1; k >= 0; k--) if (points[k].kind === 'world') return k; return -1; };
    // The series' first reading is its first closed report; if that one did not
    // load, the first reading is unavailable rather than silently moved later.
    M.firstIndex = points.length && points[0].kind === 'world' ? 0 : -1;
    Object.entries(READINGS).forEach(([key, spec]) => {
      M.vals[key] = worlds.map((w) => points.map((pt) => (pt.kind === 'world' ? num(spec.read(pt, w)) : NaN)));
    });
    // A reading added after the series began has its own first census: its
    // first measured closure in that plot.
    M.firstOf = (key, wi) => (M.firstIndex < 0 ? -1 : M.vals[key][wi].findIndex(fin));
    points.forEach((pt, i) => {
      if (pt.kind !== 'world') return;
      const j = M.prevOf(i);
      pt.changed = j < 0 || FINGERPRINT.some((key) => M.vals[key].some((row) => {
        const a = row[i], b = row[j];
        return fin(a) || fin(b) ? a !== b : false;
      }));
    });
    // The typical move: the median size of the nonzero changes between
    // consecutive closures that changed the simulation, per reading and world.
    Object.keys(READINGS).forEach((key) => {
      M.typical[key] = worlds.map((w, wi) => {
        const moves = [];
        points.forEach((pt, i) => {
          if (pt.kind !== 'world' || !pt.changed) return;
          const j = M.prevOf(i);
          if (j < 0) return;
          const d = Math.abs(M.vals[key][wi][i] - M.vals[key][wi][j]);
          if (fin(d) && d > 0) moves.push(d);
        });
        return median(moves);
      });
    });
    M.judgeAt = (key, wi, i) => {
      const j = M.prevOf(i);
      return judge(READINGS[key], M.vals[key][wi][i], j >= 0 ? M.vals[key][wi][j] : NaN, M.typical[key][wi]);
    };
    M.sel = latest ? points.indexOf(latest) : -1;
    return M;
  }

  // ── Compute cost from the stored comparisons ─────────────────────────────
  const COUNTER_NAMES = {
    mesh_hops: 'mesh hops', vm_steps: 'VM steps', graph_relax_iters: 'graph relaxation steps', plasticity_updates: 'learning updates',
    actions_applied: 'actions applied', births: 'births', pass_cap_hits: 'brain passes hitting the cap', passes: 'brain passes', decided_passes: 'decided brain passes',
  };
  const slugOfPath = (p) => (p || '').split('/').pop().replace(/\.json$/, '').replace(/-goal$/, '');
  const titleOfPath = (p) => { const s = slugOfPath(p); const id = featureId(s), n = featureName(s); return id && n !== id ? `${n} (${id})` : n; };
  function costOf(M, pt) {
    const runs = [];
    const add = (label, what, rep, closed, path) => {
      if (!rep) { runs.push({ label, what, missing: 'no report stored' }); return; }
      const ref = referenceFor(rep, closed, path);
      if (!ref) { runs.push({ label, what, missing: 'no stored comparison' }); return; }
      const th = get(rep, 'measurement_evidence.thresholds') || {};
      runs.push({
        label, what, refTitle: titleOfPath(ref.path),
        work: { flag: num(th.work_flag_percent) || 10, severe: num(th.work_severe_percent) || 50 },
        wallLimits: { flag: num(th.wall_flag_percent) || 25, severe: num(th.wall_severe_percent) || 100 },
        counters: (ref.counters || []).map((c) => ({ key: c.name, name: COUNTER_NAMES[c.name] || c.name.replace(/_/g, ' '), d: num(c.percent_delta), level: c.level || 'ok' })),
        wall: ref.wall_clock ? { d: num(ref.wall_clock.percent_delta), level: ref.wall_clock.level || 'ok' } : null,
      });
    };
    add('Long run', 'three worlds, 2,000 ticks', pt.rep, M.closedWorlds, pt.path);
    add('Short run', 'quick run in make check', pt.f && pt.f.gate, M.closedGate, pt.f && pt.f.paths.gate);
    return runs;
  }
  const worstLevel = (runs) => {
    let worst = null;
    runs.forEach((r) => (r.counters || []).forEach((c) => {
      const rank = c.level === 'severe' ? 2 : c.level === 'flag' ? 1 : 0;
      if (rank && (!worst || rank > worst.rank || (rank === worst.rank && c.d > worst.c.d))) worst = { rank, c, run: r };
    }));
    return worst;
  };

  // ── The verdict for the selected closure ─────────────────────────────────
  const wallWorst = (runs) => {
    let worst = null;
    runs.forEach((r) => {
      if (!r.wall || r.wall.level === 'ok') return;
      const rank = r.wall.level === 'severe' ? 2 : 1;
      if (!worst || rank > worst.rank) worst = { rank, run: r };
    });
    return worst;
  };
  // Guardrail problems at closure i, highest rank first, and the cost runs read.
  function guardChecks(M, i) {
    const pt = M.points[i];
    const checks = [];
    M.worlds.forEach((w, wi) => {
      const p = M.vals.population[wi][i];
      const ext = get(seedRow(pt.rep, 'deterministic.per_seed', w.seed), 'extinction_tick');
      if (p === 0 || (ext !== undefined && ext !== null)) checks.push({ rank: 4, sim: true, text: `${w.short} went extinct.` });
      const fv = M.vals.floor[wi][i], fl = F12_FLOORS[w.short];
      if (fin(fv) && fin(fl) && fv < fl) checks.push({ rank: 2, sim: true, text: `${w.short}: mutations below the floor (${pct(fv)} vs ${pct(fl)}).` });
    });
    const runs = costOf(M, pt);
    runs.forEach((r) => (r.counters || []).forEach((c) => {
      if (c.level === 'severe') checks.push({ rank: 3, group: `${r.label}, severe`, item: `${c.name} ${pctChange(c.d)}`, text: `${r.label}: ${c.name} ${pctChange(c.d)} (severe; limit +${r.work.severe}%).` });
      else if (c.level === 'flag') checks.push({ rank: 1, group: `${r.label}, flag`, item: `${c.name} ${pctChange(c.d)}`, text: `${r.label}: ${c.name} ${pctChange(c.d)} (flag; limit +${r.work.flag}%).` });
    }));
    runs.forEach((r) => {
      if (!r.wall || r.wall.level === 'ok') return;
      checks.push({ rank: 0.5, group: `${r.label}, ${r.wall.level}`, item: `wall clock ${pctChange(r.wall.d)}`, text: `${r.label}: wall clock ${pctChange(r.wall.d)} (${r.wall.level}; limit +${r.wall.level === 'severe' ? r.wallLimits.severe : r.wallLimits.flag}%; depends on the machine).` });
    });
    checks.sort((x, y) => y.rank - x.rank);
    return { checks, runs };
  }
  const guardsComplete = (M, i, runs) => M.worlds.every((w, wi) => fin(M.vals.population[wi][i]) && fin(M.vals.floor[wi][i])) && runs.every((r) => r.counters);

  // Simulation checks stay one per line; cost checks merge into one line per run.
  // Lines keep the rank order of their first check.
  function groupChecks(checks) {
    const lines = [], groups = new Map();
    checks.forEach((c) => {
      if (!c.group) { lines.push({ text: c.text }); return; }
      if (!groups.has(c.group)) { const g = { group: c.group, items: [] }; groups.set(c.group, g); lines.push(g); }
      groups.get(c.group).items.push(c.item);
    });
    return lines.map((l) => (l.group ? `${l.group}: ${l.items.join(', ')}.` : l.text));
  }

  function verdictOf(M) {
    const i = M.sel, pt = M.points[i], j = M.prevOf(i);
    const out = { badge: 'ok', action: '', also: [] };
    const { checks, runs } = guardChecks(M, i);
    if (j < 0) {
      out.badge = checks.length ? 'check' : 'same';
      out.action = 'First closure in the series. Nothing to compare yet.';
      out.also = groupChecks(checks);
      return out;
    }
    if (!pt.changed) {
      out.badge = 'same';
      out.action = 'No change: this closure did not change the simulation.';
      out.also = groupChecks(checks.map((c) => (c.sim ? { ...c, text: `Still true: ${c.text}` } : c)));
      return out;
    }
    // Population raises a check only on extinction (above), never on an ordinary drop.
    GOAL_KEYS.concat(['clades']).forEach((key) => {
      const worse = M.worlds.filter((w, wi) => M.judgeAt(key, wi, i).tone === 'bad').map((w) => w.short);
      if (worse.length) checks.push({ rank: 1.5, text: `${READINGS[key].label} fell in ${listText(worse)}.` });
    });
    checks.sort((x, y) => y.rank - x.rank);
    if (checks.length) { out.badge = 'check'; out.action = checks[0].text; out.also = groupChecks(checks.slice(1)); }
    else out.action = guardsComplete(M, i, runs)
      ? 'Nothing needs attention.'
      : 'Nothing needs attention in what was measured. Some guardrails were not measured.';
    return out;
  }
  const listText = (xs) => (xs.length <= 1 ? xs.join('') : xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1]);
  const worldsText = (k) => `${k} ${k === 1 ? 'world' : 'worlds'}`;
  // Against each plot's first census of the reading: the success definition's test.
  function progressText(M, key) {
    const i = M.sel;
    if (M.firstIndex < 0) return 'First reading not loaded.';
    const res = M.worlds.map((w, wi) => { const f = M.firstOf(key, wi); return { w, f, cur: M.vals[key][wi][i], first: f >= 0 ? M.vals[key][wi][f] : NaN }; })
      .filter((r) => fin(r.cur) && fin(r.first));
    if (!res.length) return 'Not measured yet.';
    if (res.every((r) => r.f === i)) return 'This is the first reading.';
    const missing = M.worlds.length - res.length;
    const tail = missing ? ` ${worldsText(missing)} not measured.` : '';
    const scope = missing ? 'measured worlds' : 'worlds';
    if (res.every((r) => r.cur === 0 && r.first === 0)) return `Still 0 in every ${missing ? 'measured world' : 'world'}.` + tail;
    const above = res.filter((r) => r.cur > r.first).map((r) => r.w.short);
    const n = res.length;
    if (above.length === n) return `Above the first reading in all ${n} ${scope}.` + tail;
    if (!above.length) return `Not above the first reading in any ${missing ? 'measured world' : 'world'}.` + tail;
    return `Above the first reading in ${above.length} of ${n} ${scope} (${listText(above)}).` + tail;
  }

  // ── Tooltip and small DOM pieces ─────────────────────────────────────────
  let TIP = null;
  function showTip(ev, title, meta, rows) {
    if (!TIP) { TIP = el('div', 'tip'); document.body.appendChild(TIP); }
    TIP.replaceChildren(el('div', 't', title));
    if (meta) TIP.appendChild(el('div', 'm', meta));
    (rows || []).forEach((r) => {
      const d = el('div', 'r');
      const i = el('i'); i.style.background = r.color || 'transparent'; d.appendChild(i);
      d.appendChild(el('b', null, r.value));
      d.appendChild(el('span', null, r.name));
      TIP.appendChild(d);
    });
    TIP.style.display = 'block';
    const b = TIP.getBoundingClientRect();
    let x = ev.clientX + 14, y = ev.clientY + 14;
    if (x + b.width > window.innerWidth - 8) x = ev.clientX - b.width - 14;
    if (y + b.height > window.innerHeight - 8) y = ev.clientY - b.height - 14;
    TIP.style.left = Math.max(4, x) + 'px';
    TIP.style.top = Math.max(4, y) + 'px';
  }
  const hideTip = () => { if (TIP) TIP.style.display = 'none'; };
  const OBSERVERS = [];
  const observeWidth = (plot, draw) => {
    if (typeof ResizeObserver === 'undefined') { requestAnimationFrame(draw); return; }
    let last = -1;
    const ro = new ResizeObserver(() => {
      const w = Math.round(plot.clientWidth);
      if (w > 0 && w !== last) { last = w; draw(); }
    });
    ro.observe(plot);
    OBSERVERS.push(ro);
  };
  const directionTag = (b) => el('span', 'tag' + (b ? ' ' + b : ''), b === 'up' ? 'Higher is better' : b === 'down' ? 'Lower is better' : 'Context only');
  const OPEN_ABOUT = new Set();
  function about(spec) {
    const d = el('details', 'about');
    const key = spec.path || spec.why || '';
    if (key && OPEN_ABOUT.has(key)) d.open = true;
    d.addEventListener('toggle', () => { if (!key) return; if (d.open) OPEN_ABOUT.add(key); else OPEN_ABOUT.delete(key); });
    d.appendChild(el('summary', null, 'What is this?'));
    const dl = el('dl');
    [['Why', spec.why], ['How', spec.how], ['Caveat', spec.caveat], ['Stored as', spec.path]].forEach(([k, v]) => {
      if (!v) return;
      dl.appendChild(el('dt', null, k));
      dl.appendChild(el('dd', k === 'Stored as' ? 'path' : null, v));
    });
    d.appendChild(dl);
    return d;
  }
  function legend(items) {
    const l = el('div', 'legend');
    items.forEach((it) => {
      const s = el('span');
      const i = el('i', it.box ? 'box' : it.dot ? 'dot' : it.cls || null);
      if (it.box || it.dot) i.style.background = it.color; else i.style.color = it.color;
      s.appendChild(i); s.appendChild(document.createTextNode(it.name));
      l.appendChild(s);
    });
    return l;
  }
  function table(headers, rows, numeric) {
    const wrap = el('div', 'tbl');
    const t = el('table');
    const tr = el('tr');
    headers.forEach((h, k) => tr.appendChild(el('th', numeric && numeric(k) ? 'num' : null, h)));
    const thead = el('thead'); thead.appendChild(tr); t.appendChild(thead);
    const tb = el('tbody');
    rows.forEach((r) => { const row = el('tr'); r.forEach((v, k) => row.appendChild(el('td', numeric && numeric(k) ? 'num' : null, v))); tb.appendChild(row); });
    t.appendChild(tb); wrap.appendChild(t);
    return wrap;
  }

  // ── Charts (Observable Plot) ─────────────────────────────────────────────
  // Plot colours are literal hex: Plot reads them as identity colours. They
  // mirror --plot-11/22/33 and passed the dataviz validator on this sheet.
  const PLOT_HEX = { Orchards: '#199e70', Canyon: '#d95926', Confluence: '#3987e5' };
  const HEX = { sheet: '#14181c', sheet2: '#191e23', sheet3: '#20262c', rule: '#2a3138', rule2: '#3a434c', ink: '#ebe7dd', ink2: '#b9b5aa', muted: '#8a877d', accent: '#e8b44c', bad: '#ef6b6b' };
  const PLOT_STYLE = { background: 'transparent', color: HEX.ink2, fontFamily: '"Geist Sans", system-ui, sans-serif', fontSize: '12px', overflow: 'visible' };
  const DASHES = [null, '5,4', '1.5,3.5', '8,3,2,3'];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const shortDate = (d) => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(d || ''); return m ? `${MONTHS[+m[2] - 1]} ${+m[3]}` : ''; };
  const dayNumber = (d) => { const t = Date.parse((d || '').slice(0, 10)); return fin(t) ? t / 86400000 : NaN; };
  // Date ticks over a closure axis: the first closure, then the first closure at
  // least `gap` days after the previous tick.
  function dateTicks(dates, gap) {
    const out = [];
    let last = -Infinity;
    dates.forEach((d, i) => { const t = dayNumber(d); if (fin(t) && t - last >= gap) { out.push(i); last = t; } });
    return out;
  }
  const plotHex = (short) => PLOT_HEX[short] || HEX.ink2;
  const plotLabel = (w) => `Plot ${w.seed} · ${w.short}`;
  const isDim = (M, short) => !!M.focus && M.focus !== short;
  const closureX = (M) => ({
    type: 'linear', domain: [0, Math.max(1, M.points.length - 1)], label: null, tickSize: 0,
    ticks: dateTicks(M.points.map((p) => p.date), 6), tickFormat: (k) => shortDate(M.points[k] && M.points[k].date),
  });

  // Draw a Plot figure into a host at its real width, redrawn when the width changes.
  function figure(host, build) {
    observeWidth(host, () => {
      const w = Math.round(host.clientWidth);
      if (!w) return;
      const fig = build(w);
      host.replaceChildren(fig);
    });
  }
  // Pointer wiring: `rowsAt(datum)` lists the tooltip rows for the pointed datum.
  function wire(M, fig, title, rowsAt, { pick = true, sync = false } = {}) {
    let last = null;
    fig.addEventListener('pointermove', (ev) => { last = ev; });
    fig.addEventListener('pointerleave', () => { hideTip(); if (sync) M.hover(null); });
    fig.addEventListener('input', () => {
      const d = fig.value;
      if (!d || !last) { hideTip(); if (sync) M.hover(null); return; }
      const t = title(d);
      showTip(last, t[0], t[1], rowsAt(d));
      if (sync) M.hover(d.i);
    });
    if (pick) { fig.style.cursor = 'pointer'; fig.addEventListener('click', () => { const d = fig.value; if (d && Number.isInteger(d.i)) M.pick(d.i); }); }
  }
  const closureMeta = (M, i) => (M.points[i].kind === 'gap' ? 'report not stored' : `${shortDate(M.points[i].date)}${M.points[i].changed ? '' : ' · changed nothing'} · click to read this closure`);

  // Move the shared hover line across every census figure.
  function placeHover(M, i) {
    M.syncTargets = M.syncTargets.filter((t) => t.fig.isConnected);
    M.syncTargets.forEach(({ fig, line }) => {
      if (i === null || i === undefined) { line.style.display = 'none'; return; }
      const x = fig.scale('x').apply(i), yr = fig.scale('y').range;
      const host = fig.parentElement;
      if (!host) return;
      if (line.parentElement !== host) host.appendChild(line);
      line.style.left = `${x}px`;
      line.style.top = `${Math.min(...yr)}px`;
      line.style.height = `${Math.abs(yr[0] - yr[1])}px`;
      line.style.display = 'block';
    });
    document.querySelectorAll('.ledger tr[data-i]').forEach((tr) => tr.classList.toggle('hot', i !== null && +tr.dataset.i === i));
  }

  // A plain-titled card with a direction tag, a Table button and "What is this?".
  function chartCard(spec) {
    const c = el('div', 'card');
    const head = el('div', 'chead');
    head.appendChild(el('h3', null, spec.title));
    const tools = el('div', 'tools');
    if (spec.better !== 'none') tools.appendChild(directionTag(spec.better));
    head.appendChild(tools);
    c.appendChild(head);
    if (spec.def) c.appendChild(el('p', 'def', spec.def));
    const body = el('div');
    c.appendChild(body);
    const tableBox = el('div');
    tableBox.hidden = true;
    c.appendChild(tableBox);
    if (spec.why || spec.how || spec.path) c.appendChild(about(spec));
    const setTable = (build) => {
      const b = el('button', 'tbtn', 'Table');
      b.type = 'button';
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', () => {
        const on = b.getAttribute('aria-pressed') !== 'true';
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
        b.textContent = on ? 'Chart' : 'Table';
        if (on && !tableBox.firstChild) { const [h, r] = build(); tableBox.appendChild(table(h, r, (k) => k > 0)); }
        body.hidden = on;
        tableBox.hidden = !on;
      });
      tools.appendChild(b);
    };
    return { card: c, body, setTable };
  }

  // Readings over every closure. One series: one chart, three plot curves.
  // Several series (or a band): one row per plot, the lead series in the plot's
  // colour, the rest grey and told apart by dash.
  // spec.series: [{ name, read(pt, w), detail?(pt, w) }]; spec.band?: { name, lo, hi };
  // spec.ref?(w) → { y, label }; spec.log; spec.unit; spec.yFmt; spec.tipFmt.
  function closureLines(M, spec) {
    const c = chartCard(spec);
    const multi = spec.series.length > 1 || !!spec.band;
    const rows = [];
    M.worlds.forEach((w) => M.points.forEach((pt, i) => {
      if (pt.kind !== 'world') return;
      spec.series.forEach((s, si) => { const v = num(s.read(pt, w)); if (fin(v)) rows.push({ i, w: w.short, si, v }); });
    }));
    const bands = [];
    if (spec.band) M.worlds.forEach((w) => M.points.forEach((pt, i) => { if (pt.kind !== 'world') return; const lo = num(spec.band.lo(pt, w)), hi = num(spec.band.hi(pt, w)); if (fin(lo) && fin(hi)) bands.push({ i, w: w.short, lo, hi }); }));
    const refs = spec.ref ? M.worlds.map((w) => { const r = spec.ref(w); return r && fin(r.y) ? { w: w.short, y: r.y, label: r.label } : null; }).filter(Boolean) : [];
    const fmtV = spec.tipFmt || fmt;
    const yFmt = spec.yFmt || fmtTick;
    const fy = multi ? 'w' : undefined;
    const host = el('div', 'fig');
    c.body.appendChild(host);
    figure(host, (width) => {
      const marks = [
        Plot.ruleX([M.sel], { x: (d) => d, stroke: HEX.accent, strokeOpacity: 0.6 }),
        spec.band ? Plot.areaY(bands, { x: 'i', y1: 'lo', y2: 'hi', fy, fill: (d) => plotHex(d.w), fillOpacity: 0.16, curve: 'step' }) : null,
        refs.length ? Plot.ruleY(refs, { y: 'y', fy: multi ? 'w' : undefined, stroke: HEX.bad, strokeOpacity: 0.7, strokeDasharray: '4,4' }) : null,
        refs.length ? Plot.text(refs, { y: 'y', fy: multi ? 'w' : undefined, text: 'label', frameAnchor: 'left', dx: 4, dy: -7, textAnchor: 'start', fill: HEX.ink2, stroke: HEX.sheet, strokeWidth: 3, paintOrder: 'stroke' }) : null,
      ];
      spec.series.forEach((s, si) => {
        const data = rows.filter((r) => r.si === si);
        marks.push(Plot.line(data, { x: 'i', y: 'v', z: 'w', fy, stroke: (d) => (multi && si > 0 ? HEX.ink2 : plotHex(d.w)), strokeOpacity: (d) => (isDim(M, d.w) ? 0.18 : multi && si > 0 ? 0.6 : 1), strokeWidth: si === 0 ? 2 : 1.4, strokeDasharray: multi ? DASHES[si] : null }));
      });
      marks.push(Plot.dot(rows.filter((r) => r.i === M.sel && (r.si === 0 || !multi)), { x: 'i', y: 'v', fy, r: 4, fill: (d) => plotHex(d.w), stroke: HEX.sheet, strokeWidth: 2 }));
      marks.push(Plot.ruleX(rows.filter((r) => r.si === 0), Plot.pointerX({ x: 'i', fy, stroke: HEX.ink2, strokeOpacity: 0.45, maxRadius: 60 })));
      const fig = Plot.plot({
        width, height: multi ? M.worlds.length * 118 + 40 : (spec.height || 230), style: PLOT_STYLE,
        marginLeft: 52, marginRight: multi ? 96 : 16, marginTop: 16, marginBottom: 28,
        x: closureX(M),
        y: { grid: true, nice: true, type: spec.log ? 'symlog' : 'linear', zero: !spec.log && spec.zero !== false, label: null, ticks: multi ? 3 : 4, tickFormat: yFmt },
        fy: multi ? { domain: M.worlds.map((w) => w.short), label: null, padding: 0.22, tickFormat: (s) => `Plot ${(M.worlds.find((w) => w.short === s) || {}).seed} · ${s}` } : undefined,
        color: { type: 'identity' },
        marks: marks.filter(Boolean),
      });
      wire(M, fig, (d) => [`${M.points[d.i].title}`, closureMeta(M, d.i)], (d) => {
        const ws = multi ? M.worlds.filter((w) => w.short === d.w) : M.worlds;
        return ws.flatMap((w) => spec.series.map((s, si) => {
          const pt = M.points[d.i];
          const v = pt.kind === 'world' ? num(s.read(pt, w)) : NaN;
          const det = s.detail && pt.kind === 'world' ? s.detail(pt, w) : '';
          return { color: multi && si > 0 ? HEX.ink2 : plotHex(w.short), name: `${multi ? s.name : plotLabel(w)}${det ? ' · ' + det : ''}`, value: fin(v) ? fmtV(v) : 'not measured' };
        }));
      });
      return fig;
    });
    if (multi) c.body.appendChild(legend(spec.series.map((s, si) => ({ name: s.name, color: si === 0 ? HEX.ink : HEX.ink2, cls: si === 1 ? 'dash' : si === 2 ? 'dots' : si === 3 ? 'dash' : null })).concat(spec.band ? [{ name: spec.band.name, color: HEX.ink2, box: true }] : []), si0Note(spec)));
    c.setTable(() => {
      const headers = ['Closure'];
      M.worlds.forEach((w) => { spec.series.forEach((s) => headers.push(`${w.short} · ${s.name}`)); if (spec.band) headers.push(`${w.short} · ${spec.band.name}`); });
      const out = [];
      for (let i = M.points.length - 1; i >= 0; i--) {
        const pt = M.points[i];
        const row = [pt.title];
        M.worlds.forEach((w) => {
          spec.series.forEach((s) => { const v = pt.kind === 'world' ? num(s.read(pt, w)) : NaN; row.push(pt.kind !== 'world' ? 'not stored' : fin(v) ? fmtV(v) : 'not measured'); });
          if (spec.band) { const lo = pt.kind === 'world' ? num(spec.band.lo(pt, w)) : NaN, hi = pt.kind === 'world' ? num(spec.band.hi(pt, w)) : NaN; row.push(fin(lo) ? `${fmtV(lo)} – ${fmtV(hi)}` : 'not measured'); }
        });
        out.push(row);
      }
      return [headers, out];
    });
    return c.card;
  }
  const si0Note = (spec) => (spec.series.length > 1 ? `${spec.series[0].name} in the plot's colour` : '');

  // Through one run: the read closure (plot colour) against the one before
  // (grey) at every checkpoint, one column per plot.
  function checkpointLines(M, spec) {
    const c = chartCard(spec);
    const sel = M.points[M.sel], j = M.prevOf(M.sel), prev = j >= 0 ? M.points[j] : null;
    const runs = [prev, sel].filter(Boolean);
    const rows = [];
    runs.forEach((pt) => M.worlds.forEach((w) => samplesOf(pt.rep, w.seed).forEach((s) => {
      const v = num(spec.read(s, pt, w)), t = num(s.tick);
      if (fin(v) && fin(t)) rows.push({ t, w: w.short, v, shown: pt === sel });
    })));
    const fmtV = spec.tipFmt || fmt;
    const host = el('div', 'fig');
    c.body.appendChild(host);
    figure(host, (width) => {
      const fig = Plot.plot({
        width, height: spec.height || 230, style: PLOT_STYLE, marginLeft: 52, marginRight: 16, marginTop: 24, marginBottom: 30,
        fx: { domain: M.worlds.map((w) => w.short), label: null, padding: 0.12, tickFormat: (s) => `Plot ${(M.worlds.find((w) => w.short === s) || {}).seed} · ${s}` },
        x: { label: null, ticks: 4, tickFormat: (t) => (t === 100 ? 'tick 100' : String(t)) },
        y: { grid: true, nice: true, type: spec.log ? 'symlog' : 'linear', zero: !spec.log && spec.zero !== false, label: null, ticks: 4, tickFormat: spec.yFmt || fmtTick },
        color: { type: 'identity' },
        marks: [
          Plot.line(rows.filter((r) => !r.shown), { x: 't', y: 'v', fx: 'w', stroke: HEX.muted, strokeWidth: 1.4 }),
          Plot.line(rows.filter((r) => r.shown), { x: 't', y: 'v', fx: 'w', stroke: (d) => plotHex(d.w), strokeOpacity: (d) => (isDim(M, d.w) ? 0.25 : 1), strokeWidth: 2 }),
          Plot.ruleX(rows.filter((r) => r.shown), Plot.pointerX({ x: 't', fx: 'w', stroke: HEX.ink2, strokeOpacity: 0.45 })),
        ],
      });
      wire(M, fig, (d) => [`Plot ${(M.worlds.find((w) => w.short === d.w) || {}).seed} · ${d.w} · tick ${d.t}`, ''], (d) => rows.filter((r) => r.w === d.w && r.t === d.t).sort((a, b) => b.shown - a.shown).map((r) => ({ color: r.shown ? plotHex(r.w) : HEX.muted, name: r.shown ? `${sel.name} (read)` : `${prev ? prev.name : ''} (before)`, value: fmtV(r.v) })), { pick: false });
      return fig;
    });
    c.body.appendChild(legend([{ name: `${sel.name} (read)`, color: HEX.ink }].concat(prev ? [{ name: `${prev.name} (before)`, color: HEX.muted }] : [])));
    if (spec.log) c.body.appendChild(el('p', 'small', 'Log scale, so the early boom and the late plateau both fit.'));
    c.setTable(() => {
      const ticks = [...new Set(rows.map((r) => r.t))].sort((a, b) => a - b);
      const headers = ['Tick'];
      M.worlds.forEach((w) => { headers.push(`${w.short} · read`); if (prev) headers.push(`${w.short} · before`); });
      return [headers, ticks.map((t) => [String(t), ...M.worlds.flatMap((w) => { const a = rows.find((r) => r.w === w.short && r.t === t && r.shown), b = rows.find((r) => r.w === w.short && r.t === t && !r.shown); return prev ? [a ? fmtV(a.v) : '—', b ? fmtV(b.v) : '—'] : [a ? fmtV(a.v) : '—']; })])];
    });
    return c.card;
  }

  // Before and after per item as dumbbells: grey for the closure before, the
  // plot's colour for the closure read, one column per plot, one label column.
  // spec.items(pt, w) → [{ key, name, value }]; spec.top folds the rest into "other".
  function dumbbells(M, spec) {
    const c = chartCard(spec);
    const sel = M.points[M.sel], j = M.prevOf(M.sel), prev = j >= 0 ? M.points[j] : null;
    const fmtV = spec.fmt || fmt;
    const per = M.worlds.map((w) => ({ w, now: spec.items(sel, w) || [], was: prev ? spec.items(prev, w) || [] : [] }));
    const keys = [], names = {};
    per.forEach((p) => p.now.concat(p.was).forEach((it) => { if (!keys.includes(it.key)) { keys.push(it.key); names[it.key] = it.name; } }));
    const val = (arr, k) => { const it = arr.find((x) => x.key === k); return it ? num(it.value) : NaN; };
    let cats = keys.map((k) => ({ key: k, name: names[k], cells: per.map((p) => ({ a: val(p.now, k), b: val(p.was, k) })) }));
    if (spec.sort !== false) cats.sort((x, y) => Math.max(0, ...y.cells.map((q) => num(q.a) || 0)) - Math.max(0, ...x.cells.map((q) => num(q.a) || 0)));
    if (spec.top && cats.length > spec.top + 1) {
      const rest = cats.slice(spec.top);
      const part = (xs) => (xs.some(fin) ? sum(xs) : NaN);
      cats = cats.slice(0, spec.top).concat([{ key: 'other', name: `other (${rest.length} kinds)`, cells: M.worlds.map((w, wi) => ({ a: part(rest.map((r) => r.cells[wi].a)), b: part(rest.map((r) => r.cells[wi].b)) })) }]);
    }
    const rows = [];
    cats.forEach((cat) => M.worlds.forEach((w, wi) => rows.push({ w: w.short, cat: cat.name, a: cat.cells[wi].a, b: cat.cells[wi].b })));
    const longest = Math.max(6, ...cats.map((cat) => cat.name.length));
    const host = el('div', 'fig');
    c.body.appendChild(host);
    figure(host, (width) => {
      const fig = Plot.plot({
        width, height: cats.length * 26 + 52, style: PLOT_STYLE, marginLeft: Math.min(200, longest * 6.6 + 14), marginRight: 58, marginTop: 24, marginBottom: 28,
        fx: { domain: M.worlds.map((w) => w.short), label: null, padding: 0.18, tickFormat: (s) => `Plot ${(M.worlds.find((w) => w.short === s) || {}).seed} · ${s}` },
        y: { domain: cats.map((cat) => cat.name), label: null, tickSize: 0 },
        x: { grid: true, nice: true, zero: true, label: null, ticks: 3, tickFormat: spec.tickFmt || fmtV },
        color: { type: 'identity' },
        marks: [
          Plot.link(rows.filter((r) => fin(r.a) && fin(r.b)), { fx: 'w', y1: 'cat', y2: 'cat', x1: 'b', x2: 'a', stroke: HEX.rule2, strokeWidth: 2 }),
          Plot.dot(rows.filter((r) => fin(r.b)), { fx: 'w', y: 'cat', x: 'b', r: 3.6, fill: HEX.muted, stroke: HEX.sheet, strokeWidth: 1.5 }),
          Plot.dot(rows.filter((r) => fin(r.a)), { fx: 'w', y: 'cat', x: 'a', r: 4.8, fill: (d) => plotHex(d.w), fillOpacity: (d) => (isDim(M, d.w) ? 0.3 : 1), stroke: HEX.sheet, strokeWidth: 1.5 }),
          Plot.text(rows.filter((r) => fin(r.a)), { fx: 'w', y: 'cat', x: (d) => Math.max(d.a, fin(d.b) ? d.b : 0), text: (d) => fmtV(d.a), dx: 9, textAnchor: 'start', fill: HEX.ink, fontWeight: 600 }),
          Plot.ruleY(rows, Plot.pointerY({ fx: 'w', y: 'cat', stroke: HEX.ink2, strokeOpacity: 0.2, strokeWidth: 18, maxRadius: 14 })),
        ],
      });
      wire(M, fig, (d) => [`Plot ${(M.worlds.find((w) => w.short === d.w) || {}).seed} · ${d.w} · ${d.cat}`, ''], (d) => [{ color: plotHex(d.w), name: `${sel.name} (read)`, value: fin(d.a) ? fmtV(d.a) : 'not measured' }].concat(prev ? [{ color: HEX.muted, name: `${prev.name} (before)`, value: fin(d.b) ? fmtV(d.b) : 'not measured' }] : []), { pick: false });
      return fig;
    });
    c.body.appendChild(legend([{ name: `${sel.name} (read)`, color: HEX.ink, dot: true }].concat(prev ? [{ name: `${prev.name} (before)`, color: HEX.muted, dot: true }] : [])));
    c.setTable(() => {
      const headers = ['Item'];
      M.worlds.forEach((w) => { headers.push(`${w.short} · read`); if (prev) headers.push(`${w.short} · before`); });
      const f = (v) => (fin(v) ? fmtV(v) : 'not measured');
      return [headers, cats.map((cat) => [cat.name, ...cat.cells.flatMap((q) => (prev ? [f(q.a), f(q.b)] : [f(q.a)]))])];
    });
    return c.card;
  }

  // ── Sections ─────────────────────────────────────────────────────────────
  function part(id, title, lede) {
    const s = el('section', 'part');
    s.id = id;
    s.appendChild(el('h2', null, title));
    if (lede) s.appendChild(el('p', 'lede', lede));
    return s;
  }

  // Survey-sheet header fields: span, closures, changed, and the plot strip map.
  function renderFields(M) {
    const box = document.getElementById('fields');
    box.replaceChildren();
    const worldPts = M.points.filter((p) => p.kind === 'world');
    const changed = worldPts.filter((p) => p.changed).length;
    const first = M.points[M.firstIndex] || worldPts[0], last = worldPts[worldPts.length - 1];
    const field = (label, value, small, cls) => {
      const f = el('div', 'field' + (cls ? ' ' + cls : ''));
      f.appendChild(el('div', 'fl', label));
      const v = el('div', 'fv', value);
      if (small) v.appendChild(el('small', null, ' ' + small));
      f.appendChild(v);
      return f;
    };
    box.appendChild(field('Record span', `${shortDate(first && first.date)} – ${shortDate(last && last.date)}`, ''));
    box.appendChild(field('Closures', String(worldPts.length), `since ${first ? first.id || first.name : '—'}`));
    box.appendChild(field('Changed the run', String(changed), `${worldPts.length - changed} changed nothing`));
    const plots = el('div', 'field plots');
    plots.appendChild(el('div', 'fl', 'Plots: click one to bring it forward'));
    const map = el('div', 'plotmap' + (M.focus ? ' focused' : ''));
    M.worlds.forEach((w) => {
      const b = el('button', 'plotbtn');
      b.type = 'button';
      b.style.setProperty('--c', plotHex(w.short));
      b.setAttribute('aria-pressed', M.focus === w.short ? 'true' : 'false');
      b.title = WORLD_INFO[w.short] || '';
      b.appendChild(el('i'));
      b.appendChild(el('b', null, String(w.seed)));
      b.appendChild(document.createTextNode(w.short));
      b.addEventListener('click', () => { M.focus = M.focus === w.short ? null : w.short; M.render(); });
      map.appendChild(b);
    });
    plots.appendChild(map);
    box.appendChild(plots);
  }

  // One line under the header: what the read closure did, answer first.
  function renderNote(M, app) {
    const v = verdictOf(M);
    const pt = M.points[M.sel], j = M.prevOf(M.sel);
    const p = el('p', 'note');
    p.appendChild(el('span', 'badge ' + v.badge, v.badge === 'ok' ? 'OK' : v.badge === 'check' ? 'CHECK' : 'SAME'));
    const t = el('span');
    t.appendChild(el('b', null, pt.name));
