[workspace]
resolver = "2"
members = [
  "crates/petri-core",
  "crates/petri-server",
  "crates/petri-cli",
  "crates/petri-graph",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["Petri Developers"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
rand = { version = "0.8", features = ["small_rng"] }
slotmap = "1.0"
anyhow = "1.0"
axum = { version = "0.8", features = ["ws", "json"] }
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
rmp-serde = "1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
tower = "0.5"
serde_json = "1.0"
