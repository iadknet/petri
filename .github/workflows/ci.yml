name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy-docs:
    name: Policy and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify policy and documentation
        run: |
          scripts/check-doc-harness.sh --mode strict
          scripts/check-architecture-harness.sh --mode strict
          scripts/check-plan-harness.sh --mode strict
      - name: Verify pinned security-tooling harnesses
        run: |
          scripts/security/test-gitleaks-scan.sh
          scripts/security/test-skillspector-scan.sh

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify toolchain declared by rust-toolchain.toml
        run: rustup show active-toolchain
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Run frontend tests
        run: npm --prefix frontend run test
      - name: Build frontend
        run: npm --prefix frontend run build
