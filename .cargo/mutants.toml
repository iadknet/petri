# cargo-mutants configuration for `make rust-mutants` (see docs/workflow.md).
#
# cargo-mutants 27.1.0 has no config keys for a fixed-seconds timeout or the
# job count; scripts/rust-mutants passes `--jobs` (MUTANTS_JOBS, default 2)
# and an optional `--timeout` (MUTANTS_TIMEOUT) on the command line.

# Optimize repeated simulation tests while retaining test assertions and
# overflow checks. The measured profile is defined in the workspace manifest.
profile = "mutants"
# Keep automatic doctest coverage; nextest did not improve the measured pilot.
test_tool = "cargo"

# Per-mutant test timeout: the tool's default 5x the baseline test time, with
# a two minute floor. A timed-out mutant is reported as a survivor the
# implementer must triage, so the caps are generous: a mutant that runs long
# on a loaded host must not turn into a false survivor and a retriage loop.
timeout_multiplier = 5.0
minimum_test_timeout = 120.0
# Builds have no timeout by default; cap them so a runaway build ends the run,
# but leave room for a host that is also compiling elsewhere.
build_timeout_multiplier = 8.0
# Integration-test helpers and benches are not code under test.
exclude_globs = ["**/tests/**", "**/benches/**"]
# Do not let a mutant that only trips a lint count as unviable.
cap_lints = true
