[package]
name = "v3-lab"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
description = "Capability assay lab (T22): lab selection and tasks never enter production."

[lints]
workspace = true

[[bin]]
name = "v3-lab"
path = "src/main.rs"

[features]
default = ["telemetry"]
# T21 run telemetry; `--no-default-features` is the reference build without it.
# The lab accepts the flag and exports nothing until T21.F06.
telemetry = ["dep:v3-telemetry", "v3-core/telemetry-seams"]

[dependencies]
v3-core = { path = "../v3-core" }
v3-telemetry = { path = "../v3-telemetry", optional = true }
clap = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
# Stored numeric readings must round-trip without changing their last bit.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = { workspace = true }
slotmap = { workspace = true }

[dev-dependencies]
proptest = "1.11"
