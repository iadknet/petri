[package]
name = "v3-telemetry"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
description = "Run identity and bounded OTLP log export for the Petri binaries (T21)."
build = "build.rs"

[lints]
workspace = true

[dependencies]
v3-core = { path = "../v3-core" }
rand = { workspace = true }
serde_json = { workspace = true }
futures-executor = "=0.3.32"
opentelemetry = { version = "=0.33.0", default-features = false, features = ["logs"] }
opentelemetry_sdk = { version = "=0.33.0", default-features = false, features = ["logs"] }
opentelemetry-otlp = { version = "=0.33.0", default-features = false, features = ["logs", "http-proto", "reqwest-blocking-client"] }
# The exporter's HTTP client (`export`) decodes partial-success responses; all
# three crates are already in the exporter's dependency tree.
opentelemetry-http = { version = "=0.33.0", default-features = false, features = ["reqwest-blocking"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking"] }
async-trait = "=0.1.89"
# The export client and the in-test OTLP receiver (`testing`) decode OTLP
# messages; both crates are already in the exporter's dependency tree.
opentelemetry-proto = { version = "=0.33.0", default-features = false, features = ["gen-tonic-messages", "logs"] }
prost = "=0.14.4"
