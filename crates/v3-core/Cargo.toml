[package]
name = "v3-core"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
serde = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
slotmap = { workspace = true }
noise = "0.9"

[features]
dhat-heap = ["dep:dhat"]
# Empty at T21.F01: the observation seams later T21 features add sit behind it,
# and only the binaries' `telemetry` feature enables it.
telemetry-seams = []

[dependencies.dhat]
version = "0.3"
optional = true

[dev-dependencies]
criterion = "0.5"
proptest = "1.11"

[[bench]]
name = "tick"
harness = false
