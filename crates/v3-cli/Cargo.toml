[package]
name = "v3-cli"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "v3-cli"
path = "src/main.rs"

[dependencies]
v3-core = { path = "../v3-core" }
clap = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
# Stored numeric readings must round-trip without changing their last bit.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = { workspace = true }
same-file = "=1.0.6"
png = "=0.18.1"

[dev-dependencies]
proptest = "1.11"
