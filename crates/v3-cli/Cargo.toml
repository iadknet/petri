[package]
name = "v3-cli"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "v3-cli"
path = "src/main.rs"

[features]
default = ["telemetry"]
# T21 run telemetry; `--no-default-features` is the reference build without it.
telemetry = ["dep:v3-telemetry", "v3-core/telemetry-seams"]

[dependencies]
v3-core = { path = "../v3-core" }
v3-telemetry = { path = "../v3-telemetry", optional = true }
clap = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
# Stored numeric readings must round-trip without changing their last bit.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = { workspace = true }
same-file = "=1.0.6"
png = "=0.18.1"

[dev-dependencies]
proptest = "1.11"
