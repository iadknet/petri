[workspace]
members = [
    "crates/v3-core",
    "crates/v3-server",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["Petri Developers"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
rand = { version = "0.8", features = ["small_rng"] }
slotmap = "1.0"
serde_json = "1.0"
