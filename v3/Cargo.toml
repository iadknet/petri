[workspace]
members = [
    "crates/v3-core",
    "crates/v3-cli",
    "crates/v3-server",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["Petri Developers"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
rand = { version = "0.8", features = ["small_rng"] }
slotmap = "1.0"
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
tower = "0.4"
rayon = "1.10"
rmp-serde = "1.3"
futures-util = "0.3"
tracing = "0.1"

# ── Build Profiles ─────────────────────────────────────────────────────────
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true          # Keep debug symbols for profiling

[profile.profiling]
inherits = "release"
debug = true
strip = false
